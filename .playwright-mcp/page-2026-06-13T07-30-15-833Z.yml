                    - generic: "[9]"
                - superscript [ref=e163]: ": ch. 5"
              - paragraph [ref=e164]:
                - text: "\"지불인 갑이 00원을 수취인 을에게 보내다\" 형식의 거래는 소프트웨어 앱(비트코인 지갑앱 등)을 통해 블록체인 네트워크에 뿌려진다. 블록체인 네트워크의 노드들은 거래를 검증한 다음, 자신의 장부에 거래를 추가한다. 그리고 이 거래가 추가된 장부를 네트워크의 다른 노드들에 뿌린다."
