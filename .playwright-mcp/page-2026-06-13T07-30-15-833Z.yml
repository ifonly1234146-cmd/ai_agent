                - text: 의 노드는 부분 또는 전체의 블록체인을 가지고 있다. 이것이 페이팔과 같은 시스템에서 필요로 하는, 중앙 집중형
                - link "데이터베이스" [ref=e155] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/데이터베이스
                - text: 를 가지고 있을 필요가 없게 한다.
                - superscript [ref=e156]:
                  - link "[1]" [ref=e157] [cursor=pointer]:
                    - /url: "#cite_note-primer-1"
                    - generic: "[1]"
              - paragraph [ref=e159]:
                - text: 일반적인 장부에는 수표나 영수증 또는 약속어음의 교환내역이 기록되는 반면에, 블록체인은 그것 자체가 거래장부인 동시에 거래증서(수표, 영수증, 약속어음)이다. 비트코인에서는 거래들의 지불되지 않은 결과의 형태로 존재한다고 표현한다.
