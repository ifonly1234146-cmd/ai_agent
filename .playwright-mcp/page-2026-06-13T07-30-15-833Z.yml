            - paragraph [ref=e145]: 블록체인 아키텍처의 핵심적인 장점은 다음과 같은 것들이다.
            - paragraph [ref=e146]:
              - text: 블록체인은 대규모의 노드들 사이에서 각 노드에 분산 저장된 장부의 데이터를 항상 있도록 하는 합의 수렴
