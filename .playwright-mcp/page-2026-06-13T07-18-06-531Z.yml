                  - /url: //ko.wikipedia.org/wiki/악시오스?action=edit&redlink=1
                - text: (Axios on HBO)에서 새로 개발한
                - link "이글 프로세서" [ref=e273] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/이글_프로세서?action=edit&redlink=1
                - text: 는 127큐비트(qubit :양자컴퓨터 연산단위)를 처리할 수 있다며 100큐비트 이상 성능으로 기존 컴퓨터를 능가하는 새 이정표에 도달했다고 말했다.
              - paragraph [ref=e274]:
                - text: 현재 공인인증서는 2048비트 RSA 암호화 키를 사용하는데, 2048비트를 양자컴퓨터로 계산해 뚫으려면 큐비트가 두 배 이상 필요하다.
                - link "IDQ코리아" [ref=e275] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/IDQ코리아?action=edit&redlink=1
                - text: 최정운 박사는 "지금 개발된 양자컴퓨터가 100큐비트 미만인데, 현재 암호화 알고리즘을 깨려면 적어도 5000큐비트 이상 양자컴퓨터가 필요하다"고 말했다. IBM은 현재 65큐비트 양자컴퓨터
                - link "허밍버드" [ref=e276] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/허밍버드
                - text: 를 운용 중이다. 이들은 올해 127큐비트
                - link "이글" [ref=e277] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/이글
                - text: 에 이어, 내년 433큐비트
                - link "오스프리" [ref=e278] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/오스프리
                - text: ", 2024년 1121큐비트"
                - link "콘도르" [ref=e279] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/콘도르
                - text: 를 개발하겠다고 예고한 바 있다.
              - paragraph [ref=e280]:
                - text: 백한희 IBM 퀀텀연구소 박사는 "IBM은 65큐비트 퀀텀 시스템을 IBM 퀀텀 네트워크 고객사에 제공하고 있으며 현재 100큐비트 프로세서를 활용한 시스템을 구축하고 있다"며 "고전컴퓨팅만을 활용했을 때보다 큰 이점을 누리게 되는
                - link "퀀텀 어드밴티지" [ref=e281] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/퀀텀_어드밴티지
                - text: 는 1000큐비트를 달성했을 때 가능하다고 생각된다. IBM은 2023년까지 이를 달성할 수 있도록 노력하고 있다"고 밝혔다. IBM은 양자컴퓨터 25대를 보유 중이며 초전도체 방식에선 가장 앞서나가고 있는 기업이다.
