                - text: 에 있는 메릴랜드대 디스커버리 구역에 위치한다.
              - paragraph [ref=e226]:
                - text: 2023년 5월,
                - link "아이온큐" [ref=e227] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/아이온큐
                - text: 가 23년도 말까지 목표했던 29AQ 양자컴퓨터 시스템을 7개월 앞서 조기달성하였다. 2025년 목표인 64AQ부터는 슈퍼컴퓨터로는 절대로 따라잡을 수 없는 수준이며, 실제로 아이온큐의 피터 채프먼 CEO는 QWC(Quantum World Congress) 연설에서 "64AQ는 게임체인저가 될 것이며 양자컴퓨터의 진정한 가치를 보여줄 수 있는 제품일 것"이라고 설명하였다. 양자 기업 중 최초로 미국 시애틀에 양자컴퓨터 제조 공장을 지었다.
            - region "디웨이브" [ref=e228]:
              - generic [ref=e229]:
                - heading "디웨이브" [level=3] [ref=e230]: 디웨이브
                - generic [ref=e231]:
                  - text: "["
                  - link "편집" [ref=e232] [cursor=pointer]:
                    - /url: /w/index.php?title=%EC%96%91%EC%9E%90_%EC%BB%B4%ED%93%A8%ED%84%B0&action=edit&section=4
                  - text: "]"
              - paragraph [ref=e233]:
                - text: 2011년 5월 11일, 캐나다의 디웨이브에서 128큐비트 프로세스가 장착된 세계최초의 상용화 양자컴퓨터인 '디웨이브 원'을 내놓았으며
                - superscript [ref=e234]:
                  - link "[13]" [ref=e235] [cursor=pointer]:
                    - /url: "#cite_note-13"
                    - generic [ref=e236]: "[13]"
                - text: ", 5월 20일 1000만 달러의 가격으로 시장에 내놓았다. 디웨이브 원은 범용 양자 컴퓨터는 아니며, 양자 어닐링"
                - superscript [ref=e237]:
                  - link "[14]" [ref=e238] [cursor=pointer]:
                    - /url: "#cite_note-14"
                    - generic [ref=e239]: "[14]"
                - text: 이라는 특정한 양자 알고리즘에 특화된 하드웨어를 갖고 있다.
              - paragraph [ref=e240]:
                - text: 2013년
                - link "미국 항공우주국" [ref=e241] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/미국_항공우주국
                - text: 과 구글이 공동으로 설립할 인공지능 연구소에서 디웨이브 투를 구매할 계획이라고 밝혔다.
                - superscript [ref=e242]:
                  - link "[15]" [ref=e243] [cursor=pointer]:
                    - /url: "#cite_note-15"
                    - generic [ref=e244]: "[15]"
                - text: 이후 디웨이브는 디웨이브 원의 후속으로 512개의 큐비트를 사용하는 디워이브 투를 출시했는데 구글이 이를 구입했다. 이것은 머신러닝과 음성인식, 자연어 처리를 위해 방대한 데이터를 분석할 수 있고, 싱글코어 칩을 활용하는 일반 컴퓨터보다 1억배 이상 빠른 속도로 처리할 수 있는 것으로 알려졌다. 앞으로 100
                - link "큐비트" [ref=e245] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/큐비트
                - text: 정도 되는 양자컴퓨터가 등장한다면 전세계의 모든 하드드라이브의 데이터 저장용량을 가볍게 능가하게 될 것이다.
            - region "구글" [ref=e246]:
              - generic [ref=e247]:
                - heading "구글" [level=3] [ref=e248]: 구글
                - generic [ref=e249]:
                  - text: "["
                  - link "편집" [ref=e250] [cursor=pointer]:
                    - /url: /w/index.php?title=%EC%96%91%EC%9E%90_%EC%BB%B4%ED%93%A8%ED%84%B0&action=edit&section=5
                  - text: "]"
              - paragraph [ref=e251]:
                - text: 2019년
                - link "구글" [ref=e252] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/구글
                - text: 은
                - link "슈퍼컴퓨터" [ref=e253] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/슈퍼컴퓨터
                - text: 로 1만 년이 걸리는 연산을 200 초만에 해내는 53큐비트(qubit·양자컴퓨터 연산 단위) 성능의
                - link "시카모어 프로세서" [ref=e254] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/시카모어_프로세서?action=edit&redlink=1
                - text: 를 선보인 바 있다. 현존 가장 뛰어나다는 슈퍼컴퓨터를 양자컴퓨터가 뛰어넘은 이른바
                - link "양자우월성" [ref=e255] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/양자우월성
                - text: 단계에 도달한 것이다. 구글은 2019년 세계 최초로 슈퍼컴퓨터조차 풀기 어려운 문제를 자사의 53-큐비트 시커모어 양자프로세서를 이용해 해결했다. 2019년 10월 구글은 53큐비트 기반 양자 컴퓨터를 개발해 슈퍼컴퓨터가 1만 년 걸리는 계산을 3분20초 만에 풀 수 있다고 밝혔다.
              - paragraph [ref=e256]:
                - text: 2019년 10월 29일,
                - link "라이트코인 재단" [ref=e257] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/라이트코인_재단?action=edit&redlink=1
                - text: 공동 창업자 왕 신시가 트위터를 통해 “구글의 54 큐비트(양자컴퓨터의 기본 단위) 양자컴퓨터가
                - link "비트코인" [ref=e258] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/비트코인
                - text: 의 암호화를 풀려면 수백만 비트가 필요하다. 양자컴퓨터의 큐비트 단위가 매년 두 배로 늘어난다는 가정하에 비트코인을 깨는 데 약 15년이 걸릴 것”이라고 설명했다.
              - paragraph [ref=e259]:
                - text: 구글의 양자컴퓨터는 큐비트 수가 53개다.
                - link "표준과학연구원" [ref=e260] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/표준과학연구원
                - link "정연욱" [ref=e261] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/정연욱
                - text: 박사에 따르면 큐비트 수가 50개를 넘어서면 양자컴퓨터의 능력이 현재 디지털컴퓨터 중에서 성능이 가장 뛰어난 수퍼컴퓨터의 메모리 수준으로 올라선다. 구글의 양자컴퓨터가 양자우월성을 돌파했다는 건 그들이 가진 큐비트 수에서도 짐작할 수 있다. 정 박사는 큐비트 수가 60개가 되면 수퍼컴퓨터보다 성능이 1000배 이상 커지는 것이라고 했다.
              - paragraph [ref=e262]:
                - text: 사이버 보안 회사인
                - link "딥와치" [ref=e263] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/딥와치?action=edit&redlink=1
                - text: 의 제품 및 전략 담당 부사장인 마리사 리스 우드는 "오늘날의 유비쿼터스 RSA 암호화 알고리즘의 경우에 기존 컴퓨터는 2,048비트 디지털 키로 보호되는 통신을 중단하는 데 약 300조 년이 걸리지만 4,099 큐비트로 구동되는 양자 컴퓨터는 10초면 충분하다"고 말했다.
