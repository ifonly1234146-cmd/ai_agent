                - link "블로흐 구면" [ref=e115] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/블로흐_구면
            - paragraph [ref=e116]:
              - text: 양자 컴퓨터(quantum computer,
              - generic [ref=e117]:
                - link "문화어" [ref=e118] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/문화어
                - text: ":"
              - text: 량자 콤퓨터 )는 얽힘(entanglement)이나 중첩(superposition) 같은
              - link "양자역학" [ref=e119] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/양자역학
              - text: 적인 현상을 활용하여 자료를 처리하는
              - link "계산 기계" [ref=e120] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/컴퓨터
              - text: 이다.
              - superscript [ref=e121]:
                - link "[1]" [ref=e122] [cursor=pointer]:
                  - /url: "#cite_note-1"
                  - generic [ref=e123]: "[1]"
              - superscript [ref=e124]:
                - link "[2]" [ref=e125] [cursor=pointer]:
                  - /url: "#cite_note-2"
                  - generic [ref=e126]: "[2]"
              - superscript [ref=e127]:
                - link "[3]" [ref=e128] [cursor=pointer]:
                  - /url: "#cite_note-3"
                  - generic [ref=e129]: "[3]"
              - superscript [ref=e130]:
                - link "[4]" [ref=e131] [cursor=pointer]:
                  - /url: "#cite_note-4"
                  - generic [ref=e132]: "[4]"
              - text: 또한 그러한 방법을 '양자 컴퓨팅'(quantum computing)이라고 한다.
              - superscript [ref=e133]:
                - link "[5]" [ref=e134] [cursor=pointer]:
                  - /url: "#cite_note-5"
                  - generic [ref=e135]: "[5]"
            - paragraph [ref=e136]:
              - text: 양자 컴퓨팅은
              - link "컴퓨터 과학" [ref=e137] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/컴퓨터_과학
              - text: ·
              - link "물리학" [ref=e138] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/물리학
              - text: ·
              - link "수학" [ref=e139] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/수학
              - text: 의 여러 측면으로 이루어진 종합적 분야로서 양자역학을 활용해 기존의 컴퓨터보다 빠르게 복잡한 문제를 해결할 수 있다.
            - paragraph [ref=e140]:
              - text: 고전적인(전통적인) 컴퓨터에서
              - link "자료" [ref=e141] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/자료
              - text: 의 양은
              - link "비트" [ref=e142] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/비트_(단위)
              - text: 로 측정된다. 양자 컴퓨터에서 자료의 양은
              - link "큐비트" [ref=e143] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/큐비트
              - text: 로 측정된다. 양자 계산의 기본적인 원칙은 입자의 양자적 특성이 자료를 나타내고 구조화할 수 있다는 것과 양자적 메카니즘이 고안되어 이러한 자료들에 대한
              - link "연산" [ref=e144] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/연산_(수학)
              - text: 을 수행할 수 있도록 만들어질 수 있다는 것에 기인한다. 양자 컴퓨팅이 여전히 실험적인 초기단계에 머물러있지만, 매우 작은 수의
              - link "큐비트" [ref=e145] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/큐비트
              - text: 를 가지고 양자 수치 계산이 수행되는지에 관한 연구들이 행해져 왔다.
              - superscript [ref=e146]:
                - link "[6]" [ref=e147] [cursor=pointer]:
                  - /url: "#cite_note-6"
                  - generic [ref=e148]: "[6]"
              - superscript [ref=e149]:
                - link "[7]" [ref=e150] [cursor=pointer]:
                  - /url: "#cite_note-7"
                  - generic [ref=e151]: "[7]"
            - paragraph [ref=e152]:
              - text: 양자 정보 통신은 정보 사회의 패러다임을 바꿀 신기술로 여겨졌다.
              - superscript [ref=e153]:
                - link "[8]" [ref=e154] [cursor=pointer]:
                  - /url: "#cite_note-8"
                  - generic [ref=e155]: "[8]"
              - text: 양자 정보 통신을 활용한 양자 컴퓨터는 한 개의 처리 장치에서 여러 계산을 동시에 처리할 수 있어 정보처리량과 속도가 지금까지의 컴퓨터에 비해 뛰어나다. 하지만 정보 교환을 위해 발생하는
              - link "양자 얽힘" [ref=e156] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/양자_얽힘
              - text: (quantum entanglement)에 큰 비용이 드는 단점이 있어 양자 정보 통신에서 필수적이지만 비용이 많이 발생하는 얽힘을 가능한 한 줄이고 부정보(side information)를 활용해 정보를 교환하는 방식이 개발되었다.
              - superscript [ref=e157]:
                - link "[9]" [ref=e158] [cursor=pointer]:
                  - /url: "#cite_note-9"
                  - generic [ref=e159]: "[9]"
          - region "양자 컴퓨팅과 계산 복잡도 이론" [ref=e160]:
            - generic [ref=e161]:
              - heading "양자 컴퓨팅과 계산 복잡도 이론" [level=2] [ref=e162]: 양자 컴퓨팅과 계산 복잡도 이론
              - generic [ref=e163]:
                - text: "["
                - link "편집" [ref=e164] [cursor=pointer]:
                  - /url: /w/index.php?title=%EC%96%91%EC%9E%90_%EC%BB%B4%ED%93%A8%ED%84%B0&action=edit&section=1
                - text: "]"
            - figure "BQP와 다른 문제 공간의 관계 추정 도식[10]" [ref=e165]:
              - link [ref=e166] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/파일:BQP_complexity_class_diagram.svg
                - img [ref=e167]
              - generic [ref=e168]:
                - text: BQP와 다른 문제 공간의 관계 추정 도식
                - superscript [ref=e169]:
                  - link "[10]" [ref=e170] [cursor=pointer]:
                    - /url: "#cite_note-10"
                    - generic [ref=e171]: "[10]"
            - paragraph [ref=e172]:
              - text: 이 절에서는 양자 컴퓨터의 능력에 대해 현재 알려진 수학적인 결과를 조사한다. 이 결과는 양자 컴퓨터와 관계된
              - link "계산 복잡도 이론" [ref=e173] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/계산_복잡도_이론
              - text: 과
              - link "계산 이론" [ref=e174] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/계산_이론
              - text: 에서 나온 것이다. 양자컴퓨터의 언어는 00,01,10,11이다.
            - paragraph [ref=e175]:
              - text: 양자 컴퓨터가 효율적으로 풀 수 있는 문제군을
              - link "BQP" [ref=e177] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/BQP
              - text: 라 한다. 여기서 효율적이란, '정해진 오차범위 내에서 다항 시간 안에' 푼다는 뜻이다. 양자 컴퓨터는 확률적 알고리즘을 실행할 뿐이므로 양자 컴퓨터에 대한 BQP는 기존 컴퓨터에 대한
              - link "BPP" [ref=e179] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/유계오차_확률적_다항시간
              - text: 에 대응한다. BPP는 오차 확률을 1/4로 제한하며 다항 시간에 풀 수 있는 문제의 집합으로 정의된다.
              - superscript [ref=e180]:
                - link "[11]" [ref=e181] [cursor=pointer]:
                  - /url: "#cite_note-11"
                  - generic [ref=e182]: "[11]"
              - text: 양자 컴퓨터가 문제를 '푼다'는 것은 모든 예제에 대해 높은 확률로 올바른 결과가 나온다는 뜻이다. 그 결과가 다항 시간에 나왔다면 그 문제는 BQP에 속한다.
            - paragraph [ref=e183]:
              - text: BQP는
              - link "NP-완전" [ref=e184] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/NP-완전
              - text: 과 서로소 집합이고,
              - link "P" [ref=e186] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/P_(복잡도)
              - text: 가 BQP의 진부분집합일 것으로 추정되나 아직 증명되지는 않았다.
              - link "소인수 분해" [ref=e187] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/소인수_분해
              - text: 와
              - link "이산 로그" [ref=e188] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/이산_로그
              - text: 문제가 BQP에 속한다. 두 문제 모두 NP문제이고, BPP가 아닐 것으로 추정되므로 P에도 속하지 않는다. 또한 NP-완전도 아닐 것으로 추정된다. 양자 컴퓨터가 NP-완전 문제를 다항 시간에 풀 수 있다는 잘못된 인식이 널리 퍼져 있으나 확실히 증명된 바는 없다. 양자 컴퓨터도 NP-완전 문제는 다항 시간에 풀 수 없다는 견해가 일반적이다.
            - paragraph [ref=e189]:
              - text: 양자 컴퓨터의 연산자는 벡터에 특정한 행렬을 곱해서 바꾸는 것으로 생각할 수 있다. 행렬을 곱하는 연산은
              - link "선형" [ref=e190] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/선형성
              - text: 연산이다. 대니얼 S. 에이브럼스와
              - link "세트 로이드" [ref=e191] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/세트_로이드?action=edit&redlink=1
              - text: 는 양자 컴퓨터가 '비선형' 을 계산할 수 있다면 NP-완전 문제를 다항 시간에 풀 수 있음을 보였다.
              - link "#P-완전" [ref=e192] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/샤프-P-완전
              - text: 문제 역시 가능하다. 그러나 그러한 기계는 불가능하다고 보았다.
            - paragraph [ref=e193]:
              - text: 양자 컴퓨터가 기존 컴퓨터보다 빠를 수는 있지만, 기존 컴퓨터로 풀 수 없는 문제는 양자 컴퓨터 역시 풀 수 없다. 충분한 시간과 메모리가 주어지더라도 사실상 마찬가지이다.
              - link "튜링 기계" [ref=e194] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/튜링_기계
              - text: 가 양자 컴퓨터를 시뮬레이트할 수 있기 때문에 양자 컴퓨터가
              - link "정지 문제" [ref=e195] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/정지_문제
              - text: 같은 결정 불가능 문제를 풀 수는 없다. '표준' 양자 컴퓨터의 존재가
              - link "처치-튜링 명제" [ref=e196] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/처치-튜링_명제
              - text: 를 반증하지는 않는다.
              - superscript [ref=e197]:
                - link "[12]" [ref=e198] [cursor=pointer]:
                  - /url: "#cite_note-12"
                  - generic [ref=e199]: "[12]"
            - paragraph [ref=e200]:
              - text: 최근에 수많은 연구자들이 양자 역학을
