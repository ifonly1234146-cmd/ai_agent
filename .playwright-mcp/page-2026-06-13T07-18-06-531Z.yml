                - generic [ref=e295]: IBM이 2019년에 출시한 20개의 초전도 큐비트를 탑재한 양자 컴퓨터인 퀀텀 시스템 원
              - paragraph [ref=e296]:
                - text: 대한민국은 매년, 국내외 양자과학기술 연구자들과 관련 기업, 정부 대표 등이 참여하는 국제 행사인 퀀텀코리아를 개최하고 있다. 2021년 양자정보주간이라는 행사로 시작하여 2023년 현재의 이름으로 개칭하였다. 과학기술정보통신부와 퀀텀코리아조직위원회가 주최하고 있다.
                - superscript [ref=e297]:
                  - link "[16]" [ref=e298] [cursor=pointer]:
                    - /url: "#cite_note-16"
                    - generic [ref=e299]: "[16]"
                - text: 양자 기술 관련 법으로는 2023년 10월 국회를 통과하여 이듬해 11월부터 시행된『양자 과학기술 및 양자 산업 육성에 관한 법률』(약칭 '양자법')이 있는데, 양자 과학기술과 산업을 육성하기 위해 종합계획을 수립하고 기술개발과 상용화를 촉진한다는 내용이 담겨 있다.
                - superscript [ref=e300]:
                  - link "[17]" [ref=e301] [cursor=pointer]:
                    - /url: "#cite_note-17"
                    - generic [ref=e302]: "[17]"
              - paragraph [ref=e303]:
                - text: 2019년 11월, 삼성전자는 10년 이상 미래를 보고 선행연구를 하는
                - link "삼성종합기술원" [ref=e304] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/삼성종합기술원
                - text: 을 중심으로 양자컴퓨터 연구개발을 강화하고 해외 스타트업에 수백억원을 투자하는 등 공격 행보에 나서고 있다. "기존 틀과 한계를 허물고 미래를 선점하자"는 이재용 삼성전자 부회장의 초격차 철학이 양자컴퓨터 투자에도 반영됐다는 분석이다. 2021년 9월 7일,
                - link "삼성전자" [ref=e305] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/삼성전자
                - text: 가 이스라엘 양자컴퓨팅 스타트업
                - link "퀀텀 머신" [ref=e306] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/퀀텀_머신?action=edit&redlink=1
                - text: (Quantum Machines, QM)에 투자했다. 2019년 미국
                - link "알리로 테크놀로지스" [ref=e307] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/알리로_테크놀로지스?action=edit&redlink=1
                - text: 와
                - link "아이온큐" [ref=e308] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/아이온큐
                - text: 등 2곳에 투자한 뒤 양자컴퓨터 분야에서 세 번째 투자처다. 아이온큐가 하드웨어 업체라면, 퀀텀머신은 소프트웨어 업체이다.
              - paragraph [ref=e309]:
                - text: 2024년 11월, 미국, 캐나다, 독일, 일본에 이어 세계 5번째로 미국
                - link "IBM" [ref=e310] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/IBM
                - text: 社의 127 큐비트 구동 초전도체 양자컴퓨터인 'IBM 퀀텀 시스템 원'이
                - link "연세대학교" [ref=e311] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/연세대학교
                - text: 송도 국제캠퍼스 양자컴퓨팅센터에 도입되었다. 이는 국내 최초의 100 큐비트급 양자컴퓨터 도입 사례이다.
                - superscript [ref=e312]:
                  - link "[18]" [ref=e313] [cursor=pointer]:
                    - /url: "#cite_note-18"
                    - generic [ref=e314]: "[18]"
                - text: 2019년 약 10억 6000만 원 수준이었던 양자
                - link "연구개발" [ref=e315] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/연구개발
                - text: (R&D) 투자액이 2025년 약 1980억 원으로 편성되었다. 2025년 6월, 정부는 2035년까지 양자 분야 인재는 약 7배, 양자 분야 종사자는 약 10배, 양자 관련 기업은 약 15배 늘려나간다는 계획을 밝혔다.
                - superscript [ref=e316]:
                  - link "[19]" [ref=e317] [cursor=pointer]:
                    - /url: "#cite_note-19"
                    - generic [ref=e318]: "[19]"
