          - paragraph [ref=e1317]:
            - text: In 2006, the media-services provider
            - link "Netflix" [ref=e1318] [cursor=pointer]:
              - /url: /wiki/Netflix
            - text: held the first "
            - link "Netflix Prize" [ref=e1319] [cursor=pointer]:
              - /url: /wiki/Netflix_Prize
            - text: "\" competition to find a program to better predict user preferences and improve the accuracy of its existing Cinematch movie recommendation algorithm by at least 10%. A joint team made up of researchers from"
            - link "AT&T Labs" [ref=e1320] [cursor=pointer]:
              - /url: /wiki/AT%26T_Labs
            - text: "-Research in collaboration with the teams Big Chaos and Pragmatic Theory built an"
            - link "ensemble model" [ref=e1321] [cursor=pointer]:
              - /url: /wiki/Ensemble_Averaging
            - text: to win the Grand Prize in 2009 for $1 million.
            - superscript [ref=e1322]:
              - link "[105]" [ref=e1323] [cursor=pointer]:
                - /url: "#cite_note-105"
            - text: Shortly after the prize was awarded, Netflix realised that viewers' ratings were not the best indicators of their viewing patterns ("everything is a recommendation") and they changed their recommendation engine accordingly.
            - superscript [ref=e1324]:
              - link "[106]" [ref=e1325] [cursor=pointer]:
                - /url: "#cite_note-106"
            - text: In 2010, an article in
            - link "The Wall Street Journal" [ref=e1327] [cursor=pointer]:
              - /url: /wiki/The_Wall_Street_Journal
            - text: noted the use of machine learning by Rebellion Research to predict the
            - link "2008 financial crisis" [ref=e1328] [cursor=pointer]:
              - /url: /wiki/2008_financial_crisis
            - text: .
            - superscript [ref=e1329]:
              - link "[107]" [ref=e1330] [cursor=pointer]:
                - /url: "#cite_note-107"
            - text: In 2012, co-founder of
            - link "Sun Microsystems" [ref=e1331] [cursor=pointer]:
              - /url: /wiki/Sun_Microsystems
            - text: ","
            - link "Vinod Khosla" [ref=e1332] [cursor=pointer]:
              - /url: /wiki/Vinod_Khosla
            - text: ", predicted that 80% of medical doctors jobs would be lost in the next two decades to automated machine learning medical diagnostic software."
            - superscript [ref=e1333]:
              - link "[108]" [ref=e1334] [cursor=pointer]:
                - /url: "#cite_note-108"
            - text: In 2014, it was reported that a machine learning algorithm had been applied in the field of art history to study fine art paintings and that it may have revealed previously unrecognised influences among artists.
            - superscript [ref=e1335]:
              - link "[109]" [ref=e1336] [cursor=pointer]:
                - /url: "#cite_note-109"
            - text: In 2019
            - link "Springer Nature" [ref=e1337] [cursor=pointer]:
              - /url: /wiki/Springer_Nature
            - text: published the first research book created using machine learning.
            - superscript [ref=e1338]:
              - link "[110]" [ref=e1339] [cursor=pointer]:
                - /url: "#cite_note-110"
            - text: In 2020, machine learning technology was used to help make diagnoses and aid researchers in developing a cure for COVID-19.
            - superscript [ref=e1340]:
              - link "[111]" [ref=e1341] [cursor=pointer]:
                - /url: "#cite_note-111"
            - text: Machine learning was recently applied to predict the pro-environmental behaviour of travellers.
            - superscript [ref=e1342]:
              - link "[112]" [ref=e1343] [cursor=pointer]:
                - /url: "#cite_note-112"
            - text: Recently, machine learning technology was also applied to optimise smartphone's performance and thermal behaviour based on the user's interaction with the phone.
            - superscript [ref=e1344]:
              - link "[113]" [ref=e1345] [cursor=pointer]:
                - /url: "#cite_note-113"
            - superscript [ref=e1346]:
              - link "[114]" [ref=e1347] [cursor=pointer]:
                - /url: "#cite_note-114"
            - superscript [ref=e1348]:
              - link "[115]" [ref=e1349] [cursor=pointer]:
                - /url: "#cite_note-115"
            - text: When applied correctly, machine learning algorithms (MLAs) can utilise a wide range of company characteristics to predict stock returns without
            - link "overfitting" [ref=e1350] [cursor=pointer]:
              - /url: /wiki/Overfitting
            - text: . By employing effective feature engineering and combining forecasts, MLAs can generate results that far surpass those obtained from basic linear techniques like
            - link "OLS" [ref=e1351] [cursor=pointer]:
              - /url: /wiki/Ordinary_least_squares
            - text: .
            - superscript [ref=e1352]:
              - link "[116]" [ref=e1353] [cursor=pointer]:
                - /url: "#cite_note-116"
          - paragraph [ref=e1354]:
            - text: Recent advancements in machine learning have extended into the field of quantum chemistry, where novel algorithms now enable the prediction of solvent effects on chemical reactions, thereby offering new tools for chemists to tailor experimental conditions for optimal outcomes.
            - superscript [ref=e1355]:
              - link "[117]" [ref=e1356] [cursor=pointer]:
                - /url: "#cite_note-117"
          - paragraph [ref=e1357]:
            - text: Machine Learning is becoming a useful tool to investigate and predict evacuation decision-making in large-scale and small-scale disasters. Different solutions have been tested to predict if and when householders decide to evacuate during wildfires and hurricanes.
            - superscript [ref=e1358]:
              - link "[118]" [ref=e1359] [cursor=pointer]:
                - /url: "#cite_note-118"
            - superscript [ref=e1360]:
              - link "[119]" [ref=e1361] [cursor=pointer]:
                - /url: "#cite_note-119"
            - superscript [ref=e1362]:
              - link "[120]" [ref=e1363] [cursor=pointer]:
                - /url: "#cite_note-120"
            - text: Other applications have been focusing on pre evacuation decisions in building fires.
            - superscript [ref=e1364]:
              - link "[121]" [ref=e1365] [cursor=pointer]:
                - /url: "#cite_note-121"
            - superscript [ref=e1366]:
              - link "[122]" [ref=e1367] [cursor=pointer]:
                - /url: "#cite_note-122"
          - generic [ref=e1368]:
            - heading "Limitations" [level=2] [ref=e1369]
            - generic [ref=e1370]:
              - text: "["
              - link "edit" [ref=e1371] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=37
              - text: "]"
          - paragraph [ref=e1372]:
            - text: Although machine learning has been transformative in some fields, machine-learning programs often fail to deliver expected results.
            - superscript [ref=e1373]:
              - link "[123]" [ref=e1374] [cursor=pointer]:
                - /url: "#cite_note-123"
            - superscript [ref=e1375]:
              - link "[124]" [ref=e1376] [cursor=pointer]:
                - /url: "#cite_note-124"
            - superscript [ref=e1377]:
              - link "[125]" [ref=e1378] [cursor=pointer]:
                - /url: "#cite_note-125"
            - text: "Reasons for this are numerous: lack of (suitable) data, lack of access to the data, data bias, privacy problems, badly chosen tasks and algorithms, wrong tools and people, lack of resources, and evaluation problems."
            - superscript [ref=e1379]:
              - link "[126]" [ref=e1380] [cursor=pointer]:
                - /url: "#cite_note-126"
          - paragraph [ref=e1381]:
            - text: The "
            - link "black box theory" [ref=e1382] [cursor=pointer]:
              - /url: /wiki/Black_box
            - text: "\" poses another yet significant challenge. Black box refers to a situation where the algorithm producing an output is entirely opaque, meaning that even the designers of an application cannot audit the pattern that the machine extracted from the data."
            - superscript [ref=e1383]:
              - link "[127]" [ref=e1384] [cursor=pointer]:
                - /url: "#cite_note-Babuta-2018-127"
            - text: The House of Lords Select Committee, which claimed that such an "intelligence system" that could have a "substantial impact on an individual's life" would not be considered acceptable unless it provided "a full and satisfactory explanation for the decisions" it makes.
            - superscript [ref=e1385]:
              - link "[127]" [ref=e1386] [cursor=pointer]:
                - /url: "#cite_note-Babuta-2018-127"
          - paragraph [ref=e1387]:
            - text: In 2018, a self-driving car from
            - link "Uber" [ref=e1388] [cursor=pointer]:
              - /url: /wiki/Uber
            - text: failed to detect a pedestrian, who was killed after a collision.
            - superscript [ref=e1389]:
              - link "[128]" [ref=e1390] [cursor=pointer]:
                - /url: "#cite_note-128"
            - text: Attempts to use machine learning in healthcare with the
            - link "IBM Watson" [ref=e1391] [cursor=pointer]:
              - /url: /wiki/Watson_(computer)
            - text: system failed to deliver even after years of time and billions of dollars invested.
            - superscript [ref=e1392]:
              - link "[129]" [ref=e1393] [cursor=pointer]:
                - /url: "#cite_note-129"
            - superscript [ref=e1394]:
              - link "[130]" [ref=e1395] [cursor=pointer]:
                - /url: "#cite_note-130"
            - text: Microsoft's
            - link "Bing Chat" [ref=e1396] [cursor=pointer]:
              - /url: /wiki/Bing_Chat
            - text: chatbot has been reported to produce hostile and offensive response against its users.
            - superscript [ref=e1397]:
              - link "[131]" [ref=e1398] [cursor=pointer]:
                - /url: "#cite_note-131"
          - paragraph [ref=e1399]:
            - text: Machine learning has been used as a strategy to update the evidence related to a systematic review and increased reviewer burden related to the growth of biomedical literature. While it has improved with training sets, it has not yet developed sufficiently to reduce the workload burden without limiting the necessary sensitivity for the findings research itself.
            - superscript [ref=e1400]:
              - link "[132]" [ref=e1401] [cursor=pointer]:
                - /url: "#cite_note-132"
          - generic [ref=e1402]:
            - heading "Explainability" [level=3] [ref=e1403]
            - generic [ref=e1404]:
              - text: "["
              - link "edit" [ref=e1405] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=38
              - text: "]"
          - note [ref=e1406]:
            - text: "Main article:"
            - link "Explainable artificial intelligence" [ref=e1407] [cursor=pointer]:
              - /url: /wiki/Explainable_artificial_intelligence
          - paragraph [ref=e1408]:
            - text: Explainable AI (XAI), or Interpretable AI, or Explainable Machine Learning (XML), is artificial intelligence (AI) in which humans can understand the decisions or predictions made by the AI.
            - superscript [ref=e1409]:
              - link "[133]" [ref=e1410] [cursor=pointer]:
                - /url: "#cite_note-133"
            - text: It contrasts with the "black box" concept in machine learning where even its designers cannot explain why an AI arrived at a specific decision.
            - superscript [ref=e1411]:
              - link "[134]" [ref=e1412] [cursor=pointer]:
                - /url: "#cite_note-134"
            - text: By refining the mental models of users of AI-powered systems and dismantling their misconceptions, XAI promises to help users perform more effectively. XAI may be an implementation of the social right to explanation.
          - generic [ref=e1413]:
            - heading "Overfitting" [level=3] [ref=e1414]
            - generic [ref=e1415]:
              - text: "["
              - link "edit" [ref=e1416] [cursor=pointer]:
