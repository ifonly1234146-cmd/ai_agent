          - paragraph [ref=e271]:
            - text: Machine learning (ML) is a field of study in
            - link "artificial intelligence" [ref=e272] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: concerned with the development and study of
            - link "statistical algorithms" [ref=e273] [cursor=pointer]:
              - /url: /wiki/Computational_statistics
            - text: that can learn from
            - link "data" [ref=e274] [cursor=pointer]:
              - /url: /wiki/Data
            - text: and
            - link "generalize" [ref=e275] [cursor=pointer]:
              - /url: /wiki/Generalize
            - text: to unseen data, and thus perform
            - link "tasks" [ref=e276] [cursor=pointer]:
              - /url: /wiki/Task_(computing)
            - text: without being explicitly
            - link "programmed" [ref=e277] [cursor=pointer]:
              - /url: /wiki/Computer_program
            - text: .
            - superscript [ref=e278]:
              - link "[1]" [ref=e279] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: Advances in the field of
            - link "deep learning" [ref=e280] [cursor=pointer]:
              - /url: /wiki/Deep_learning
            - text: have allowed
            - link "neural networks" [ref=e281] [cursor=pointer]:
              - /url: /wiki/Neural_network_(machine_learning)
            - text: ", a class of statistical algorithms, to surpass many previous machine learning approaches in performance."
          - paragraph [ref=e282]:
            - link "Statistics" [ref=e283] [cursor=pointer]:
              - /url: /wiki/Statistics
            - text: and
            - link "mathematical optimisation" [ref=e284] [cursor=pointer]:
              - /url: /wiki/Mathematical_optimisation
            - text: methods compose the foundations of machine learning.
            - link "Data mining" [ref=e285] [cursor=pointer]:
              - /url: /wiki/Data_mining
            - text: is a related field of study, focusing on
            - link "exploratory data analysis" [ref=e286] [cursor=pointer]:
              - /url: /wiki/Exploratory_data_analysis
            - text: (EDA) through
            - link "unsupervised learning" [ref=e287] [cursor=pointer]:
              - /url: /wiki/Unsupervised_learning
            - text: .
            - superscript [ref=e288]:
              - link "[3]" [ref=e289] [cursor=pointer]:
                - /url: "#cite_note-3"
            - superscript [ref=e290]:
              - link "[4]" [ref=e291] [cursor=pointer]:
                - /url: "#cite_note-Friedman-1998-4"
          - paragraph [ref=e292]:
            - text: From a theoretical viewpoint,
            - link "probably approximately correct learning" [ref=e293] [cursor=pointer]:
              - /url: /wiki/Probably_approximately_correct_learning
            - text: provides a mathematical and statistical framework for describing machine learning. Most traditional machine learning and deep learning algorithms can be described as
            - link "empirical risk minimisation" [ref=e294] [cursor=pointer]:
              - /url: /wiki/Empirical_risk_minimisation
            - text: under this framework.
          - generic [ref=e295]:
            - heading "History" [level=2] [ref=e296]
            - generic [ref=e297]:
              - text: "["
              - link "edit" [ref=e298] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=1
              - text: "]"
          - note [ref=e299]:
            - text: For a chronological guide, see
            - link "Timeline of machine learning" [ref=e300] [cursor=pointer]:
              - /url: /wiki/Timeline_of_machine_learning
            - text: .
          - paragraph [ref=e301]:
            - text: The term machine learning was coined in 1959 by
            - link "Arthur Samuel" [ref=e302] [cursor=pointer]:
              - /url: /wiki/Arthur_Samuel_(computer_scientist)
            - text: ", an"
            - link "IBM" [ref=e303] [cursor=pointer]:
              - /url: /wiki/IBM
            - text: employee and pioneer in the field of
            - link "computer gaming" [ref=e304] [cursor=pointer]:
              - /url: /wiki/Computer_gaming
            - text: and
            - link "artificial intelligence" [ref=e305] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: .
            - superscript [ref=e306]:
              - link "[5]" [ref=e307] [cursor=pointer]:
                - /url: "#cite_note-Samuel-5"
            - superscript [ref=e308]:
              - link "[6]" [ref=e309] [cursor=pointer]:
                - /url: "#cite_note-Kohavi-6"
            - text: The synonym self-teaching computers was also used during this time period.
            - superscript [ref=e310]:
              - link "[7]" [ref=e311] [cursor=pointer]:
                - /url: "#cite_note-cyberthreat-7"
            - superscript [ref=e312]:
              - link "[8]" [ref=e313] [cursor=pointer]:
                - /url: "#cite_note-8"
          - paragraph [ref=e314]:
            - text: The earliest machine learning program was introduced in the 1950s, when Samuel invented a
            - link "computer program" [ref=e315] [cursor=pointer]:
              - /url: /wiki/Computer_program
            - text: that calculated the chance of winning in
            - link "checkers" [ref=e316] [cursor=pointer]:
              - /url: /wiki/Checkers
            - text: for each side, but the history of machine learning is rooted in decades of efforts to study human cognitive processes.
            - superscript [ref=e317]:
              - link "[9]" [ref=e318] [cursor=pointer]:
                - /url: "#cite_note-WhatIs-9"
            - text: In 1949, Canadian psychologist
            - link "Donald Hebb" [ref=e319] [cursor=pointer]:
              - /url: /wiki/Donald_O._Hebb
            - text: published the book
            - link "The Organization of Behavior" [ref=e321] [cursor=pointer]:
              - /url: /wiki/Organization_of_Behavior
            - text: ", in which he introduced a theoretical neural structure formed by certain interactions among"
            - link "nerve cells" [ref=e322] [cursor=pointer]:
              - /url: /wiki/Nerve_cells
            - text: .
            - superscript [ref=e323]:
              - link "[10]" [ref=e324] [cursor=pointer]:
                - /url: "#cite_note-10"
            - text: The
            - link "Hebbian theory" [ref=e325] [cursor=pointer]:
              - /url: /wiki/Hebbian_theory
            - text: of
            - link "neuron" [ref=e326] [cursor=pointer]:
              - /url: /wiki/Neuron
            - text: interaction set the groundwork for how many machine learning algorithms work, with connected
            - link "artificial neurons" [ref=e327] [cursor=pointer]:
              - /url: /wiki/Artificial_neuron
            - text: changing the strength of their connections based on data.
            - superscript [ref=e328]:
              - link "[9]" [ref=e329] [cursor=pointer]:
                - /url: "#cite_note-WhatIs-9"
            - text: Other researchers who have studied human
            - link "cognitive systems" [ref=e330] [cursor=pointer]:
              - /url: /wiki/Cognitive_systems_engineering
            - text: contributed to the modern machine learning technologies as well, including
            - link "Walter Pitts" [ref=e331] [cursor=pointer]:
              - /url: /wiki/Walter_Pitts
            - text: and
            - link "Warren McCulloch" [ref=e332] [cursor=pointer]:
              - /url: /wiki/Warren_Sturgis_McCulloch
            - text: ", who proposed the first mathematical model of neural networks including"
            - link "algorithms" [ref=e333] [cursor=pointer]:
              - /url: /wiki/Algorithm
            - text: that mirror human thought processes.
            - superscript [ref=e334]:
              - link "[9]" [ref=e335] [cursor=pointer]:
                - /url: "#cite_note-WhatIs-9"
            - superscript [ref=e336]:
              - text: "["
              - link "verification needed" [ref=e338] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Verifiability
              - text: "]"
          - paragraph [ref=e339]:
            - text: By the early 1960s, an experimental "learning machine" with
            - link "punched tape" [ref=e340] [cursor=pointer]:
              - /url: /wiki/Punched_tape
            - text: memory, called Cybertron, had been developed by
            - link "Raytheon Company" [ref=e341] [cursor=pointer]:
              - /url: /wiki/Raytheon_Company
            - text: to analyse
            - link "sonar" [ref=e342] [cursor=pointer]:
              - /url: /wiki/Sonar
            - text: signals,
            - link "electrocardiograms" [ref=e343] [cursor=pointer]:
              - /url: /wiki/Electrocardiography
            - text: ", and speech patterns using rudimentary"
            - link "reinforcement learning" [ref=e344] [cursor=pointer]:
              - /url: /wiki/Reinforcement_learning
            - text: . It was repetitively "trained" by a human operator/teacher to recognise patterns and equipped with a "
            - link "goof" [ref=e345] [cursor=pointer]:
              - /url: /wiki/Goof
            - text: "\" button to cause it to reevaluate incorrect decisions."
            - superscript [ref=e346]:
              - link "[11]" [ref=e347] [cursor=pointer]:
                - /url: "#cite_note-11"
            - superscript [ref=e348]:
              - text: "["
              - link "importance?" [ref=e350] [cursor=pointer]:
                - /url: /wiki/Wikipedia:What_Wikipedia_is_not#Encyclopedic_content
              - text: "]"
            - text: A representative book
            - superscript [ref=e351]:
              - text: "["
              - link "citation needed" [ref=e353] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
            - text: on research into machine learning during the 1960s was
            - link "Nils Nilsson" [ref=e354] [cursor=pointer]:
              - /url: /wiki/Nils_John_Nilsson
            - text: "'s book \"Learning Machines\", dealing mostly with machine learning for pattern"
            - link "classification" [ref=e355] [cursor=pointer]:
              - /url: /wiki/Classification
            - text: .
            - superscript [ref=e356]:
              - link "[12]" [ref=e357] [cursor=pointer]:
                - /url: "#cite_note-12"
            - text: Interest related to
            - link "pattern recognition" [ref=e358] [cursor=pointer]:
              - /url: /wiki/Pattern_recognition
            - text: continued into the 1970s, as described by Duda and Hart in 1973.
            - superscript [ref=e359]:
              - link "[13]" [ref=e360] [cursor=pointer]:
                - /url: "#cite_note-13"
            - text: In 1981, a report was given on using teaching strategies so that an
            - link "artificial neural network" [ref=e361] [cursor=pointer]:
              - /url: /wiki/Artificial_neural_network
            - text: learns to recognise 40 characters (26 letters, 10 digits, and 4 special symbols) from a computer terminal.
            - superscript [ref=e362]:
              - link "[14]" [ref=e363] [cursor=pointer]:
                - /url: "#cite_note-14"
          - paragraph [ref=e364]:
            - link "Tom M. Mitchell" [ref=e365] [cursor=pointer]:
              - /url: /wiki/Tom_M._Mitchell
            - text: provided a widely quoted,
            - superscript [ref=e366]:
              - text: "["
              - link "citation needed" [ref=e368] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
            - text: "more formal definition of the algorithms studied in the machine learning field: \"A computer program is said to learn from experience E with respect to some class of tasks T and performance measure P if its performance at tasks in T, as measured by P, improves with experience E.\""
            - superscript [ref=e369]:
              - link "[15]" [ref=e370] [cursor=pointer]:
                - /url: "#cite_note-Mitchell-1997-15"
            - text: This definition of the tasks in which machine learning is concerned is fundamentally
            - link "operational" [ref=e371] [cursor=pointer]:
              - /url: /wiki/Operational_definition
            - text: rather than defining the field in cognitive terms. This follows
            - link "Alan Turing" [ref=e372] [cursor=pointer]:
              - /url: /wiki/Alan_Turing
            - text: "'s proposal in his paper \""
            - link "Computing Machinery and Intelligence" [ref=e373] [cursor=pointer]:
              - /url: /wiki/Computing_Machinery_and_Intelligence
            - text: "\", in which the question, \"Can machines think?\", is replaced by asking whether machines can convincingly"
            - link "imitate a human" [ref=e374] [cursor=pointer]:
              - /url: /wiki/Turing_test
            - text: in its responses to human-posed questions.
            - superscript [ref=e375]:
              - link "[16]" [ref=e376] [cursor=pointer]:
                - /url: "#cite_note-16"
            - superscript [ref=e377]:
              - link "[17]" [ref=e378] [cursor=pointer]:
                - /url: "#cite_note-17"
          - paragraph [ref=e379]:
            - text: In 2014
            - link "Ian Goodfellow" [ref=e380] [cursor=pointer]:
              - /url: /wiki/Ian_Goodfellow
            - text: and others introduced
            - link "generative adversarial networks" [ref=e381] [cursor=pointer]:
              - /url: /wiki/Generative_adversarial_network
            - text: (GANs) which could produce realistic synthetic data.
            - superscript [ref=e382]:
              - link "[18]" [ref=e383] [cursor=pointer]:
                - /url: "#cite_note-18"
            - text: By 2016
            - link "AlphaGo" [ref=e384] [cursor=pointer]:
              - /url: /wiki/AlphaGo
            - text: had won against top human players in
            - link "Go" [ref=e385] [cursor=pointer]:
              - /url: /wiki/Go_(game)
            - text: using
            - link "reinforcement learning" [ref=e386] [cursor=pointer]:
              - /url: /wiki/Reinforcement_learning
            - text: techniques.
            - superscript [ref=e387]:
              - link "[19]" [ref=e388] [cursor=pointer]:
                - /url: "#cite_note-19"
          - generic [ref=e389]:
            - heading "Relationships to other fields" [level=2] [ref=e390]
            - generic [ref=e391]:
              - text: "["
              - link "edit" [ref=e392] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=2
              - text: "]"
          - generic [ref=e393]:
            - heading "Artificial intelligence" [level=3] [ref=e394]
            - generic [ref=e395]:
              - text: "["
              - link "edit" [ref=e396] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=3
              - text: "]"
          - figure "Deep learning is a subset of machine learning, which is itself a subset of artificial intelligence.[20]" [ref=e397]:
            - link [ref=e398] [cursor=pointer]:
              - /url: /wiki/File:AI-ML-DL.svg
              - img [ref=e399]
            - generic [ref=e400]:
              - link "Deep learning" [ref=e401] [cursor=pointer]:
                - /url: /wiki/Deep_learning
              - text: is a subset of machine learning, which is itself a subset of
              - link "artificial intelligence" [ref=e402] [cursor=pointer]:
                - /url: /wiki/Artificial_intelligence
              - text: .
              - superscript [ref=e403]:
                - link "[20]" [ref=e404] [cursor=pointer]:
                  - /url: "#cite_note-journalimcms.org-20"
          - paragraph [ref=e405]:
            - text: As a scientific endeavour, machine learning grew out of the quest for
            - link "artificial intelligence" [ref=e406] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: (AI). In the early days of AI as an
            - link "academic discipline" [ref=e407] [cursor=pointer]:
              - /url: /wiki/Discipline_(academia)
            - text: ", some researchers were interested in having machines learn from data. They attempted to approach the problem with various symbolic methods, as well as what were then termed \""
            - link "neural networks" [ref=e408] [cursor=pointer]:
              - /url: /wiki/Artificial_neural_network
            - text: "\"; these were mostly"
            - link "perceptrons" [ref=e409] [cursor=pointer]:
              - /url: /wiki/Perceptron
            - text: and
            - link "other models" [ref=e410] [cursor=pointer]:
              - /url: /wiki/ADALINE
            - text: that were later found to be reinventions of the
            - link "generalised linear models" [ref=e411] [cursor=pointer]:
              - /url: /wiki/Generalised_linear_model
            - text: of statistics.
            - superscript [ref=e412]:
              - link "[21]" [ref=e413] [cursor=pointer]:
                - /url: "#cite_note-21"
            - link "Probabilistic reasoning" [ref=e414] [cursor=pointer]:
              - /url: /wiki/Probabilistic_reasoning
            - text: was also employed, especially in
            - link "automated medical diagnosis" [ref=e415] [cursor=pointer]:
              - /url: /wiki/Automated_medical_diagnosis
            - text: .
            - superscript [ref=e416]:
              - link "[22]" [ref=e417] [cursor=pointer]:
                - /url: "#cite_note-aima-22"
            - superscript [ref=e418]: ": 488"
          - paragraph [ref=e419]:
            - text: However, an increasing emphasis on the
            - link "logical, knowledge-based approach" [ref=e420] [cursor=pointer]:
              - /url: /wiki/Symbolic_AI
            - text: caused a rift between AI and machine learning. Probabilistic systems were plagued by theoretical and practical problems of data acquisition and representation.
            - superscript [ref=e421]:
              - link "[22]" [ref=e422] [cursor=pointer]:
                - /url: "#cite_note-aima-22"
            - superscript [ref=e423]: ": 488"
            - text: By 1980,
            - link "expert systems" [ref=e424] [cursor=pointer]:
              - /url: /wiki/Expert_system
            - text: had come to dominate AI, and statistics was out of favour.
            - superscript [ref=e425]:
              - link "[23]" [ref=e426] [cursor=pointer]:
                - /url: "#cite_note-changing-23"
            - text: Work on symbolic/knowledge-based learning continued within AI, leading to
            - link "inductive logic programming" [ref=e427] [cursor=pointer]:
              - /url: /wiki/Inductive_logic_programming
            - text: (ILP), but the more statistical line of research was now outside the field of AI proper, in
            - link "pattern recognition" [ref=e428] [cursor=pointer]:
              - /url: /wiki/Pattern_recognition
            - text: and
            - link "information retrieval" [ref=e429] [cursor=pointer]:
              - /url: /wiki/Information_retrieval
            - text: .
            - superscript [ref=e430]:
              - link "[22]" [ref=e431] [cursor=pointer]:
                - /url: "#cite_note-aima-22"
            - superscript [ref=e432]: ": 708–710, 755"
            - text: Neural network research was abandoned by AI and
            - link "computer science" [ref=e433] [cursor=pointer]:
              - /url: /wiki/Computer_science
            - text: around the same time. This subfield, termed "
            - link "connectionism" [ref=e434] [cursor=pointer]:
              - /url: /wiki/Connectionism
            - text: "\", was continued by researchers from other disciplines, including"
            - link "John Hopfield" [ref=e435] [cursor=pointer]:
              - /url: /wiki/John_Hopfield
            - text: ","
            - link "David Rumelhart" [ref=e436] [cursor=pointer]:
              - /url: /wiki/David_Rumelhart
            - text: ", and"
            - link "Geoffrey Hinton" [ref=e437] [cursor=pointer]:
              - /url: /wiki/Geoffrey_Hinton
            - text: . Their main success came in the mid-1980s with the reinvention of
            - link "backpropagation" [ref=e438] [cursor=pointer]:
              - /url: /wiki/Backpropagation
            - text: .
            - superscript [ref=e439]:
              - link "[22]" [ref=e440] [cursor=pointer]:
                - /url: "#cite_note-aima-22"
            - superscript [ref=e441]: ": 25"
          - paragraph [ref=e442]:
            - text: Machine learning (ML), reorganised and recognised as its own field, started to flourish in the 1990s. The field changed its goal from achieving artificial intelligence to tackling solvable problems of a practical nature. It shifted focus away from the
            - link "symbolic approaches" [ref=e443] [cursor=pointer]:
              - /url: /wiki/Symbolic_artificial_intelligence
            - text: it had inherited from AI, and toward methods and models borrowed from statistics,
            - link "fuzzy logic" [ref=e444] [cursor=pointer]:
              - /url: /wiki/Fuzzy_logic
            - text: ", and"
            - link "probability theory" [ref=e445] [cursor=pointer]:
              - /url: /wiki/Probability_theory
            - text: .
            - superscript [ref=e446]:
              - link "[23]" [ref=e447] [cursor=pointer]:
                - /url: "#cite_note-changing-23"
          - generic [ref=e448]:
            - heading "Data compression" [level=3] [ref=e449]
            - generic [ref=e450]:
              - text: "["
              - link "edit" [ref=e451] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=4
              - text: "]"
          - generic [ref=e452]:
            - note [ref=e453]:
              - text: This section is an excerpt from
              - link "Data compression § Machine learning" [ref=e454] [cursor=pointer]:
                - /url: /wiki/Data_compression#Machine_learning
              - text: .
              - generic [ref=e455]:
                - text: "["
                - link "edit" [ref=e456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/w/index.php?title=Data_compression&action=edit
                - text: "]"
            - generic [ref=e457]:
              - paragraph [ref=e458]:
                - text: There is a close connection between machine learning and compression. A system that predicts the
                - link "posterior probabilities" [ref=e459] [cursor=pointer]:
                  - /url: /wiki/Posterior_probabilities
                - text: of a sequence given its entire history can be used for optimal data compression (by using
                - link "arithmetic coding" [ref=e460] [cursor=pointer]:
                  - /url: /wiki/Arithmetic_coding
                - text: on the output distribution). Conversely, an optimal compressor can be used for prediction (by finding the symbol that compresses best, given the previous history). This equivalence has been used as a justification for using data compression as a benchmark for "general intelligence".
                - superscript [ref=e461]:
                  - link "[24]" [ref=e462] [cursor=pointer]:
                    - /url: "#cite_note-Data_compression_Mahoney-24"
                - superscript [ref=e463]:
                  - link "[25]" [ref=e464] [cursor=pointer]:
                    - /url: "#cite_note-Data_compression_Market_Efficiency-25"
                - superscript [ref=e465]:
                  - link "[26]" [ref=e466] [cursor=pointer]:
                    - /url: "#cite_note-Data_compression_Ben-Gal-26"
              - paragraph [ref=e467]:
                - text: An alternative view can show compression algorithms implicitly map strings into implicit
                - link "feature space vectors" [ref=e468] [cursor=pointer]:
                  - /url: /wiki/Feature_space_vector
                - text: ", and compression-based similarity measures compute similarity within these feature spaces. For each compressor C(.) we define an associated vector space ℵ, such that C(.) maps an input string x, corresponding to the vector norm ||~x||. An exhaustive examination of the feature spaces underlying all compression algorithms is precluded by space; instead, feature vectors chooses to examine three representative lossless compression methods, LZW, LZ77, and PPM."
                - superscript [ref=e469]:
                  - link "[27]" [ref=e470] [cursor=pointer]:
                    - /url: "#cite_note-Data_compression_ScullyBrodley-27"
              - paragraph [ref=e471]:
                - text: According to
                - link "AIXI" [ref=e472] [cursor=pointer]:
                  - /url: /wiki/AIXI
                - text: theory, a connection more directly explained in
                - link "Hutter Prize" [ref=e473] [cursor=pointer]:
                  - /url: /wiki/Hutter_Prize
                - text: ", the best possible compression of x is the smallest possible software that generates x. For example, in that model, a zip file's compressed size includes both the zip file and the unzipping software, since you can not unzip it without both, but there may be an even smaller combined form."
              - paragraph [ref=e474]:
                - text: Examples of AI-powered audio/video compression software include
                - link "NVIDIA Maxine" [ref=e475] [cursor=pointer]:
                  - /url: /wiki/NVIDIA_Maxine
                - text: ", AIVC."
                - superscript [ref=e476]:
                  - link "[28]" [ref=e477] [cursor=pointer]:
                    - /url: "#cite_note-28"
                - text: Examples of software that can perform AI-powered image compression include
                - link "OpenCV" [ref=e478] [cursor=pointer]:
                  - /url: /wiki/OpenCV
                - text: ","
                - link "TensorFlow" [ref=e479] [cursor=pointer]:
                  - /url: /wiki/TensorFlow
                - text: ","
                - link "MATLAB" [ref=e480] [cursor=pointer]:
                  - /url: /wiki/MATLAB
                - text: "'s Image Processing Toolbox (IPT) and High-Fidelity Generative Image Compression."
                - superscript [ref=e481]:
                  - link "[29]" [ref=e482] [cursor=pointer]:
                    - /url: "#cite_note-29"
              - paragraph [ref=e483]:
                - text: In
                - link "unsupervised machine learning" [ref=e484] [cursor=pointer]:
                  - /url: /wiki/Unsupervised_machine_learning
                - text: ","
                - link "k-means clustering" [ref=e485] [cursor=pointer]:
                  - /url: /wiki/K-means_clustering
                - text: can be utilized to compress data by grouping similar data points into clusters. This technique simplifies handling extensive datasets that lack predefined labels and finds widespread use in fields such as
                - link "image compression" [ref=e486] [cursor=pointer]:
                  - /url: /wiki/Image_compression
                - text: .
                - superscript [ref=e487]:
                  - link "[30]" [ref=e488] [cursor=pointer]:
                    - /url: "#cite_note-30"
              - paragraph [ref=e489]:
                - text: Data compression aims to reduce the size of data files, enhancing storage efficiency and speeding up data transmission. K-means clustering, an unsupervised machine learning algorithm, is employed to partition a dataset into a specified number of clusters, k, each represented by the
                - link "centroid" [ref=e490] [cursor=pointer]:
                  - /url: /wiki/Centroid
                - text: of its points. This process condenses extensive datasets into a more compact set of representative points. Particularly beneficial in
                - link "image" [ref=e491] [cursor=pointer]:
                  - /url: /wiki/Image_processing
                - text: and
                - link "signal processing" [ref=e492] [cursor=pointer]:
                  - /url: /wiki/Signal_processing
                - text: ", k-means clustering aids in data reduction by replacing groups of data points with their centroids, thereby preserving the core information of the original data while significantly decreasing the required storage space."
                - superscript [ref=e493]:
                  - link "[31]" [ref=e494] [cursor=pointer]:
                    - /url: "#cite_note-31"
              - paragraph [ref=e495]:
                - link "Large language models" [ref=e496] [cursor=pointer]:
                  - /url: /wiki/Large_language_model
                - text: (LLMs) are also efficient lossless data compressors on some data sets, as demonstrated by
                - link "DeepMind" [ref=e497] [cursor=pointer]:
                  - /url: /wiki/DeepMind
                - text: "'s research with the Chinchilla 70B model. Developed by DeepMind, Chinchilla 70B effectively compressed data, outperforming conventional methods such as"
                - link "Portable Network Graphics" [ref=e498] [cursor=pointer]:
                  - /url: /wiki/Portable_Network_Graphics
                - text: (PNG) for images and
                - link "Free Lossless Audio Codec" [ref=e499] [cursor=pointer]:
                  - /url: /wiki/Free_Lossless_Audio_Codec
                - text: (FLAC) for audio. It achieved compression of image and audio data to 43.4% and 16.4% of their original sizes, respectively. There is, however, some reason to be concerned that the data set used for testing overlaps the LLM training data set, making it possible that the Chinchilla 70B model is only an efficient compression tool on data it has already been trained on.
                - superscript [ref=e500]:
                  - link "[32]" [ref=e501] [cursor=pointer]:
                    - /url: "#cite_note-32"
                - superscript [ref=e502]:
                  - link "[33]" [ref=e503] [cursor=pointer]:
                    - /url: "#cite_note-33"
          - generic [ref=e504]:
            - heading "Data mining" [level=3] [ref=e505]
            - generic [ref=e506]:
              - text: "["
              - link "edit" [ref=e507] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=5
              - text: "]"
          - paragraph [ref=e508]:
            - text: Machine learning and
            - link "data mining" [ref=e509] [cursor=pointer]:
              - /url: /wiki/Data_mining
            - text: often employ the same methods and overlap significantly, but while machine learning focuses on prediction based on known properties learned from the training data, data mining focuses on the
            - link "discovery" [ref=e510] [cursor=pointer]:
              - /url: /wiki/Discovery_(observation)
            - text: of previously unknown properties in the data (this is the analysis step of
            - link "knowledge discovery" [ref=e511] [cursor=pointer]:
              - /url: /wiki/Knowledge_discovery
            - text: in databases). Data mining uses many machine learning methods, but with different goals; on the other hand, machine learning also employs data mining methods as "
            - link "unsupervised learning" [ref=e512] [cursor=pointer]:
              - /url: /wiki/Unsupervised_learning
            - text: "\" or as a preprocessing step to improve learner accuracy. Much of the confusion between these two research communities comes from the basic assumptions they work with: in machine learning, performance is usually evaluated with respect to the ability to reproduce known knowledge, while in knowledge discovery and data mining (KDD) the key task is the discovery of previously unknown knowledge. Evaluated with respect to known knowledge, an uninformed (unsupervised) method will easily be outperformed by other supervised methods, while in a typical KDD task, supervised methods cannot be used due to the unavailability of training data."
            - superscript [ref=e513]:
              - text: "["
              - link "citation needed" [ref=e515] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - paragraph [ref=e516]:
            - text: Machine learning also has intimate ties to
            - link "optimization" [ref=e517] [cursor=pointer]:
              - /url: /wiki/Optimization
            - text: ": Many learning problems are formulated as minimisation of some"
            - link "loss function" [ref=e518] [cursor=pointer]:
              - /url: /wiki/Loss_function
            - text: on a training set of examples. Loss functions express the discrepancy between the predictions of the model being trained and the actual problem instances (for example, in classification, one wants to assign a
            - link "label" [ref=e519] [cursor=pointer]:
              - /url: /wiki/Labeled_data
            - text: to instances, and models are trained to correctly predict the preassigned labels of a set of examples).
            - superscript [ref=e520]:
              - link "[34]" [ref=e521] [cursor=pointer]:
                - /url: "#cite_note-34"
          - generic [ref=e522]:
            - heading "Generalization" [level=3] [ref=e523]
            - generic [ref=e524]:
              - text: "["
              - link "edit" [ref=e525] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=6
              - text: "]"
          - paragraph [ref=e526]:
            - text: Characterizing the generalisation of various learning algorithms is an active topic of current research, especially for
            - link "deep learning" [ref=e527] [cursor=pointer]:
              - /url: /wiki/Deep_learning
            - text: algorithms.
            - superscript [ref=e528]:
              - text: "["
              - link "citation needed" [ref=e530] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - generic [ref=e531]:
            - heading "Statistics" [level=3] [ref=e532]
            - generic [ref=e533]:
              - text: "["
              - link "edit" [ref=e534] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=7
              - text: "]"
          - paragraph [ref=e535]:
            - text: Machine learning and
            - link "statistics" [ref=e536] [cursor=pointer]:
              - /url: /wiki/Statistics
            - text: "are closely related fields in terms of methods, but distinct in their principal goal: statistics draws population"
            - link "inferences" [ref=e537] [cursor=pointer]:
              - /url: /wiki/Statistical_inference
            - text: from a
            - link "sample" [ref=e538] [cursor=pointer]:
              - /url: /wiki/Sample_(statistics)
            - text: ", while machine learning finds generalisable predictive patterns."
            - superscript [ref=e539]:
              - link "[35]" [ref=e540] [cursor=pointer]:
                - /url: "#cite_note-35"
          - paragraph [ref=e541]:
            - text: Conventional statistical analyses require the a priori selection of a model most suitable for the study data set. In addition, only significant or theoretically relevant variables based on previous experience are included for analysis. In contrast, machine learning is not built on a pre-structured model; rather, the data shape the model by detecting underlying patterns. The more variables (input) used to train the model, the more accurate the ultimate model will be.
            - superscript [ref=e542]:
              - link "[36]" [ref=e543] [cursor=pointer]:
                - /url: "#cite_note-36"
          - paragraph [ref=e544]:
            - link "Leo Breiman" [ref=e545] [cursor=pointer]:
              - /url: /wiki/Leo_Breiman
            - text: "distinguished two statistical modelling paradigms: the data model and the algorithmic model,"
            - superscript [ref=e546]:
              - link "[37]" [ref=e547] [cursor=pointer]:
                - /url: "#cite_note-Cornell-University-Library-2001-37"
            - text: wherein "algorithmic model" means more or less the machine learning algorithms like
            - link "Random forest" [ref=e548] [cursor=pointer]:
              - /url: /wiki/Random_forest
            - text: .
            - superscript [ref=e549]:
              - text: "["
              - link "clarification needed" [ref=e551] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Please_clarify
              - text: "]"
          - paragraph [ref=e552]:
            - text: Some statisticians have adopted methods from machine learning, producing the field of statistical learning.
            - superscript [ref=e553]:
              - link "[38]" [ref=e554] [cursor=pointer]:
                - /url: "#cite_note-islr-38"
          - generic [ref=e555]:
            - heading "Statistical physics" [level=3] [ref=e556]
            - generic [ref=e557]:
              - text: "["
              - link "edit" [ref=e558] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=8
              - text: "]"
          - paragraph [ref=e559]:
            - text: Analytical and computational techniques derived from deep-rooted physics of disordered systems can be extended to large-scale problems, including machine learning, e.g., to analyse the weight space of
            - link "deep neural networks" [ref=e560] [cursor=pointer]:
              - /url: /wiki/Deep_neural_network
            - text: .
            - superscript [ref=e561]:
              - link "[39]" [ref=e562] [cursor=pointer]:
                - /url: "#cite_note-SP_1-39"
            - text: Statistical physics is thus finding applications in the area of
            - link "medical diagnostics" [ref=e563] [cursor=pointer]:
              - /url: /wiki/Medical_diagnostics
            - text: .
            - superscript [ref=e564]:
              - link "[40]" [ref=e565] [cursor=pointer]:
                - /url: "#cite_note-SP_2-40"
            - superscript [ref=e566]:
              - text: "["
              - link "clarification needed" [ref=e568] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Please_clarify
              - text: "]"
          - generic [ref=e569]:
            - heading "Theory" [level=2] [ref=e570]: Theory
            - generic [ref=e571]:
              - text: "["
              - link "edit" [ref=e572] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=9
              - text: "]"
          - note [ref=e573]:
            - text: "Main articles:"
            - link "Computational learning theory" [ref=e574] [cursor=pointer]:
              - /url: /wiki/Computational_learning_theory
            - text: and
            - link "Statistical learning theory" [ref=e575] [cursor=pointer]:
              - /url: /wiki/Statistical_learning_theory
          - paragraph [ref=e576]:
            - text: A core objective of a learner is to generalise from its experience.
            - superscript [ref=e577]:
              - link "[2]" [ref=e578] [cursor=pointer]:
                - /url: "#cite_note-bishop2006-2"
            - superscript [ref=e579]:
              - link "[41]" [ref=e580] [cursor=pointer]:
                - /url: "#cite_note-Mohri-2012-41"
            - text: Generalisation in this context is the ability of a learning machine to perform accurately on new, unseen examples/tasks after having experienced a learning data set. The training examples come from some generally unknown probability distribution (considered representative of the space of occurrences) and the learner has to build a general model about this space that enables it to produce sufficiently accurate predictions in new cases.
          - paragraph [ref=e581]:
            - text: The computational analysis of machine learning algorithms and their performance is a branch of
            - link "theoretical computer science" [ref=e582] [cursor=pointer]:
              - /url: /wiki/Theoretical_computer_science
            - text: known as
            - link "computational learning theory" [ref=e583] [cursor=pointer]:
              - /url: /wiki/Computational_learning_theory
            - text: via the
            - link "probably approximately correct learning" [ref=e584] [cursor=pointer]:
              - /url: /wiki/Probably_approximately_correct_learning
            - text: model.
            - superscript [ref=e585]:
              - text: "["
              - link "clarification needed" [ref=e587] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Please_clarify
              - text: "]"
            - text: Because training sets are finite and the future is uncertain, learning theory usually does not yield guarantees of the performance of algorithms. Instead, probabilistic bounds on the performance are quite common. The
            - link "bias–variance decomposition" [ref=e588] [cursor=pointer]:
              - /url: /wiki/Bias%E2%80%93variance_decomposition
            - text: is one way to quantify generalisation
            - link "error" [ref=e589] [cursor=pointer]:
              - /url: /wiki/Errors_and_residuals
            - text: .
            - superscript [ref=e590]:
              - text: "["
              - link "citation needed" [ref=e592] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - paragraph [ref=e593]:
            - text: For the best performance in the context of generalisation, the complexity of the hypothesis should match the complexity of the function underlying the data. If the hypothesis is less complex than the function, then the model has underfitted the data. If the complexity of the model is increased in response, then the training error decreases. But if the hypothesis is too complex, then the model is subject to
            - link "overfitting" [ref=e594] [cursor=pointer]:
              - /url: /wiki/Overfitting
            - text: and generalisation will be poorer.
            - superscript [ref=e595]:
              - link "[42]" [ref=e596] [cursor=pointer]:
                - /url: "#cite_note-alpaydin-42"
          - paragraph [ref=e597]:
            - text: In addition to performance bounds, learning theorists study the time complexity and feasibility of learning. In computational learning theory, a computation is considered feasible if it can be done in
            - link "polynomial time" [ref=e598] [cursor=pointer]:
              - /url: /wiki/Time_complexity#Polynomial_time
            - text: . There are two kinds of
            - link "time complexity" [ref=e599] [cursor=pointer]:
              - /url: /wiki/Time_complexity
            - text: "results: Positive results show that a certain class of functions can be learned in polynomial time. Negative results show that certain classes cannot be learned in polynomial time."
            - superscript [ref=e600]:
              - text: "["
              - link "citation needed" [ref=e602] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - generic [ref=e603]:
            - heading "Approaches" [level=2] [ref=e604]
            - generic [ref=e605]:
              - text: "["
              - link "edit" [ref=e606] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=10
              - text: "]"
          - paragraph
          - figure "In supervised learning, the training data is labelled with the expected answers, while in unsupervised learning, the model identifies patterns or structures in unlabelled data." [ref=e607]:
            - link [ref=e608] [cursor=pointer]:
              - /url: /wiki/File:Supervised_and_unsupervised_learning.png
              - img [ref=e609]
            - generic [ref=e610]:
              - text: In
              - link "supervised learning" [ref=e611] [cursor=pointer]:
                - /url: /wiki/Supervised_learning
              - text: ", the training data is labelled with the expected answers, while in"
              - link "unsupervised learning" [ref=e612] [cursor=pointer]:
                - /url: /wiki/Unsupervised_learning
              - text: ", the model identifies patterns or structures in unlabelled data."
          - paragraph [ref=e613]: "Machine learning approaches are traditionally divided into three broad categories, which correspond to learning paradigms, depending on the nature of the \"signal\" or \"feedback\" available to the learning system:"
          - list [ref=e614]:
            - listitem [ref=e615]:
              - link "Supervised learning" [ref=e616] [cursor=pointer]:
                - /url: /wiki/Supervised_learning
              - text: ": The computer is presented with example inputs and their desired outputs, given by a \"teacher\", and the goal is to learn a general rule that"
              - link "maps" [ref=e617] [cursor=pointer]:
                - /url: /wiki/Map_(mathematics)
              - text: inputs to outputs.
            - listitem [ref=e618]:
              - link "Unsupervised learning" [ref=e619] [cursor=pointer]:
                - /url: /wiki/Unsupervised_learning
              - text: ": No labels are given to the learning algorithm, leaving it on its own to find structure in its input. Unsupervised learning can be a goal in itself (discovering hidden patterns in data) or a means towards an end ("
              - link "feature learning" [ref=e620] [cursor=pointer]:
                - /url: /wiki/Feature_learning
              - text: ).
            - listitem [ref=e621]:
              - link "Reinforcement learning" [ref=e622] [cursor=pointer]:
                - /url: /wiki/Reinforcement_learning
              - text: ": A computer program interacts with a dynamic environment in which it must perform a certain goal (such as"
              - link "driving a vehicle" [ref=e623] [cursor=pointer]:
                - /url: /wiki/Autonomous_car
              - text: or playing a game against an opponent). As it navigates its problem space, the program is provided rewards as feedback, which it tries to maximize, thus resulting in the program learning from experience.
              - superscript [ref=e624]:
                - link "[2]" [ref=e625] [cursor=pointer]:
                  - /url: "#cite_note-bishop2006-2"
          - paragraph [ref=e626]:
            - text: Although each algorithm has advantages and limitations, no single algorithm works for all problems.
            - superscript [ref=e627]:
              - link "[43]" [ref=e628] [cursor=pointer]:
                - /url: "#cite_note-43"
            - superscript [ref=e629]:
              - link "[44]" [ref=e630] [cursor=pointer]:
                - /url: "#cite_note-44"
            - superscript [ref=e631]:
              - link "[45]" [ref=e632] [cursor=pointer]:
                - /url: "#cite_note-45"
          - generic [ref=e633]:
            - heading "Supervised learning" [level=3] [ref=e634]
            - generic [ref=e635]:
              - text: "["
              - link "edit" [ref=e636] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=11
              - text: "]"
          - note [ref=e637]:
            - text: "Main article:"
            - link "Supervised learning" [ref=e638] [cursor=pointer]:
              - /url: /wiki/Supervised_learning
          - figure "A support-vector machine is a supervised learning model that divides the data into regions separated by a linear boundary. Here, the linear boundary divides the black circles from the white." [ref=e639]:
            - link [ref=e640] [cursor=pointer]:
              - /url: /wiki/File:Svm_max_sep_hyperplane_with_margin.png
              - img [ref=e641]
            - generic [ref=e642]:
              - text: A
              - link "support-vector machine" [ref=e643] [cursor=pointer]:
                - /url: /wiki/Support-vector_machine
              - text: is a supervised learning model that divides the data into regions separated by a
              - link "linear boundary" [ref=e644] [cursor=pointer]:
                - /url: /wiki/Linear_classifier
              - text: . Here, the linear boundary divides the black circles from the white.
          - paragraph [ref=e645]:
            - text: Supervised learning algorithms build a mathematical model of a set of data that contains both the inputs and the desired outputs.
            - superscript [ref=e646]:
              - link "[46]" [ref=e647] [cursor=pointer]:
                - /url: "#cite_note-46"
            - text: The data, known as
            - link "training data" [ref=e648] [cursor=pointer]:
              - /url: /wiki/Training_data
            - text: ", consists of a set of training examples. Each training example has one or more inputs and the desired output, also known as a supervisory signal. In the mathematical model, each training example is represented by an"
            - link "array" [ref=e649] [cursor=pointer]:
              - /url: /wiki/Array_data_structure
            - text: or vector, sometimes called a
            - link "feature vector" [ref=e650] [cursor=pointer]:
              - /url: /wiki/Feature_vector
            - text: ", and the training data is represented by a"
            - link "matrix" [ref=e651] [cursor=pointer]:
              - /url: /wiki/Matrix_(mathematics)
            - text: . Through
            - link "iterative optimisation" [ref=e652] [cursor=pointer]:
              - /url: /wiki/Mathematical_optimization#Computational_optimization_techniques
            - text: of an
            - link "objective function" [ref=e653] [cursor=pointer]:
              - /url: /wiki/Loss_function
            - text: ", supervised learning algorithms learn a function that can be used to predict the output associated with new inputs."
            - superscript [ref=e654]:
              - link "[47]" [ref=e655] [cursor=pointer]:
                - /url: "#cite_note-47"
            - text: An optimal function allows the algorithm to correctly determine the output for inputs that were not a part of the training data. An algorithm that improves the accuracy of its outputs or predictions over time is said to have learned to perform that task.
            - superscript [ref=e656]:
              - link "[15]" [ref=e657] [cursor=pointer]:
                - /url: "#cite_note-Mitchell-1997-15"
          - paragraph [ref=e658]:
            - text: Types of supervised-learning algorithms include
            - link "active learning" [ref=e659] [cursor=pointer]:
              - /url: /wiki/Active_learning_(machine_learning)
            - text: ","
            - link "classification" [ref=e660] [cursor=pointer]:
              - /url: /wiki/Statistical_classification
            - text: and
            - link "regression" [ref=e661] [cursor=pointer]:
              - /url: /wiki/Regression_analysis
            - text: .
            - superscript [ref=e662]:
              - link "[48]" [ref=e663] [cursor=pointer]:
                - /url: "#cite_note-Alpaydin-2010-48"
            - text: Classification algorithms are used when the outputs are restricted to a limited set of values, while regression algorithms are used when the outputs can take any numerical value within a range. For example, in a classification algorithm that filters emails, the input is an incoming email, and the output is the folder in which to file the email. In contrast, regression is used for tasks such as predicting a person's height based on factors like age and genetics or forecasting future temperatures based on historical data.
            - superscript [ref=e664]:
              - link "[49]" [ref=e665] [cursor=pointer]:
                - /url: "#cite_note-49"
          - paragraph [ref=e666]:
            - link "Similarity learning" [ref=e667] [cursor=pointer]:
              - /url: /wiki/Similarity_learning
            - text: is an area of supervised machine learning closely related to regression and classification, but the goal is to learn from examples using a similarity function that measures how similar or related two objects are. It has applications in
            - link "ranking" [ref=e668] [cursor=pointer]:
              - /url: /wiki/Ranking
            - text: ","
            - link "recommendation systems" [ref=e669] [cursor=pointer]:
              - /url: /wiki/Recommender_system
            - text: ", visual identity tracking, face verification, and speaker verification."
          - generic [ref=e670]:
            - heading "Unsupervised learning" [level=3] [ref=e671]
            - generic [ref=e672]:
              - text: "["
              - link "edit" [ref=e673] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=12
              - text: "]"
          - note [ref=e674]:
            - text: "Main article:"
            - link "Unsupervised learning" [ref=e675] [cursor=pointer]:
              - /url: /wiki/Unsupervised_learning
          - note [ref=e676]:
            - text: "See also:"
            - link "Cluster analysis" [ref=e677] [cursor=pointer]:
              - /url: /wiki/Cluster_analysis
          - paragraph [ref=e678]:
            - text: Unsupervised learning algorithms find structures in data that has not been labelled, classified or categorised. Instead of responding to feedback, unsupervised learning algorithms identify commonalities in the data and react based on the presence or absence of such commonalities in each new piece of data. Central applications of unsupervised machine learning include clustering,
            - link "dimensionality reduction" [ref=e679] [cursor=pointer]:
              - /url: /wiki/Dimensionality_reduction
            - text: ","
            - superscript [ref=e680]:
              - link "[4]" [ref=e681] [cursor=pointer]:
                - /url: "#cite_note-Friedman-1998-4"
            - text: and
            - link "density estimation" [ref=e682] [cursor=pointer]:
              - /url: /wiki/Density_estimation
            - text: .
            - superscript [ref=e683]:
              - link "[50]" [ref=e684] [cursor=pointer]:
                - /url: "#cite_note-JordanBishop2004-50"
          - paragraph [ref=e685]: Cluster analysis is the assignment of a set of observations into subsets (called clusters) so that observations within the same cluster are similar according to one or more predesignated criteria, while observations drawn from different clusters are dissimilar. Different clustering techniques make different assumptions on the structure of the data, often defined by some similarity metric and evaluated, for example, by internal compactness, or the similarity between members of the same cluster, and separation, the difference between clusters. Other methods are based on estimated density and graph connectivity.
          - paragraph [ref=e686]:
            - text: A special type of unsupervised learning called
            - link "self-supervised learning" [ref=e687] [cursor=pointer]:
              - /url: /wiki/Self-supervised_learning
            - text: involves training a model by generating the supervisory signal from the data itself.
            - superscript [ref=e688]:
              - link "[51]" [ref=e689] [cursor=pointer]:
                - /url: "#cite_note-51"
            - superscript [ref=e690]:
              - link "[52]" [ref=e691] [cursor=pointer]:
                - /url: "#cite_note-52"
          - generic [ref=e692]:
            - heading "Dimensionality reduction" [level=4] [ref=e693]
            - generic [ref=e694]:
              - text: "["
              - link "edit" [ref=e695] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=13
              - text: "]"
          - paragraph [ref=e696]:
            - link "Dimensionality reduction" [ref=e697] [cursor=pointer]:
              - /url: /wiki/Dimensionality_reduction
            - text: is a process of reducing the number of random variables under consideration by obtaining a set of principal variables.
            - superscript [ref=e698]:
              - link "[53]" [ref=e699] [cursor=pointer]:
                - /url: "#cite_note-53"
            - text: In other words, it is a process of reducing the dimension of the
            - link "feature" [ref=e700] [cursor=pointer]:
              - /url: /wiki/Feature_(machine_learning)
            - text: set, also called the "number of features". Most of the dimensionality reduction techniques can be considered as either feature elimination or
            - link "extraction" [ref=e701] [cursor=pointer]:
              - /url: /wiki/Feature_extraction
            - text: . One of the popular methods of dimensionality reduction is
            - link "principal component analysis" [ref=e702] [cursor=pointer]:
              - /url: /wiki/Principal_component_analysis
            - text: (PCA). PCA involves changing higher-dimensional data (e.g., 3D) to a smaller space (e.g., 2D). The
            - link "manifold hypothesis" [ref=e703] [cursor=pointer]:
              - /url: /wiki/Manifold_hypothesis
            - text: proposes that high-dimensional data sets lie along low-dimensional
            - link "manifolds" [ref=e704] [cursor=pointer]:
              - /url: /wiki/Manifold
            - text: ", and many dimensionality reduction techniques make this assumption, leading to the areas of"
            - link "manifold learning" [ref=e705] [cursor=pointer]:
              - /url: /wiki/Manifold_learning
            - text: and
            - link "manifold regularisation" [ref=e706] [cursor=pointer]:
              - /url: /wiki/Manifold_regularisation
            - text: .
          - generic [ref=e707]:
            - heading "Semi-supervised learning" [level=3] [ref=e708]
            - generic [ref=e709]:
              - text: "["
              - link "edit" [ref=e710] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=14
              - text: "]"
          - note [ref=e711]:
            - text: "Main article:"
            - link "Semi-supervised learning" [ref=e712] [cursor=pointer]:
              - /url: /wiki/Semi-supervised_learning
          - paragraph [ref=e713]:
            - text: Semi-supervised learning falls between
            - link "unsupervised learning" [ref=e714] [cursor=pointer]:
              - /url: /wiki/Unsupervised_learning
            - text: (without any labelled training data) and
            - link "supervised learning" [ref=e715] [cursor=pointer]:
              - /url: /wiki/Supervised_learning
            - text: (with completely labelled training data). Some of the training examples are missing training labels, yet many machine-learning researchers have found that unlabelled data, when used in conjunction with a small amount of labelled data, can produce a considerable improvement in learning accuracy.
          - paragraph [ref=e716]:
            - text: In
            - link "weakly supervised learning" [ref=e717] [cursor=pointer]:
              - /url: /wiki/Weak_supervision
            - text: ", the training labels are noisy, limited, or imprecise; however, these labels are often cheaper to obtain, resulting in larger effective training sets."
            - superscript [ref=e718]:
              - link "[54]" [ref=e719] [cursor=pointer]:
                - /url: "#cite_note-54"
          - generic [ref=e720]:
            - heading "Reinforcement learning" [level=3] [ref=e721]
            - generic [ref=e722]:
              - text: "["
              - link "edit" [ref=e723] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=15
              - text: "]"
          - note [ref=e724]:
            - text: "Main article:"
            - link "Reinforcement learning" [ref=e725] [cursor=pointer]:
              - /url: /wiki/Reinforcement_learning
          - 'figure "In reinforcement learning, an agent takes actions in an environment: these produce a reward or a representation of the state, which is fed back to the agent." [ref=e726]':
            - link [ref=e727] [cursor=pointer]:
              - /url: /wiki/File:Reinforcement_learning_diagram.svg
              - img [ref=e728]
            - generic [ref=e729]: "In reinforcement learning, an agent takes actions in an environment: these produce a reward or a representation of the state, which is fed back to the agent."
          - paragraph [ref=e730]:
            - text: Reinforcement learning is an area of machine learning concerned with how
            - link "software agents" [ref=e731] [cursor=pointer]:
              - /url: /wiki/Software_agent
            - text: ought to take
            - link "actions" [ref=e732] [cursor=pointer]:
              - /url: /wiki/Action_selection
            - text: in an environment to maximise some notion of cumulative reward. Due to its generality, the field is studied in many other disciplines, such as
            - link "game theory" [ref=e733] [cursor=pointer]:
              - /url: /wiki/Game_theory
            - text: ","
            - link "control theory" [ref=e734] [cursor=pointer]:
              - /url: /wiki/Control_theory
            - text: ","
            - link "operations research" [ref=e735] [cursor=pointer]:
              - /url: /wiki/Operations_research
            - text: ","
            - link "information theory" [ref=e736] [cursor=pointer]:
              - /url: /wiki/Information_theory
            - text: ","
            - link "simulation-based optimisation" [ref=e737] [cursor=pointer]:
              - /url: /wiki/Simulation-based_optimisation
            - text: ","
            - link "multi-agent systems" [ref=e738] [cursor=pointer]:
              - /url: /wiki/Multi-agent_system
            - text: ","
            - link "swarm intelligence" [ref=e739] [cursor=pointer]:
              - /url: /wiki/Swarm_intelligence
            - text: ","
            - link "statistics" [ref=e740] [cursor=pointer]:
              - /url: /wiki/Statistics
            - text: and
            - link "genetic algorithms" [ref=e741] [cursor=pointer]:
              - /url: /wiki/Genetic_algorithm
            - text: . In reinforcement learning, the environment is typically represented as a
            - link "Markov decision process" [ref=e742] [cursor=pointer]:
              - /url: /wiki/Markov_decision_process
            - text: (MDP). Many reinforcement learning algorithms use
            - link "dynamic programming" [ref=e743] [cursor=pointer]:
              - /url: /wiki/Dynamic_programming
            - text: techniques.
            - superscript [ref=e744]:
              - link "[55]" [ref=e745] [cursor=pointer]:
                - /url: "#cite_note-55"
            - text: Reinforcement learning algorithms do not assume knowledge of an exact mathematical model of the MDP and are used when exact models are infeasible. Reinforcement learning algorithms are used in autonomous vehicles or in learning to play a game against a human opponent.
          - generic [ref=e746]:
            - heading "Other types" [level=3] [ref=e747]
            - generic [ref=e748]:
              - text: "["
              - link "edit" [ref=e749] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=16
              - text: "]"
          - paragraph [ref=e750]:
            - text: Other approaches have been developed which do not fit neatly into this three-fold categorisation, and sometimes more than one is used by the same machine learning system. For example,
            - link "topic modelling" [ref=e751] [cursor=pointer]:
              - /url: /wiki/Topic_model
            - text: ","
            - link "meta-learning" [ref=e752] [cursor=pointer]:
              - /url: /wiki/Meta-learning_(computer_science)
            - text: .
            - superscript [ref=e753]:
              - link "[56]" [ref=e754] [cursor=pointer]:
                - /url: "#cite_note-56"
          - generic [ref=e755]:
            - heading "Self-learning" [level=4] [ref=e756]
            - generic [ref=e757]:
              - text: "["
              - link "edit" [ref=e758] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=17
              - text: "]"
          - paragraph [ref=e759]:
            - text: Self-learning, as a machine learning paradigm, was introduced in 1982 along with a neural network capable of self-learning, named crossbar adaptive array (CAA).
            - superscript [ref=e760]:
              - link "[57]" [ref=e761] [cursor=pointer]:
                - /url: "#cite_note-57"
            - superscript [ref=e762]:
              - link "[58]" [ref=e763] [cursor=pointer]:
                - /url: "#cite_note-58"
            - text: It gives a solution to the problem learning without any external reward, by introducing emotion as an internal reward. Emotion is used as a state evaluation of a self-learning agent. The CAA self-learning algorithm computes, in a crossbar fashion, both decisions about actions and emotions (feelings) about consequence situations. The system is driven by the interaction between cognition and emotion.
            - superscript [ref=e764]:
              - link "[59]" [ref=e765] [cursor=pointer]:
                - /url: "#cite_note-59"
            - text: "The self-learning algorithm updates a memory matrix W =||w(a,s)|| such that in each iteration executes the following machine learning routine:"
          - list [ref=e766]:
            - listitem [ref=e767]: in situation s act a
            - listitem [ref=e768]: receive a consequence situation s'
            - listitem [ref=e769]: compute emotion of being in the consequence situation v(s')
            - listitem [ref=e770]: update crossbar memory w'(a,s) = w(a,s) + v(s')
          - paragraph [ref=e771]:
            - text: It is a system with only one input, situation, and only one output, action (or behaviour) a. There is neither a separate reinforcement input nor an advice input from the environment. The backpropagated value (secondary reinforcement) is the emotion toward the consequence situation. The CAA exists in two environments, one is the behavioural environment where it behaves, and the other is the genetic environment, wherefrom it initially and only once receives initial emotions about situations to be encountered in the behavioural environment. After receiving the genome (species) vector from the genetic environment, the CAA learns a goal-seeking behaviour in an environment that contains both desirable and undesirable situations.
            - superscript [ref=e772]:
              - link "[60]" [ref=e773] [cursor=pointer]:
                - /url: "#cite_note-60"
          - generic [ref=e774]:
            - heading "Feature learning" [level=4] [ref=e775]
            - generic [ref=e776]:
              - text: "["
              - link "edit" [ref=e777] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=18
              - text: "]"
          - note [ref=e778]:
            - text: "Main article:"
            - link "Feature learning" [ref=e779] [cursor=pointer]:
              - /url: /wiki/Feature_learning
          - paragraph [ref=e780]:
            - text: Several learning algorithms aim at discovering better representations of the inputs provided during training.
            - superscript [ref=e781]:
              - link "[61]" [ref=e782] [cursor=pointer]:
                - /url: "#cite_note-pami-61"
            - text: Classic examples include
            - link "principal component analysis" [ref=e783] [cursor=pointer]:
              - /url: /wiki/Principal_component_analysis
            - text: and cluster analysis. Feature learning algorithms, also called representation learning algorithms, often attempt to preserve the information in their input but also transform it in a way that makes it useful, often as a pre-processing step before performing classification or predictions. This technique allows reconstruction of the inputs coming from the unknown data-generating distribution, while not being necessarily faithful to configurations that are implausible under that distribution. This replaces manual
            - link "feature engineering" [ref=e784] [cursor=pointer]:
              - /url: /wiki/Feature_engineering
            - text: ", and allows a machine to both learn the features and use them to perform a specific task."
          - paragraph [ref=e785]:
            - text: Feature learning can be either supervised or unsupervised. In supervised feature learning, features are learned using labelled input data. Examples include
            - link "artificial neural networks" [ref=e786] [cursor=pointer]:
              - /url: /wiki/Artificial_neural_network
            - text: ","
            - link "multilayer perceptrons" [ref=e787] [cursor=pointer]:
              - /url: /wiki/Multilayer_perceptron
            - text: ", and supervised"
            - link "dictionary learning" [ref=e788] [cursor=pointer]:
              - /url: /wiki/Dictionary_learning
            - text: . In unsupervised feature learning, features are learned with unlabelled input data. Examples include dictionary learning,
            - link "independent component analysis" [ref=e789] [cursor=pointer]:
              - /url: /wiki/Independent_component_analysis
            - text: ","
            - link "autoencoders" [ref=e790] [cursor=pointer]:
              - /url: /wiki/Autoencoder
            - text: ","
            - link "matrix factorisation" [ref=e791] [cursor=pointer]:
              - /url: /wiki/Matrix_decomposition
            - superscript [ref=e792]:
              - link "[62]" [ref=e793] [cursor=pointer]:
                - /url: "#cite_note-62"
            - text: and various forms of
            - link "clustering" [ref=e794] [cursor=pointer]:
              - /url: /wiki/Cluster_analysis
            - text: .
            - superscript [ref=e795]:
              - link "[63]" [ref=e796] [cursor=pointer]:
                - /url: "#cite_note-coates2011-63"
            - superscript [ref=e797]:
              - link "[64]" [ref=e798] [cursor=pointer]:
                - /url: "#cite_note-64"
            - superscript [ref=e799]:
              - link "[65]" [ref=e800] [cursor=pointer]:
                - /url: "#cite_note-jurafsky-65"
          - paragraph [ref=e801]:
            - link "Manifold learning" [ref=e802] [cursor=pointer]:
              - /url: /wiki/Manifold_learning
            - text: algorithms attempt to do so under the constraint that the learned representation is low-dimensional.
            - link "Sparse coding" [ref=e803] [cursor=pointer]:
              - /url: /wiki/Sparse_coding
            - text: algorithms attempt to do so under the constraint that the learned representation is sparse, meaning that the mathematical model has many zeros.
            - link "Multilinear subspace learning" [ref=e804] [cursor=pointer]:
              - /url: /wiki/Multilinear_subspace_learning
            - text: algorithms aim to learn low-dimensional representations directly from
            - link "tensor" [ref=e805] [cursor=pointer]:
              - /url: /wiki/Tensor
            - text: representations for multidimensional data, without reshaping them into higher-dimensional vectors.
            - superscript [ref=e806]:
              - link "[66]" [ref=e807] [cursor=pointer]:
                - /url: "#cite_note-66"
            - link "Deep learning" [ref=e808] [cursor=pointer]:
              - /url: /wiki/Deep_learning
            - text: algorithms discover multiple levels of representation, or a hierarchy of features, with higher-level, more abstract features defined in terms of (or generating) lower-level features. It has been argued that an intelligent machine learns a representation that disentangles the underlying factors of variation that explain the observed data.
            - superscript [ref=e809]:
              - link "[67]" [ref=e810] [cursor=pointer]:
                - /url: "#cite_note-67"
          - paragraph [ref=e811]: Feature learning is motivated by the fact that machine learning tasks such as classification often require input that is mathematically and computationally convenient to process. However, real-world data such as images, video, and sensory data have not yielded attempts to algorithmically define specific features. An alternative is to discover such features or representations through examination, without relying on explicit algorithms.
          - generic [ref=e812]:
            - heading "Sparse dictionary learning" [level=4] [ref=e813]
            - generic [ref=e814]:
              - text: "["
              - link "edit" [ref=e815] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=19
              - text: "]"
          - note [ref=e816]:
            - text: "Main article:"
            - link "Sparse dictionary learning" [ref=e817] [cursor=pointer]:
              - /url: /wiki/Sparse_dictionary_learning
          - paragraph [ref=e818]:
            - text: Sparse dictionary learning is a feature learning method where a training example is represented as a linear combination of
            - link "basis functions" [ref=e819] [cursor=pointer]:
              - /url: /wiki/Basis_function
            - text: and assumed to be a
            - link "sparse matrix" [ref=e820] [cursor=pointer]:
              - /url: /wiki/Sparse_matrix
            - text: . The method is
            - link "strongly NP-hard" [ref=e821] [cursor=pointer]:
              - /url: /wiki/Strongly_NP-hard
            - text: and difficult to solve approximately.
            - superscript [ref=e822]:
              - link "[68]" [ref=e823] [cursor=pointer]:
                - /url: "#cite_note-68"
            - text: A popular
            - link "heuristic" [ref=e824] [cursor=pointer]:
              - /url: /wiki/Heuristic
            - text: method for sparse dictionary learning is the
            - link "k-SVD" [ref=e825] [cursor=pointer]:
              - /url: /wiki/K-SVD
            - text: algorithm. Sparse dictionary learning has been applied in several contexts. In classification, the problem is to determine the class to which a previously unseen training example belongs. For a dictionary where each class has already been built, a new training example is associated with the class that is best sparsely represented by the corresponding dictionary. Sparse dictionary learning has also been applied in
            - link "image denoising" [ref=e826] [cursor=pointer]:
              - /url: /wiki/Image_denoising
            - text: . The key idea is that a clean image patch can be sparsely represented by an image dictionary, but the noise cannot.
            - superscript [ref=e827]:
              - link "[69]" [ref=e828] [cursor=pointer]:
                - /url: "#cite_note-69"
          - generic [ref=e829]:
            - heading "Anomaly detection" [level=4] [ref=e830]
            - generic [ref=e831]:
              - text: "["
              - link "edit" [ref=e832] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=20
              - text: "]"
          - note [ref=e833]:
            - text: "Main article:"
            - link "Anomaly detection" [ref=e834] [cursor=pointer]:
              - /url: /wiki/Anomaly_detection
          - paragraph [ref=e835]:
            - text: In
            - link "data mining" [ref=e836] [cursor=pointer]:
              - /url: /wiki/Data_mining
            - text: ", anomaly detection, also known as outlier detection, is the identification of rare items, events or observations that raise suspicions by differing significantly from the majority of the data."
            - superscript [ref=e837]:
              - link "[70]" [ref=e838] [cursor=pointer]:
                - /url: "#cite_note-Zimek-2017-70"
            - text: Typically, the anomalous items represent an issue such as
            - link "bank fraud" [ref=e839] [cursor=pointer]:
              - /url: /wiki/Bank_fraud
            - text: ", a structural defect, medical problems or errors in a text. Anomalies are referred to as"
            - link "outliers" [ref=e840] [cursor=pointer]:
              - /url: /wiki/Outlier
            - text: ", novelties, noise, deviations and exceptions."
            - superscript [ref=e841]:
              - link "[71]" [ref=e842] [cursor=pointer]:
                - /url: "#cite_note-71"
          - paragraph [ref=e843]:
            - text: In particular, in the context of abuse and network intrusion detection, the interesting objects are often not rare, but unexpected bursts of inactivity. This pattern does not adhere to the common statistical definition of an outlier as a rare object. Many outlier detection methods (in particular, unsupervised algorithms) will fail on such data unless aggregated appropriately. Instead, a cluster analysis algorithm may be able to detect the micro-clusters formed by these patterns.
            - superscript [ref=e844]:
              - link "[72]" [ref=e845] [cursor=pointer]:
                - /url: "#cite_note-72"
          - paragraph [ref=e846]:
            - text: Three broad categories of anomaly detection techniques exist.
            - superscript [ref=e847]:
              - link "[73]" [ref=e848] [cursor=pointer]:
                - /url: "#cite_note-ChandolaSurvey-73"
            - text: Unsupervised anomaly detection techniques detect anomalies in an unlabelled test data set under the assumption that the majority of the instances in the data set are normal, by looking for instances that seem to fit the least to the remainder of the data set. Supervised anomaly detection techniques require a data set that has been labelled as "normal" and "abnormal" and involves training a classifier (the key difference from many other statistical classification problems is the inherently unbalanced nature of outlier detection). Semi-supervised anomaly detection techniques construct a model representing normal behaviour from a given normal training data set and then test the likelihood of a test instance being generated by the model.
          - generic [ref=e849]:
            - heading "Robot learning" [level=4] [ref=e850]
            - generic [ref=e851]:
              - text: "["
              - link "edit" [ref=e852] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=21
              - text: "]"
          - paragraph [ref=e853]:
            - link "Robot learning" [ref=e854] [cursor=pointer]:
              - /url: /wiki/Robot_learning
            - text: is inspired by a multitude of machine learning methods, starting from supervised learning, reinforcement learning,
            - superscript [ref=e855]:
              - link "[74]" [ref=e856] [cursor=pointer]:
                - /url: "#cite_note-74"
            - superscript [ref=e857]:
              - link "[75]" [ref=e858] [cursor=pointer]:
                - /url: "#cite_note-75"
            - text: and finally
            - link "meta-learning" [ref=e859] [cursor=pointer]:
              - /url: /wiki/Meta-learning_(computer_science)
            - text: (e.g. MAML).
          - generic [ref=e860]:
            - heading "Association rules" [level=4] [ref=e861]
            - generic [ref=e862]:
              - text: "["
              - link "edit" [ref=e863] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=22
              - text: "]"
          - note [ref=e864]:
            - text: "Main article:"
            - link "Association rule learning" [ref=e865] [cursor=pointer]:
              - /url: /wiki/Association_rule_learning
          - note [ref=e866]:
            - text: "See also:"
            - link "Inductive logic programming" [ref=e867] [cursor=pointer]:
              - /url: /wiki/Inductive_logic_programming
          - paragraph [ref=e868]:
            - text: Association rule learning is a
            - link "rule-based machine learning" [ref=e869] [cursor=pointer]:
              - /url: /wiki/Rule-based_machine_learning
            - text: method for discovering relationships between variables in large databases. It is intended to identify strong rules discovered in databases using some measure of "interestingness".
            - superscript [ref=e870]:
              - link "[76]" [ref=e871] [cursor=pointer]:
                - /url: "#cite_note-piatetsky-76"
          - paragraph [ref=e872]:
            - text: Rule-based machine learning is a general term for any machine learning method that identifies, learns, or evolves "rules" to store, manipulate or apply knowledge. The defining characteristic of a rule-based machine learning algorithm is the identification and utilisation of a set of relational rules that collectively represent the knowledge captured by the system. This is in contrast to other machine learning algorithms that commonly identify a singular model that can be universally applied to any instance in order to make a prediction.
            - superscript [ref=e873]:
              - link "[77]" [ref=e874] [cursor=pointer]:
                - /url: "#cite_note-77"
            - text: Rule-based machine learning approaches include
            - link "learning classifier systems" [ref=e875] [cursor=pointer]:
              - /url: /wiki/Learning_classifier_system
            - text: ", association rule learning, and"
            - link "artificial immune systems" [ref=e876] [cursor=pointer]:
              - /url: /wiki/Artificial_immune_system
            - text: .
          - paragraph [ref=e877]:
            - text: Based on the concept of strong rules,
            - link "Rakesh Agrawal" [ref=e878] [cursor=pointer]:
              - /url: /wiki/Rakesh_Agrawal_(computer_scientist)
            - text: ","
            - link "Tomasz Imieliński" [ref=e879] [cursor=pointer]:
              - /url: /wiki/Tomasz_Imieli%C5%84ski
            - text: and Arun Swami introduced association rules for discovering regularities between products in large-scale transaction data recorded by
            - link "point-of-sale" [ref=e880] [cursor=pointer]:
              - /url: /wiki/Point-of-sale
            - text: (POS) systems in supermarkets.
            - superscript [ref=e881]:
              - link "[78]" [ref=e882] [cursor=pointer]:
                - /url: "#cite_note-mining-78"
            - text: For example, the rule
            - generic [ref=e883]:
              - math [ref=e885]:
                - generic [ref=e888]:
                  - generic [ref=e889]: "{"
                  - generic [ref=e890]:
                    - generic [ref=e891]: o
                    - generic [ref=e892]: "n"
                    - generic [ref=e893]: i
                    - generic [ref=e894]: o
                    - generic [ref=e895]: "n"
                    - generic [ref=e896]: s
                    - generic [ref=e897]: ","
                    - generic [ref=e898]: p
                    - generic [ref=e899]: o
                    - generic [ref=e900]: t
                    - generic [ref=e901]: a
                    - generic [ref=e902]: t
                    - generic [ref=e903]: o
                    - generic [ref=e904]: e
                    - generic [ref=e905]: s
                  - generic [ref=e906]: "}"
                  - generic [ref=e907]: ⇒
                  - generic [ref=e908]: "{"
                  - generic [ref=e909]:
                    - generic [ref=e910]: b
                    - generic [ref=e911]: u
                    - generic [ref=e912]: r
                    - generic [ref=e913]: g
                    - generic [ref=e914]: e
                    - generic [ref=e915]: r
                  - generic [ref=e916]: "}"
              - img [ref=e917]
            - text: found in the sales data of a supermarket would indicate that if a customer buys onions and potatoes together, they are likely to also buy hamburger meat. Such information can be used as the basis for decisions about marketing activities such as promotional
            - link "pricing" [ref=e918] [cursor=pointer]:
              - /url: /wiki/Pricing
            - text: or
            - link "product placements" [ref=e919] [cursor=pointer]:
              - /url: /wiki/Product_placement
            - text: . In addition to
            - link "market basket analysis" [ref=e920] [cursor=pointer]:
              - /url: /wiki/Market_basket_analysis
            - text: ", association rules are employed today in application areas including"
            - link "Web usage mining" [ref=e921] [cursor=pointer]:
              - /url: /wiki/Web_usage_mining
            - text: ","
            - link "intrusion detection" [ref=e922] [cursor=pointer]:
              - /url: /wiki/Intrusion_detection
            - text: ","
            - link "continuous production" [ref=e923] [cursor=pointer]:
              - /url: /wiki/Continuous_production
            - text: ", and"
            - link "bioinformatics" [ref=e924] [cursor=pointer]:
              - /url: /wiki/Bioinformatics
            - text: . In contrast with
            - link "sequence mining" [ref=e925] [cursor=pointer]:
              - /url: /wiki/Sequence_mining
            - text: ", association rule learning typically does not consider the order of items either within a transaction or across transactions."
          - paragraph [ref=e926]:
            - link "Learning classifier systems" [ref=e927] [cursor=pointer]:
              - /url: /wiki/Learning_classifier_system
            - text: (LCS) are a family of rule-based machine learning algorithms that combine a discovery component, typically a
            - link "genetic algorithm" [ref=e928] [cursor=pointer]:
              - /url: /wiki/Genetic_algorithm
            - text: ", with a learning component, performing either"
            - link "supervised learning" [ref=e929] [cursor=pointer]:
              - /url: /wiki/Supervised_learning
            - text: ","
            - link "reinforcement learning" [ref=e930] [cursor=pointer]:
              - /url: /wiki/Reinforcement_learning
            - text: ", or"
            - link "unsupervised learning" [ref=e931] [cursor=pointer]:
              - /url: /wiki/Unsupervised_learning
            - text: . They seek to identify a set of context-dependent rules that collectively store and apply knowledge in a
            - link "piecewise" [ref=e932] [cursor=pointer]:
              - /url: /wiki/Piecewise
            - text: manner to make predictions.
            - superscript [ref=e933]:
              - link "[79]" [ref=e934] [cursor=pointer]:
                - /url: "#cite_note-79"
          - paragraph [ref=e935]:
            - link "Inductive logic programming" [ref=e936] [cursor=pointer]:
              - /url: /wiki/Inductive_logic_programming
            - text: (ILP) is an approach to rule learning using
            - link "logic programming" [ref=e937] [cursor=pointer]:
              - /url: /wiki/Logic_programming
            - text: as a uniform representation for input examples, background knowledge, and hypotheses. Given an encoding of the known background knowledge and a set of examples represented as a logical database of facts, an ILP system will derive a hypothesized logic program that
            - link "entails" [ref=e938] [cursor=pointer]:
              - /url: /wiki/Entailment
            - text: all positive and no negative examples.
            - link "Inductive programming" [ref=e939] [cursor=pointer]:
              - /url: /wiki/Inductive_programming
            - text: is a related field that considers any kind of programming language for representing hypotheses (and not only logic programming), such as
            - link "functional programs" [ref=e940] [cursor=pointer]:
              - /url: /wiki/Functional_programming
            - text: .
          - paragraph [ref=e941]:
            - text: Inductive logic programming is particularly useful in
            - link "bioinformatics" [ref=e942] [cursor=pointer]:
              - /url: /wiki/Bioinformatics
            - text: and
            - link "natural language processing" [ref=e943] [cursor=pointer]:
              - /url: /wiki/Natural_language_processing
            - text: .
            - link "Gordon Plotkin" [ref=e944] [cursor=pointer]:
              - /url: /wiki/Gordon_Plotkin
            - text: and
            - link "Ehud Shapiro" [ref=e945] [cursor=pointer]:
              - /url: /wiki/Ehud_Shapiro
            - text: laid the initial theoretical foundation for inductive machine learning in a logical setting.
            - superscript [ref=e946]:
              - link "[80]" [ref=e947] [cursor=pointer]:
                - /url: "#cite_note-80"
            - superscript [ref=e948]:
              - link "[81]" [ref=e949] [cursor=pointer]:
                - /url: "#cite_note-81"
            - superscript [ref=e950]:
              - link "[82]" [ref=e951] [cursor=pointer]:
                - /url: "#cite_note-82"
            - text: "Shapiro built their first implementation (Model Inference System) in 1981: a"
            - link "Prolog" [ref=e952] [cursor=pointer]:
              - /url: /wiki/Prolog
            - text: program that inductively inferred logic programs from positive and negative examples.
            - superscript [ref=e953]:
              - link "[83]" [ref=e954] [cursor=pointer]:
                - /url: "#cite_note-83"
            - text: The term inductive here refers to
            - link "philosophical" [ref=e955] [cursor=pointer]:
              - /url: /wiki/Inductive_reasoning
            - text: induction, suggesting a theory to explain observed facts, rather than
            - link "mathematical induction" [ref=e956] [cursor=pointer]:
              - /url: /wiki/Mathematical_induction
            - text: ", proving a property for all members of a well-ordered set."
          - generic [ref=e957]:
            - heading "Models" [level=2] [ref=e958]
            - generic [ref=e959]:
              - text: "["
              - link "edit" [ref=e960] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=23
              - text: "]"
          - paragraph [ref=e961]:
            - text: A
            - generic [ref=e963]: machine learning model
            - text: is a type of
            - link "mathematical model" [ref=e964] [cursor=pointer]:
              - /url: /wiki/Mathematical_model
            - text: that, once "trained" on a given dataset, can be used to make predictions or classifications on new data. During training, a learning algorithm iteratively adjusts the model's internal parameters to minimise errors in its predictions.
            - superscript [ref=e965]:
              - link "[84]" [ref=e966] [cursor=pointer]:
                - /url: "#cite_note-84"
            - text: By extension, the term "model" can refer to several levels of specificity, from a general class of models and their associated learning algorithms to a fully trained model with all its internal parameters tuned.
            - superscript [ref=e967]:
              - link "[85]" [ref=e968] [cursor=pointer]:
                - /url: "#cite_note-85"
          - paragraph [ref=e969]:
            - text: Various types of models have been used and researched for machine learning systems, picking the best model for a task is called
            - link "model selection" [ref=e970] [cursor=pointer]:
              - /url: /wiki/Model_selection
            - text: .
          - generic [ref=e971]:
            - heading "Artificial neural networks" [level=3] [ref=e972]
            - generic [ref=e973]:
              - text: "["
              - link "edit" [ref=e974] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=24
              - text: "]"
          - note [ref=e975]:
            - text: "Main article:"
            - link "Artificial neural network" [ref=e976] [cursor=pointer]:
              - /url: /wiki/Artificial_neural_network
          - note [ref=e977]:
            - text: "See also:"
            - link "Deep learning" [ref=e978] [cursor=pointer]:
              - /url: /wiki/Deep_learning
          - figure "An artificial neural network is an interconnected group of nodes, akin to the vast network of neurons in a brain. Here, each circular node represents an artificial neuron and an arrow represents a connection from the output of one artificial neuron to the input of another." [ref=e979]:
            - link [ref=e980] [cursor=pointer]:
              - /url: /wiki/File:Colored_neural_network.svg
              - img [ref=e981]
            - generic [ref=e982]:
              - text: An artificial neural network is an interconnected group of nodes, akin to the vast network of
              - link "neurons" [ref=e983] [cursor=pointer]:
                - /url: /wiki/Neuron
              - text: in a
              - link "brain" [ref=e984] [cursor=pointer]:
                - /url: /wiki/Brain
              - text: . Here, each circular node represents an
              - link "artificial neuron" [ref=e985] [cursor=pointer]:
                - /url: /wiki/Artificial_neuron
              - text: and an arrow represents a connection from the output of one artificial neuron to the input of another.
          - paragraph [ref=e986]:
            - text: Artificial neural networks (ANNs), or
            - link "connectionist" [ref=e987] [cursor=pointer]:
              - /url: /wiki/Connectionism
            - text: systems, are computing systems vaguely inspired by the
            - link "biological neural networks" [ref=e988] [cursor=pointer]:
              - /url: /wiki/Biological_neural_network
            - text: that constitute animal
            - link "brains" [ref=e989] [cursor=pointer]:
              - /url: /wiki/Brain
            - text: . Such systems "learn" to perform tasks by considering examples, generally without being programmed with any task-specific rules.
          - paragraph [ref=e990]:
            - text: An ANN is a model based on a collection of connected units or nodes called "
            - link "artificial neurons" [ref=e991] [cursor=pointer]:
              - /url: /wiki/Artificial_neuron
            - text: "\", which loosely model the"
            - link "neurons" [ref=e992] [cursor=pointer]:
              - /url: /wiki/Neuron
            - text: in a biological brain. Each connection, like the
            - link "synapses" [ref=e993] [cursor=pointer]:
              - /url: /wiki/Synapse
            - text: in a biological brain, can transmit information, a "signal", from one artificial neuron to another. An artificial neuron that receives a signal can process it and then signal additional artificial neurons connected to it. In common ANN implementations, the signal at a connection between artificial neurons is a
            - link "real number" [ref=e994] [cursor=pointer]:
              - /url: /wiki/Real_number
            - text: ", and the output of each artificial neuron is computed by some non-linear function of the sum of its inputs. The connections between artificial neurons are called \"edges\". Artificial neurons and edges typically have a"
            - link "weight" [ref=e995] [cursor=pointer]:
              - /url: /wiki/Weight_(mathematics)
            - text: that adjusts as learning proceeds. The weight increases or decreases the strength of the signal at a connection. Artificial neurons may have a threshold such that the signal is only sent if the aggregate signal crosses that threshold. Typically, artificial neurons are aggregated into layers. Different layers may perform different kinds of transformations on their inputs. Signals travel from the first layer (the input layer) to the last layer (the output layer), possibly after traversing the layers multiple times.
          - paragraph [ref=e996]:
            - text: The original goal of the ANN approach was to solve problems in the same way that a
            - link "human brain" [ref=e997] [cursor=pointer]:
              - /url: /wiki/Human_brain
            - text: would. However, over time, attention moved to performing specific tasks, leading to deviations from
            - link "biology" [ref=e998] [cursor=pointer]:
              - /url: /wiki/Biology
            - text: . Artificial neural networks have been used on a variety of tasks, including
            - link "computer vision" [ref=e999] [cursor=pointer]:
              - /url: /wiki/Computer_vision
            - text: ","
            - link "speech recognition" [ref=e1000] [cursor=pointer]:
              - /url: /wiki/Speech_recognition
            - text: ","
            - link "machine translation" [ref=e1001] [cursor=pointer]:
              - /url: /wiki/Machine_translation
            - text: ","
            - link "social network" [ref=e1002] [cursor=pointer]:
              - /url: /wiki/Social_network
            - text: filtering,
            - link "playing board and video games" [ref=e1003] [cursor=pointer]:
              - /url: /wiki/General_game_playing
            - text: and
            - link "medical diagnosis" [ref=e1004] [cursor=pointer]:
              - /url: /wiki/Medical_diagnosis
            - text: .
          - paragraph [ref=e1005]:
            - link "Deep learning" [ref=e1006] [cursor=pointer]:
              - /url: /wiki/Deep_learning
            - text: consists of multiple hidden layers in an artificial neural network. This approach tries to model the way the human brain processes light and sound into vision and hearing. Some successful applications of deep learning are computer vision and speech recognition.
            - superscript [ref=e1007]:
              - link "[86]" [ref=e1008] [cursor=pointer]:
                - /url: "#cite_note-86"
          - generic [ref=e1009]:
            - heading "Decision trees" [level=3] [ref=e1010]
            - generic [ref=e1011]:
              - text: "["
              - link "edit" [ref=e1012] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=25
              - text: "]"
          - note [ref=e1013]:
            - text: "Main article:"
            - link "Decision tree learning" [ref=e1014] [cursor=pointer]:
              - /url: /wiki/Decision_tree_learning
          - figure "A decision tree showing survival probability of passengers on the Titanic" [ref=e1015]:
            - link [ref=e1016] [cursor=pointer]:
              - /url: /wiki/File:Decision_Tree.jpg
              - img [ref=e1017]
            - generic [ref=e1018]:
              - text: A decision tree showing survival probability of passengers on the
              - link "Titanic" [ref=e1019] [cursor=pointer]:
                - /url: /wiki/Titanic
          - paragraph [ref=e1020]:
            - text: Decision tree learning uses a
            - link "decision tree" [ref=e1021] [cursor=pointer]:
              - /url: /wiki/Decision_tree
            - text: as a
            - link "predictive model" [ref=e1022] [cursor=pointer]:
              - /url: /wiki/Predictive_modeling
            - text: to go from observations about an item (represented in the branches) to conclusions about the item's target value (represented in the leaves). It is one of the predictive modelling approaches used in statistics, data mining, and machine learning. Tree models where the target variable can take a discrete set of values are called classification trees; in these tree structures,
            - link "leaves" [ref=e1023] [cursor=pointer]:
              - /url: /wiki/Leaf_node
            - text: represent class labels, and branches represent
            - link "conjunctions" [ref=e1024] [cursor=pointer]:
              - /url: /wiki/Logical_conjunction
            - text: of features that lead to those class labels. Decision trees where the target variable can take continuous values (typically
            - link "real numbers" [ref=e1025] [cursor=pointer]:
              - /url: /wiki/Real_numbers
            - text: ) are called regression trees. In decision analysis, a decision tree can be used to visually and explicitly represent decisions and
            - link "decision making" [ref=e1026] [cursor=pointer]:
              - /url: /wiki/Decision_making
            - text: . In data mining, a decision tree describes data, but the resulting classification tree can be an input for decision-making.
          - generic [ref=e1027]:
            - heading "Random forest regression" [level=3] [ref=e1028]
            - generic [ref=e1029]:
              - text: "["
              - link "edit" [ref=e1030] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=26
              - text: "]"
          - paragraph [ref=e1031]:
            - link "Random forest regression" [ref=e1032] [cursor=pointer]:
              - /url: /wiki/Random_forest
            - text: (RFR) falls under the umbrella of decision
            - link "tree-based models" [ref=e1033] [cursor=pointer]:
              - /url: /wiki/Tree-based_models
            - text: . RFR is an ensemble learning method that builds multiple decision trees and averages their predictions to improve accuracy and to avoid overfitting. To build decision trees, RFR uses bootstrapped sampling; for instance, each decision tree is trained on random data from the training set. This random selection of RFR for training enables the model to reduce biased predictions and achieve a higher degree of accuracy. RFR generates independent decision trees, and it can work on single-output data as well as multiple regressor tasks. This makes RFR compatible to be use in various applications.
            - superscript [ref=e1034]:
              - link "[87]" [ref=e1035] [cursor=pointer]:
                - /url: "#cite_note-87"
            - superscript [ref=e1036]:
              - link "[88]" [ref=e1037] [cursor=pointer]:
                - /url: "#cite_note-88"
          - generic [ref=e1038]:
            - heading "Support-vector machines" [level=3] [ref=e1039]
            - generic [ref=e1040]:
              - text: "["
              - link "edit" [ref=e1041] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=27
              - text: "]"
          - note [ref=e1042]:
            - text: "Main article:"
            - link "Support-vector machine" [ref=e1043] [cursor=pointer]:
              - /url: /wiki/Support-vector_machine
          - paragraph [ref=e1044]:
            - text: Support-vector machines (SVMs), also known as support-vector networks, are a set of related
            - link "supervised learning" [ref=e1045] [cursor=pointer]:
              - /url: /wiki/Supervised_learning
            - text: methods used for classification and regression. Given a set of training examples, each marked as belonging to one of two categories, an SVM training algorithm builds a model that predicts whether a new example falls into one category.
            - superscript [ref=e1046]:
              - link "[89]" [ref=e1047] [cursor=pointer]:
                - /url: "#cite_note-CorinnaCortes-89"
            - text: An SVM training algorithm is a non-
            - link "probabilistic" [ref=e1048] [cursor=pointer]:
              - /url: /wiki/Probabilistic_classification
            - text: ","
            - link "binary" [ref=e1049] [cursor=pointer]:
              - /url: /wiki/Binary_classifier
            - text: ","
            - link "linear classifier" [ref=e1050] [cursor=pointer]:
              - /url: /wiki/Linear_classifier
            - text: ", although methods such as"
            - link "Platt scaling" [ref=e1051] [cursor=pointer]:
              - /url: /wiki/Platt_scaling
            - text: exist to use SVM in a probabilistic classification setting. In addition to performing linear classification, SVMs can efficiently perform a non-linear classification using what is called the
            - link "kernel trick" [ref=e1052] [cursor=pointer]:
              - /url: /wiki/Kernel_trick
            - text: ", implicitly mapping their inputs into high-dimensional feature spaces."
          - generic [ref=e1053]:
            - heading "Regression analysis" [level=3] [ref=e1054]
            - generic [ref=e1055]:
              - text: "["
              - link "edit" [ref=e1056] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=28
              - text: "]"
          - note [ref=e1057]:
            - text: "Main article:"
            - link "Regression analysis" [ref=e1058] [cursor=pointer]:
              - /url: /wiki/Regression_analysis
          - figure "Illustration of linear regression on a data set" [ref=e1059]:
            - link [ref=e1060] [cursor=pointer]:
              - /url: /wiki/File:Linear_regression.svg
              - img [ref=e1061]
            - generic [ref=e1062]: Illustration of linear regression on a data set
          - paragraph [ref=e1063]:
            - text: Regression analysis encompasses a large variety of statistical methods to estimate the relationship between input variables and their associated features. Its most common form is
            - link "linear regression" [ref=e1064] [cursor=pointer]:
              - /url: /wiki/Linear_regression
            - text: ", where a single line is drawn to best fit the given data according to a mathematical criterion such as"
            - link "ordinary least squares" [ref=e1065] [cursor=pointer]:
              - /url: /wiki/Ordinary_least_squares
            - text: . The latter is often extended by
            - link "regularisation" [ref=e1066] [cursor=pointer]:
              - /url: /wiki/Regularization_(mathematics)
            - text: methods to mitigate overfitting and bias, as in
            - link "ridge regression" [ref=e1067] [cursor=pointer]:
              - /url: /wiki/Ridge_regression
            - text: . When dealing with non-linear problems, go-to models include
            - link "polynomial regression" [ref=e1068] [cursor=pointer]:
              - /url: /wiki/Polynomial_regression
            - text: (for example, used for trendline fitting in Microsoft Excel
            - superscript [ref=e1069]:
              - link "[90]" [ref=e1070] [cursor=pointer]:
                - /url: "#cite_note-90"
            - text: ),
            - link "logistic regression" [ref=e1071] [cursor=pointer]:
              - /url: /wiki/Logistic_regression
            - text: (often used in
            - link "statistical classification" [ref=e1072] [cursor=pointer]:
              - /url: /wiki/Statistical_classification
            - text: ) or even
            - link "kernel regression" [ref=e1073] [cursor=pointer]:
              - /url: /wiki/Kernel_regression
            - text: ", which introduces non-linearity by taking advantage of the"
            - link "kernel trick" [ref=e1074] [cursor=pointer]:
              - /url: /wiki/Kernel_trick
            - text: to implicitly map input variables to higher-dimensional space.
          - paragraph [ref=e1075]:
            - link "Multivariate linear regression" [ref=e1076] [cursor=pointer]:
              - /url: /wiki/General_linear_model
            - text: extends the concept of linear regression to handle multiple dependent variables simultaneously. This approach estimates the relationships between a set of input variables and several output variables by fitting a
            - link "multidimensional" [ref=e1077] [cursor=pointer]:
              - /url: /wiki/Multidimensional_system
            - text: linear model. It is particularly useful in scenarios where outputs are interdependent or share underlying patterns, such as predicting multiple economic indicators or reconstructing images,
            - superscript [ref=e1078]:
              - link "[91]" [ref=e1079] [cursor=pointer]:
                - /url: "#cite_note-91"
            - text: which are inherently multi-dimensional.
          - generic [ref=e1080]:
            - heading "Bayesian networks" [level=3] [ref=e1081]
            - generic [ref=e1082]:
              - text: "["
              - link "edit" [ref=e1083] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=29
              - text: "]"
          - note [ref=e1084]:
            - text: "Main article:"
            - link "Bayesian network" [ref=e1085] [cursor=pointer]:
              - /url: /wiki/Bayesian_network
          - figure "A simple Bayesian network. Rain influences whether the sprinkler is activated, and both rain and the sprinkler influence whether the grass is wet." [ref=e1086]:
            - link [ref=e1087] [cursor=pointer]:
              - /url: /wiki/File:SimpleBayesNetNodes.svg
              - img [ref=e1088]
            - generic [ref=e1089]: A simple Bayesian network. Rain influences whether the sprinkler is activated, and both rain and the sprinkler influence whether the grass is wet.
          - paragraph [ref=e1090]:
            - text: A Bayesian network, belief network, or directed acyclic graphical model is a probabilistic
            - link "graphical model" [ref=e1091] [cursor=pointer]:
              - /url: /wiki/Graphical_model
            - text: that represents a set of
            - link "random variables" [ref=e1092] [cursor=pointer]:
              - /url: /wiki/Random_variables
            - text: and their
            - link "conditional independence" [ref=e1093] [cursor=pointer]:
              - /url: /wiki/Conditional_independence
            - text: with a
            - link "directed acyclic graph" [ref=e1094] [cursor=pointer]:
              - /url: /wiki/Directed_acyclic_graph
            - text: (DAG). For example, a Bayesian network could represent the probabilistic relationships between diseases and symptoms. Given symptoms, the network can be used to compute the probabilities of the presence of various diseases. Efficient algorithms exist that perform
            - link "inference" [ref=e1095] [cursor=pointer]:
              - /url: /wiki/Bayesian_inference
            - text: and learning. Bayesian networks that model sequences of variables, like
            - link "speech signals" [ref=e1096] [cursor=pointer]:
              - /url: /wiki/Speech_recognition
            - text: or
            - link "protein sequences" [ref=e1097] [cursor=pointer]:
              - /url: /wiki/Peptide_sequence
            - text: ", are called"
            - link "dynamic Bayesian networks" [ref=e1098] [cursor=pointer]:
              - /url: /wiki/Dynamic_Bayesian_network
            - text: . Generalisations of Bayesian networks that can represent and solve decision problems under uncertainty are called
            - link "influence diagrams" [ref=e1099] [cursor=pointer]:
              - /url: /wiki/Influence_diagram
            - text: .
          - generic [ref=e1100]:
            - heading "Gaussian processes" [level=3] [ref=e1101]
            - generic [ref=e1102]:
              - text: "["
              - link "edit" [ref=e1103] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=30
              - text: "]"
          - note [ref=e1104]:
            - text: "Main article:"
            - link "Gaussian processes" [ref=e1105] [cursor=pointer]:
              - /url: /wiki/Gaussian_processes
          - figure "An example of Gaussian Process Regression (prediction) compared with other regression models[92]" [ref=e1106]:
            - link [ref=e1107] [cursor=pointer]:
              - /url: /wiki/File:Regressions_sine_demo.svg
              - img [ref=e1108]
            - generic [ref=e1109]:
              - text: An example of Gaussian Process Regression (prediction) compared with other regression models
              - superscript [ref=e1110]:
                - link "[92]" [ref=e1111] [cursor=pointer]:
                  - /url: "#cite_note-92"
          - paragraph [ref=e1112]:
            - text: A Gaussian process is a
            - link "stochastic process" [ref=e1113] [cursor=pointer]:
              - /url: /wiki/Stochastic_process
            - text: in which every finite collection of the random variables in the process has a
            - link "multivariate normal distribution" [ref=e1114] [cursor=pointer]:
              - /url: /wiki/Multivariate_normal_distribution
            - text: ", and it relies on a pre-defined"
            - link "covariance function" [ref=e1115] [cursor=pointer]:
              - /url: /wiki/Covariance_function
            - text: ", or kernel, that models how pairs of points relate to each other depending on their locations."
          - paragraph [ref=e1116]: Given a set of observed points, or input–output examples, the distribution of the (unobserved) output of a new point as a function of its input data can be directly computed by looking at the observed points and the covariances between those points and the new, unobserved point.
          - paragraph [ref=e1117]:
            - text: Gaussian processes are popular surrogate models in
            - link "Bayesian optimisation" [ref=e1118] [cursor=pointer]:
              - /url: /wiki/Bayesian_optimisation
            - text: used to do
            - link "hyperparameter optimisation" [ref=e1119] [cursor=pointer]:
              - /url: /wiki/Hyperparameter_optimisation
            - text: .
          - generic [ref=e1120]:
            - heading "Genetic algorithms" [level=3] [ref=e1121]
            - generic [ref=e1122]:
              - text: "["
              - link "edit" [ref=e1123] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=31
              - text: "]"
          - note [ref=e1124]:
            - text: "Main article:"
            - link "Genetic algorithm" [ref=e1125] [cursor=pointer]:
              - /url: /wiki/Genetic_algorithm
          - paragraph [ref=e1126]:
            - text: A genetic algorithm (GA) is a
            - link "search algorithm" [ref=e1127] [cursor=pointer]:
              - /url: /wiki/Search_algorithm
            - text: and
            - link "heuristic" [ref=e1128] [cursor=pointer]:
              - /url: /wiki/Heuristic_(computer_science)
            - text: technique that mimics the process of
            - link "natural selection" [ref=e1129] [cursor=pointer]:
              - /url: /wiki/Natural_selection
            - text: ", using methods such as"
            - link "mutation" [ref=e1130] [cursor=pointer]:
              - /url: /wiki/Mutation_(genetic_algorithm)
            - text: and
            - link "crossover" [ref=e1131] [cursor=pointer]:
              - /url: /wiki/Crossover_(genetic_algorithm)
            - text: to generate new
            - link "genotypes" [ref=e1132] [cursor=pointer]:
              - /url: /wiki/Chromosome_(genetic_algorithm)
            - text: in the hope of finding good solutions to a given problem. In machine learning, genetic algorithms were used in the 1980s and 1990s.
            - superscript [ref=e1133]:
              - link "[93]" [ref=e1134] [cursor=pointer]:
                - /url: "#cite_note-93"
            - superscript [ref=e1135]:
              - link "[94]" [ref=e1136] [cursor=pointer]:
                - /url: "#cite_note-94"
            - text: Conversely, machine learning techniques have been used to improve the performance of genetic and
            - link "evolutionary algorithms" [ref=e1137] [cursor=pointer]:
              - /url: /wiki/Evolutionary_algorithm
            - text: .
            - superscript [ref=e1138]:
              - link "[95]" [ref=e1139] [cursor=pointer]:
                - /url: "#cite_note-95"
          - generic [ref=e1140]:
            - heading "Belief functions" [level=3] [ref=e1141]
            - generic [ref=e1142]:
              - text: "["
              - link "edit" [ref=e1143] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=32
              - text: "]"
          - note [ref=e1144]:
            - text: "Main article:"
            - link "Dempster–Shafer theory" [ref=e1145] [cursor=pointer]:
              - /url: /wiki/Dempster%E2%80%93Shafer_theory
          - paragraph [ref=e1146]:
            - text: The theory of belief functions, also referred to as evidence theory or Dempster–Shafer theory, is a general framework for reasoning with uncertainty, with understood connections to other frameworks such as
            - link "probability" [ref=e1147] [cursor=pointer]:
              - /url: /wiki/Probability
            - text: ","
            - link "possibility" [ref=e1148] [cursor=pointer]:
              - /url: /wiki/Possibility_theory
            - text: and
            - link "imprecise probability theories" [ref=e1149] [cursor=pointer]:
              - /url: /wiki/Imprecise_probability
            - text: . These theoretical frameworks can be thought of as a kind of learner and have some analogous properties of how evidence is combined (e.g., Dempster's rule of combination), just like how in a
            - link "pmf" [ref=e1150] [cursor=pointer]:
              - /url: /wiki/Probability_mass_function
            - text: "-based Bayesian approach would combine probabilities."
            - superscript [ref=e1151]:
              - link "[96]" [ref=e1152] [cursor=pointer]:
                - /url: "#cite_note-96"
            - text: However, there are many caveats to these beliefs functions when compared to Bayesian approaches to incorporate ignorance and
            - link "uncertainty quantification" [ref=e1153] [cursor=pointer]:
              - /url: /wiki/Uncertainty_quantification
            - text: . These belief function approaches that are implemented within the machine learning domain typically leverage a fusion approach of various
            - link "ensemble methods" [ref=e1154] [cursor=pointer]:
              - /url: /wiki/Ensemble_methods
            - text: to better handle the learner's
            - link "decision boundary" [ref=e1155] [cursor=pointer]:
              - /url: /wiki/Decision_boundary
            - text: ", low samples, and ambiguous class issues that standard machine learning approach tend to have difficulty resolving."
            - superscript [ref=e1156]:
              - link "[97]" [ref=e1157] [cursor=pointer]:
                - /url: "#cite_note-YoosefzadehNajafabadi-2021-97"
            - superscript [ref=e1158]:
              - link "[6]" [ref=e1159] [cursor=pointer]:
                - /url: "#cite_note-Kohavi-6"
            - text: However, the computational complexity of these algorithms is dependent on the number of propositions (classes), and can lead to a much higher computation time when compared to other machine learning approaches.
          - generic [ref=e1160]:
            - heading "Rule-based models" [level=3] [ref=e1161]
            - generic [ref=e1162]:
              - text: "["
              - link "edit" [ref=e1163] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=33
              - text: "]"
          - note [ref=e1164]:
            - text: "Main article:"
            - link "Rule-based machine learning" [ref=e1165] [cursor=pointer]:
              - /url: /wiki/Rule-based_machine_learning
          - paragraph [ref=e1166]:
            - text: Rule-based machine learning (RBML) is a branch of machine learning that automatically discovers and learns 'rules' from data. It provides interpretable models, making it useful for decision-making in fields like healthcare, fraud detection, and cybersecurity. Key RBML techniques includes
            - link "learning classifier systems" [ref=e1167] [cursor=pointer]:
              - /url: /wiki/Learning_classifier_system
            - text: ","
            - superscript [ref=e1168]:
              - link "[98]" [ref=e1169] [cursor=pointer]:
                - /url: "#cite_note-98"
            - link "association rule learning" [ref=e1170] [cursor=pointer]:
              - /url: /wiki/Association_rule_learning
            - text: ","
            - superscript [ref=e1171]:
              - link "[99]" [ref=e1172] [cursor=pointer]:
                - /url: "#cite_note-99"
            - link "artificial immune systems" [ref=e1173] [cursor=pointer]:
              - /url: /wiki/Artificial_immune_system
            - text: ","
            - superscript [ref=e1174]:
              - link "[100]" [ref=e1175] [cursor=pointer]:
                - /url: "#cite_note-100"
            - text: and other similar models. These methods extract patterns from data and evolve rules over time.
          - generic [ref=e1176]:
            - heading "Training models" [level=3] [ref=e1177]
            - generic [ref=e1178]:
              - text: "["
              - link "edit" [ref=e1179] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=34
              - text: "]"
          - paragraph [ref=e1180]:
            - text: Typically, machine learning models require a high quantity of reliable data to perform accurate predictions. When training a machine learning model, machine learning engineers need to target and collect a large and representative
            - link "sample" [ref=e1181] [cursor=pointer]:
              - /url: /wiki/Sample_(statistics)
            - text: of data. Data from the training set can be as varied as a
            - link "corpus of text" [ref=e1182] [cursor=pointer]:
              - /url: /wiki/Corpus_of_text
            - text: ", a collection of images,"
            - link "sensor" [ref=e1183] [cursor=pointer]:
              - /url: /wiki/Sensor
            - text: data, and data collected from individual users of a service.
            - link "Overfitting" [ref=e1184] [cursor=pointer]:
              - /url: /wiki/Overfitting
            - text: is something to watch out for when training a machine learning model. Trained models derived from biased or non-evaluated data can result in skewed or undesired predictions. Biased models may result in detrimental outcomes, thereby furthering the negative impacts on society or objectives.
            - link "Algorithmic bias" [ref=e1185] [cursor=pointer]:
              - /url: /wiki/Algorithmic_bias
            - text: is a potential result of data not being fully prepared for training. Machine learning ethics is becoming a field of study and, notably, becoming integrated within machine learning engineering teams.
          - generic [ref=e1186]:
            - heading "Federated learning" [level=4] [ref=e1187]
            - generic [ref=e1188]:
              - text: "["
              - link "edit" [ref=e1189] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=35
              - text: "]"
          - note [ref=e1190]:
            - text: "Main article:"
            - link "Federated learning" [ref=e1191] [cursor=pointer]:
              - /url: /wiki/Federated_learning
          - paragraph [ref=e1192]:
            - text: Federated learning is an adapted form of
            - link "distributed artificial intelligence" [ref=e1193] [cursor=pointer]:
              - /url: /wiki/Distributed_artificial_intelligence
            - text: to train machine learning models that decentralises the training process, allowing for users' privacy to be maintained by not needing to send their data to a centralised server. This also increases efficiency by decentralising the training process to many devices. For example,
            - link "Gboard" [ref=e1194] [cursor=pointer]:
              - /url: /wiki/Gboard
            - text: uses federated machine learning to train search query prediction models on users' mobile phones without having to send individual searches back to
            - link "Google" [ref=e1195] [cursor=pointer]:
              - /url: /wiki/Google
            - text: .
            - superscript [ref=e1196]:
              - link "[101]" [ref=e1197] [cursor=pointer]:
                - /url: "#cite_note-101"
          - generic [ref=e1198]:
            - heading "Applications" [level=2] [ref=e1199]
            - generic [ref=e1200]:
              - text: "["
              - link "edit" [ref=e1201] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=36
              - text: "]"
          - paragraph [ref=e1202]: "There are many applications for machine learning, including:"
          - list [ref=e1204]:
            - listitem [ref=e1205]:
              - link "Agriculture" [ref=e1206] [cursor=pointer]:
                - /url: /wiki/Precision_agriculture
            - listitem [ref=e1207]:
              - link "Anatomy" [ref=e1208] [cursor=pointer]:
                - /url: /wiki/Computational_anatomy
            - listitem [ref=e1209]:
              - link "Adaptive website" [ref=e1210] [cursor=pointer]:
                - /url: /wiki/Adaptive_website
            - listitem [ref=e1211]:
              - link "Affective computing" [ref=e1212] [cursor=pointer]:
                - /url: /wiki/Affective_computing
            - listitem [ref=e1213]:
              - link "Astronomy" [ref=e1214] [cursor=pointer]:
                - /url: /wiki/Astroinformatics
            - listitem [ref=e1215]:
              - link "Automated decision-making" [ref=e1216] [cursor=pointer]:
                - /url: /wiki/Automated_decision-making
            - listitem [ref=e1217]:
              - link "Banking" [ref=e1218] [cursor=pointer]:
                - /url: /wiki/Banking
            - listitem [ref=e1219]:
              - link "Behaviorism" [ref=e1220] [cursor=pointer]:
                - /url: /wiki/Behaviorism
            - listitem [ref=e1221]:
              - link "Bioinformatics" [ref=e1222] [cursor=pointer]:
                - /url: /wiki/Bioinformatics
            - listitem [ref=e1223]:
              - link "Brain–machine interfaces" [ref=e1224] [cursor=pointer]:
                - /url: /wiki/Brain%E2%80%93computer_interface
            - listitem [ref=e1225]:
              - link "Cheminformatics" [ref=e1226] [cursor=pointer]:
                - /url: /wiki/Cheminformatics
            - listitem [ref=e1227]:
              - link "Citizen Science" [ref=e1228] [cursor=pointer]:
                - /url: /wiki/Citizen_Science
            - listitem [ref=e1229]:
              - link "Climate Science" [ref=e1230] [cursor=pointer]:
                - /url: /wiki/Climate_Science
            - listitem [ref=e1231]:
              - link "Computer networks" [ref=e1232] [cursor=pointer]:
                - /url: /wiki/Network_simulation
            - listitem [ref=e1233]:
              - link "Computer vision" [ref=e1234] [cursor=pointer]:
                - /url: /wiki/Computer_vision
            - listitem [ref=e1235]:
              - link "Credit-card fraud" [ref=e1236] [cursor=pointer]:
                - /url: /wiki/Credit-card_fraud
              - text: detection
            - listitem [ref=e1237]:
              - link "Data quality" [ref=e1238] [cursor=pointer]:
                - /url: /wiki/Data_quality
            - listitem [ref=e1239]:
              - link "DNA sequence" [ref=e1240] [cursor=pointer]:
                - /url: /wiki/DNA_sequence
              - text: classification
            - listitem [ref=e1241]:
              - link "Economics" [ref=e1242] [cursor=pointer]:
                - /url: /wiki/Computational_economics
            - listitem [ref=e1243]:
              - link "Financial data analysis" [ref=e1244] [cursor=pointer]:
