            - text: Settling on a bad, overly complex theory
            - link "gerrymandered" [ref=e1424] [cursor=pointer]:
              - /url: /wiki/Gerrymandering
            - text: to fit all the past training data is known as overfitting. Many systems attempt to reduce overfitting by rewarding a theory in accordance with how well it fits the data but penalising the theory in accordance with how complex the theory is.
