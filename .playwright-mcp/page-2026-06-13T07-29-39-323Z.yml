                - text: This term draws a loose analogy with human psychology, where a
                - link "hallucination" [ref=e1512] [cursor=pointer]:
                  - /url: /wiki/Hallucination
                - text: typically involves false
                - link "percepts" [ref=e1514] [cursor=pointer]:
                  - /url: /wiki/Percept#Process_and_terminology
                - text: .
              - paragraph [ref=e1515]:
                - text: For example, a
                - link "chatbot" [ref=e1516] [cursor=pointer]:
                  - /url: /wiki/Chatbot
                - text: powered by
                - link "large language models" [ref=e1517] [cursor=pointer]:
                  - /url: /wiki/Large_language_model
                - text: (LLMs), like
                - link "ChatGPT" [ref=e1518] [cursor=pointer]:
                  - /url: /wiki/ChatGPT
                - text: ", may embed plausible-sounding random falsehoods within its generated content. Detecting and mitigating errors and hallucinations pose significant challenges for practical deployment and reliability of LLMs in high-stakes scenarios, such as chip design, supply chain logistics, and medical diagnostics."
                - superscript [ref=e1519]:
                  - link "[149]" [ref=e1520] [cursor=pointer]:
                    - /url: "#cite_note-Hallucination_(artificial_intelligence)_nyt-149"
                - superscript [ref=e1521]:
                  - link "[150]" [ref=e1522] [cursor=pointer]:
                    - /url: "#cite_note-Hallucination_(artificial_intelligence)_de_Wynter-2023-150"
                - superscript [ref=e1523]:
                  - link "[151]" [ref=e1524] [cursor=pointer]:
                    - /url: "#cite_note-Hallucination_(artificial_intelligence)_cnbc_several_errors-151"
                - text: Some software engineers and statisticians have criticized the specific term "AI hallucination" for unreasonably
                - link "anthropomorphizing computers" [ref=e1525] [cursor=pointer]:
                  - /url: /wiki/Anthropomorphism#In_computing
                - text: .
                - superscript [ref=e1526]:
                  - link "[152]" [ref=e1527] [cursor=pointer]:
                    - /url: "#cite_note-Hallucination_(artificial_intelligence)_sigplan-152"
                - superscript [ref=e1528]:
                  - link "[153]" [ref=e1529] [cursor=pointer]:
                    - /url: "#cite_note-Hallucination_(artificial_intelligence)_salon-153"
              - paragraph [ref=e1530]:
                - link "Symbolic artificial intelligence" [ref=e1531] [cursor=pointer]:
                  - /url: /wiki/Symbolic_artificial_intelligence
                - text: models generally do not produce hallucinations, unlike large language models.
                - superscript [ref=e1532]:
                  - link "[154]" [ref=e1533] [cursor=pointer]:
                    - /url: "#cite_note-Hallucination_(artificial_intelligence)_Garcez-154"
          - generic [ref=e1534]:
            - heading "Other limitations and vulnerabilities" [level=3] [ref=e1535]
            - generic [ref=e1536]:
              - text: "["
              - link "edit" [ref=e1537] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=42
              - text: "]"
          - paragraph [ref=e1538]:
            - text: Learners can also be disappointed by "learning the wrong lesson". A toy example is that an image classifier trained only on pictures of brown horses and black cats might conclude that all brown patches are likely to be horses.
            - superscript [ref=e1539]:
              - link "[155]" [ref=e1540] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEDomingos2015286-155"
            - text: A real-world example is that, unlike humans, current image classifiers often do not primarily make judgments from the spatial relationship between components of the picture, and they learn relationships between pixels that humans are oblivious to, but that still correlate with images of certain types of real objects. Modifying these patterns on a legitimate image can result in "adversarial" images that the system misclassifies.
            - superscript [ref=e1541]:
              - link "[156]" [ref=e1542] [cursor=pointer]:
                - /url: "#cite_note-156"
            - superscript [ref=e1543]:
              - link "[157]" [ref=e1544] [cursor=pointer]:
                - /url: "#cite_note-157"
          - paragraph [ref=e1545]:
            - text: Adversarial vulnerabilities can also result in nonlinear systems or from non-pattern perturbations. For some systems, it is possible to change the output by only changing a single adversarially chosen pixel.
            - superscript [ref=e1546]:
              - link "[158]" [ref=e1547] [cursor=pointer]:
                - /url: "#cite_note-TD_1-158"
            - text: Machine learning models are often vulnerable to manipulation or evasion via
            - link "adversarial machine learning" [ref=e1548] [cursor=pointer]:
              - /url: /wiki/Adversarial_machine_learning
            - text: .
            - superscript [ref=e1549]:
              - link "[159]" [ref=e1550] [cursor=pointer]:
                - /url: "#cite_note-159"
          - paragraph [ref=e1551]:
            - text: Researchers have demonstrated how
            - link "backdoors" [ref=e1552] [cursor=pointer]:
              - /url: /wiki/Backdoor_(computing)
            - text: can be placed undetectably into classifying (e.g., for categories "spam" and "not spam" of posts) machine learning models that are often developed or trained by third parties. Parties can change the classification of any input, including in cases for which a type of
            - link "data/software transparency" [ref=e1553] [cursor=pointer]:
              - /url: /wiki/Algorithmic_transparency
            - text: is provided, possibly including
            - link "white-box access" [ref=e1554] [cursor=pointer]:
              - /url: /wiki/White-box_testing
            - text: .
            - superscript [ref=e1555]:
              - link "[160]" [ref=e1556] [cursor=pointer]:
                - /url: "#cite_note-160"
            - superscript [ref=e1557]:
              - link "[161]" [ref=e1558] [cursor=pointer]:
                - /url: "#cite_note-161"
            - superscript [ref=e1559]:
              - link "[162]" [ref=e1560] [cursor=pointer]:
                - /url: "#cite_note-162"
          - generic [ref=e1561]:
            - heading "Model assessments" [level=2] [ref=e1562]
            - generic [ref=e1563]:
              - text: "["
              - link "edit" [ref=e1564] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=43
              - text: "]"
          - paragraph [ref=e1565]:
            - text: Classification of machine learning models can be validated by accuracy estimation techniques like the
            - link "holdout" [ref=e1566] [cursor=pointer]:
              - /url: /wiki/Test_set
            - text: method, which splits the data into a training and test set (conventionally 2/3 training set and 1/3 test set designation) and evaluates the performance of the training model on the test set. In comparison, the K-fold-
            - link "cross-validation" [ref=e1567] [cursor=pointer]:
              - /url: /wiki/Cross-validation_(statistics)
            - text: method randomly partitions the data into K subsets and then K experiments are performed each considering 1 subset for evaluation and the remaining K-1 subsets for training the model. In addition to the holdout and cross-validation methods,
            - link "bootstrap" [ref=e1568] [cursor=pointer]:
              - /url: /wiki/Bootstrapping_(statistics)
            - text: ", which samples n instances with replacement from the dataset, can be used to assess model accuracy."
            - superscript [ref=e1569]:
              - link "[163]" [ref=e1570] [cursor=pointer]:
                - /url: "#cite_note-163"
          - paragraph [ref=e1571]:
            - text: In addition to overall accuracy, investigators frequently report
            - link "sensitivity and specificity" [ref=e1572] [cursor=pointer]:
              - /url: /wiki/Sensitivity_and_specificity
            - text: ", meaning true positive rate (TPR) and true negative rate (TNR), respectively. Similarly, investigators sometimes report the"
            - link "false positive rate" [ref=e1573] [cursor=pointer]:
              - /url: /wiki/False_positive_rate
            - text: (FPR) as well as the
            - link "false negative rate" [ref=e1574] [cursor=pointer]:
              - /url: /wiki/False_negative_rate
            - text: (FNR). However, these rates are ratios that fail to reveal their numerators and denominators.
            - link "Receiver operating characteristic" [ref=e1575] [cursor=pointer]:
              - /url: /wiki/Receiver_operating_characteristic
            - text: (ROC), along with the accompanying Area Under the ROC Curve (AUC), offer additional tools for classification model assessment. Higher AUC is associated with a better performing model.
            - superscript [ref=e1576]:
              - link "[164]" [ref=e1577] [cursor=pointer]:
                - /url: "#cite_note-164"
          - generic [ref=e1578]:
            - heading "Ethics" [level=2] [ref=e1579]
            - generic [ref=e1580]:
              - text: "["
              - link "edit" [ref=e1581] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=44
              - text: "]"
          - generic [ref=e1582]:
            - note [ref=e1583]:
              - text: This section is an excerpt from
              - link "Ethics of artificial intelligence" [ref=e1584] [cursor=pointer]:
                - /url: /wiki/Ethics_of_artificial_intelligence
              - text: .
              - generic [ref=e1585]:
                - text: "["
                - link "edit" [ref=e1586] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/w/index.php?title=Ethics_of_artificial_intelligence&action=edit
                - text: "]"
            - generic [ref=e1587]:
              - paragraph [ref=e1588]:
                - text: The
                - link "ethics" [ref=e1589] [cursor=pointer]:
                  - /url: /wiki/Ethics
                - text: of
                - link "artificial intelligence" [ref=e1590] [cursor=pointer]:
                  - /url: /wiki/Artificial_intelligence
                - text: covers a broad range of topics within AI that are considered to have particular ethical stakes.
                - superscript [ref=e1591]:
                  - link "[165]" [ref=e1592] [cursor=pointer]:
                    - /url: "#cite_note-Ethics_of_artificial_intelligence_Muller-2020-165"
                - text: This includes
                - link "algorithmic biases" [ref=e1593] [cursor=pointer]:
                  - /url: /wiki/Algorithmic_bias
                - text: ","
                - link "fairness" [ref=e1594] [cursor=pointer]:
                  - /url: /wiki/Fairness_(machine_learning)
                - text: ","
                - link "accountability" [ref=e1595] [cursor=pointer]:
                  - /url: /wiki/Accountability
                - text: ", transparency, privacy, and"
                - link "regulation" [ref=e1596] [cursor=pointer]:
                  - /url: /wiki/Regulation_of_artificial_intelligence
                - text: ", particularly where systems influence or automate human decision-making. It also covers various emerging or potential future challenges such as"
                - link "machine ethics" [ref=e1597] [cursor=pointer]:
                  - /url: /wiki/Machine_ethics
                - text: (how to make machines that behave ethically),
                - link "lethal autonomous weapon systems" [ref=e1598] [cursor=pointer]:
                  - /url: /wiki/Lethal_autonomous_weapon
                - text: ","
                - link "arms race" [ref=e1599] [cursor=pointer]:
                  - /url: /wiki/Artificial_intelligence_arms_race
                - text: dynamics,
                - link "AI safety" [ref=e1600] [cursor=pointer]:
                  - /url: /wiki/AI_safety
                - text: and
                - link "alignment" [ref=e1601] [cursor=pointer]:
                  - /url: /wiki/AI_alignment
                - text: ","
                - link "technological unemployment" [ref=e1602] [cursor=pointer]:
                  - /url: /wiki/Technological_unemployment
                - text: ", AI-enabled"
                - link "misinformation" [ref=e1603] [cursor=pointer]:
                  - /url: /wiki/Misinformation
                - text: ","
                - superscript [ref=e1604]:
                  - link "[166]" [ref=e1605] [cursor=pointer]:
                    - /url: "#cite_note-Ethics_of_artificial_intelligence_:4-166"
                - text: how to treat certain AI systems if they have a
                - link "moral status" [ref=e1606] [cursor=pointer]:
                  - /url: /wiki/Moral_status
                - text: (AI welfare and rights),
                - link "artificial superintelligence" [ref=e1607] [cursor=pointer]:
                  - /url: /wiki/Artificial_superintelligence
                - text: and
                - link "existential risks" [ref=e1608] [cursor=pointer]:
                  - /url: /wiki/Existential_risk_from_artificial_general_intelligence
                - text: .
                - superscript [ref=e1609]:
                  - link "[165]" [ref=e1610] [cursor=pointer]:
                    - /url: "#cite_note-Ethics_of_artificial_intelligence_Muller-2020-165"
              - paragraph [ref=e1611]:
                - text: Some application areas may also have particularly important ethical implications, like
                - link "healthcare" [ref=e1612] [cursor=pointer]:
                  - /url: /wiki/Artificial_intelligence_in_healthcare
                - text: ", education, criminal justice, or the military."
          - generic [ref=e1613]:
            - heading "Bias" [level=3] [ref=e1614]
            - generic [ref=e1615]:
              - text: "["
              - link "edit" [ref=e1616] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=45
              - text: "]"
          - note [ref=e1617]:
            - text: "Main article:"
            - link "Algorithmic bias" [ref=e1618] [cursor=pointer]:
              - /url: /wiki/Algorithmic_bias
          - paragraph [ref=e1619]:
            - text: Different machine learning approaches can suffer from different data biases. A machine learning system trained specifically on current customers may not be able to predict the needs of new customer groups that are not represented in the training data. When trained on human-made data, machine learning is likely to pick up the constitutional and unconscious biases already present in society.
            - superscript [ref=e1620]:
              - link "[167]" [ref=e1621] [cursor=pointer]:
                - /url: "#cite_note-Garcia-2016-167"
          - paragraph [ref=e1622]:
            - text: Systems that are trained on datasets collected with biases may exhibit these biases upon use (algorithmic bias), thus digitising cultural prejudices.
            - superscript [ref=e1623]:
              - link "[168]" [ref=e1624] [cursor=pointer]:
                - /url: "#cite_note-168"
            - text: For example, in 1988, the UK's
            - link "Commission for Racial Equality" [ref=e1625] [cursor=pointer]:
              - /url: /wiki/Commission_for_Racial_Equality
            - text: found that
            - link "St. George's Medical School" [ref=e1626] [cursor=pointer]:
              - /url: /wiki/St_George%27s,_University_of_London
            - text: had been using a computer program trained from data of previous admissions staff and this program had denied nearly 60 candidates who were found to either be women or have non-European-sounding names.
            - superscript [ref=e1627]:
              - link "[167]" [ref=e1628] [cursor=pointer]:
                - /url: "#cite_note-Garcia-2016-167"
            - text: Using job hiring data from a firm with racist hiring policies may lead to a machine learning system duplicating the bias by scoring job applicants by similarity to previous successful applicants.
            - superscript [ref=e1629]:
              - link "[169]" [ref=e1630] [cursor=pointer]:
                - /url: "#cite_note-Edionwe_Outline-169"
            - superscript [ref=e1631]:
              - link "[170]" [ref=e1632] [cursor=pointer]:
                - /url: "#cite_note-Jeffries_Outline-170"
            - text: Another example includes predictive policing company
            - link "Geolitica" [ref=e1633] [cursor=pointer]:
              - /url: /wiki/Geolitica
            - text: "'s predictive algorithm that resulted in \"disproportionately high levels of over-policing in low-income and minority communities\" after being trained with historical crime data."
            - superscript [ref=e1634]:
              - link "[171]" [ref=e1635] [cursor=pointer]:
                - /url: "#cite_note-Silva-2018-171"
          - paragraph [ref=e1636]:
            - text: While responsible
            - link "collection of data" [ref=e1637] [cursor=pointer]:
              - /url: /wiki/Data_collection
            - text: and documentation of algorithmic rules used by a system is considered a critical part of machine learning, some researchers blame the lack of participation and representation of minority populations in the field of AI for machine learning's vulnerability to biases.
            - superscript [ref=e1638]:
              - link "[172]" [ref=e1639] [cursor=pointer]:
                - /url: "#cite_note-172"
            - text: In fact, according to research carried out by the Computing Research Association in 2021, "female faculty make up just 16.1%" of all faculty members who focus on AI among several universities around the world.
            - superscript [ref=e1640]:
              - link "[173]" [ref=e1641] [cursor=pointer]:
                - /url: "#cite_note-Zhang-173"
            - text: Furthermore, among the group of "new U.S. resident AI PhD graduates," 45% identified as white, 22.4% as Asian, 3.2% as Hispanic, and 2.4% as African American, which further demonstrates a lack of diversity in the field of AI.
            - superscript [ref=e1642]:
              - link "[173]" [ref=e1643] [cursor=pointer]:
                - /url: "#cite_note-Zhang-173"
          - paragraph [ref=e1644]:
            - text: Language models learned from data have been shown to contain human-like biases.
            - superscript [ref=e1645]:
              - link "[174]" [ref=e1646] [cursor=pointer]:
                - /url: "#cite_note-174"
            - superscript [ref=e1647]:
              - link "[175]" [ref=e1648] [cursor=pointer]:
                - /url: "#cite_note-175"
            - text: Because human languages contain biases, machines trained on language
            - link "corpora" [ref=e1650] [cursor=pointer]:
              - /url: /wiki/Text_corpus
            - text: will necessarily also learn these biases.
            - superscript [ref=e1651]:
              - link "[176]" [ref=e1652] [cursor=pointer]:
                - /url: "#cite_note-176"
            - superscript [ref=e1653]:
              - link "[177]" [ref=e1654] [cursor=pointer]:
                - /url: "#cite_note-177"
            - text: In 2016, Microsoft tested
            - link "Tay" [ref=e1655] [cursor=pointer]:
              - /url: /wiki/Tay_(chatbot)
            - text: ", a"
            - link "chatbot" [ref=e1656] [cursor=pointer]:
              - /url: /wiki/Chatbot
            - text: that learned from Twitter, and it quickly picked up racist and sexist language.
            - superscript [ref=e1657]:
              - link "[178]" [ref=e1658] [cursor=pointer]:
                - /url: "#cite_note-178"
          - paragraph [ref=e1659]:
            - text: In an experiment carried out by
            - link "ProPublica" [ref=e1660] [cursor=pointer]:
              - /url: /wiki/ProPublica
            - text: ", an"
            - link "investigative journalism" [ref=e1661] [cursor=pointer]:
              - /url: /wiki/Investigative_journalism
            - text: organisation, a machine learning algorithm's insight into the recidivism rates among prisoners falsely flagged "black defendants high risk twice as often as white defendants".
            - superscript [ref=e1662]:
              - link "[171]" [ref=e1663] [cursor=pointer]:
                - /url: "#cite_note-Silva-2018-171"
            - text: In 2015, Google Photos once tagged a couple of black people as gorillas, which caused controversy. The gorilla label was subsequently removed, and in 2023, it still cannot recognise gorillas.
            - superscript [ref=e1664]:
              - link "[179]" [ref=e1665] [cursor=pointer]:
                - /url: "#cite_note-179"
            - text: Similar issues with recognising non-white people have been found in many other systems.
            - superscript [ref=e1666]:
              - link "[180]" [ref=e1667] [cursor=pointer]:
                - /url: "#cite_note-180"
          - paragraph [ref=e1668]:
            - text: Because of such challenges, the effective use of machine learning may take longer to be adopted in other domains.
            - superscript [ref=e1669]:
              - link "[181]" [ref=e1670] [cursor=pointer]:
                - /url: "#cite_note-181"
            - text: Concern for
            - link "fairness" [ref=e1671] [cursor=pointer]:
              - /url: /wiki/Fairness_(machine_learning)
            - text: in machine learning, that is, reducing bias in machine learning and propelling its use for human good, is increasingly expressed by artificial intelligence scientists, including
            - link "Fei-Fei Li" [ref=e1672] [cursor=pointer]:
              - /url: /wiki/Fei-Fei_Li
            - text: ", who said that \"[t]here's nothing artificial about AI. It's inspired by people, it's created by people, and—most importantly—it impacts people. It is a powerful tool we are only just beginning to understand, and that is a profound responsibility.\""
            - superscript [ref=e1673]:
              - link "[182]" [ref=e1674] [cursor=pointer]:
                - /url: "#cite_note-182"
          - generic [ref=e1675]:
            - heading "Financial incentives" [level=3] [ref=e1676]
            - generic [ref=e1677]:
              - text: "["
              - link "edit" [ref=e1678] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=46
              - text: "]"
          - paragraph [ref=e1679]:
            - text: There are concerns among health care professionals that these systems might not be designed in the public's interest but as income-generating machines. This is especially true in the United States, where there is a long-standing ethical dilemma of improving health care, but also increasing profits. For example, the algorithms could be designed to provide patients with unnecessary tests or medication in which the algorithm's proprietary owners hold stakes. There is potential for machine learning in health care to provide professionals with an additional tool to diagnose, medicate, and plan recovery paths for patients, but this requires these biases to be mitigated.
            - superscript [ref=e1680]:
              - link "[183]" [ref=e1681] [cursor=pointer]:
                - /url: "#cite_note-183"
          - generic [ref=e1682]:
            - heading "Hardware" [level=2] [ref=e1683]
            - generic [ref=e1684]:
              - text: "["
              - link "edit" [ref=e1685] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=47
              - text: "]"
          - paragraph [ref=e1686]:
            - text: Since the 2010s, advances in both machine learning algorithms and computer hardware have led to more efficient methods for training
            - link "deep neural networks" [ref=e1687] [cursor=pointer]:
              - /url: /wiki/Deep_neural_network
            - text: (a particular narrow subdomain of machine learning) that contain many layers of nonlinear hidden units.
            - superscript [ref=e1688]:
              - link "[184]" [ref=e1689] [cursor=pointer]:
                - /url: "#cite_note-184"
            - text: By 2019, graphics processing units (
            - link "GPUs" [ref=e1690] [cursor=pointer]:
              - /url: /wiki/GPU
            - text: ), often with AI-specific enhancements, had displaced CPUs as the dominant method of training large-scale commercial cloud AI.
            - superscript [ref=e1691]:
              - link "[185]" [ref=e1692] [cursor=pointer]:
                - /url: "#cite_note-185"
            - link "OpenAI" [ref=e1693] [cursor=pointer]:
              - /url: /wiki/OpenAI
            - text: estimated the hardware compute used in the largest deep learning projects from
            - link "AlexNet" [ref=e1694] [cursor=pointer]:
              - /url: /wiki/AlexNet
            - text: (2012) to
            - link "AlphaZero" [ref=e1695] [cursor=pointer]:
              - /url: /wiki/AlphaZero
            - text: (2017), and found a 300,000-fold increase in the amount of compute required, with a doubling-time trendline of 3.4 months.
            - superscript [ref=e1696]:
              - link "[186]" [ref=e1697] [cursor=pointer]:
                - /url: "#cite_note-186"
            - superscript [ref=e1698]:
              - link "[187]" [ref=e1699] [cursor=pointer]:
                - /url: "#cite_note-187"
          - generic [ref=e1700]:
            - heading "Tensor Processing Units (TPUs)" [level=3] [ref=e1701]: Tensor Processing Units (TPUs)
            - generic [ref=e1702]:
              - text: "["
              - link "edit" [ref=e1703] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=48
              - text: "]"
          - paragraph [ref=e1704]:
            - link "Tensor Processing Units (TPUs)" [ref=e1705] [cursor=pointer]:
              - /url: /wiki/Tensor_Processing_Unit
            - text: are specialised hardware accelerators developed by
            - link "Google" [ref=e1706] [cursor=pointer]:
              - /url: /wiki/Google
            - text: specifically for machine learning workloads. Unlike general-purpose
            - link "GPUs" [ref=e1707] [cursor=pointer]:
              - /url: /wiki/Graphics_processing_unit
            - text: and
            - link "FPGAs" [ref=e1708] [cursor=pointer]:
              - /url: /wiki/Field-programmable_gate_array
            - text: ", TPUs are optimised for tensor computations, making them particularly efficient for deep learning tasks such as training and inference. They are widely used in Google Cloud AI services and large-scale machine learning models like Google's DeepMind AlphaFold and large language models. TPUs leverage"
            - link "matrix multiplication" [ref=e1709] [cursor=pointer]:
              - /url: /wiki/Computational_complexity_of_matrix_multiplication
            - text: units and high-bandwidth memory to accelerate computations while maintaining energy efficiency.
            - superscript [ref=e1710]:
              - link "[188]" [ref=e1711] [cursor=pointer]:
                - /url: "#cite_note-188"
            - text: Since their introduction in 2016, TPUs have become a key component of AI infrastructure, especially in cloud-based environments.
          - generic [ref=e1712]:
            - heading "Neuromorphic computing" [level=3] [ref=e1713]
            - generic [ref=e1714]:
              - text: "["
              - link "edit" [ref=e1715] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=49
              - text: "]"
          - paragraph [ref=e1716]:
            - link "Neuromorphic computing" [ref=e1717] [cursor=pointer]:
              - /url: /wiki/Neuromorphic_computing
            - text: refers to a class of computing systems designed to emulate the structure and functionality of biological neural networks. These systems may be implemented through software-based simulations on conventional hardware or through specialised hardware architectures.
            - superscript [ref=e1718]:
              - link "[189]" [ref=e1719] [cursor=pointer]:
                - /url: "#cite_note-189"
          - generic [ref=e1720]:
            - heading "Physical neural networks" [level=4] [ref=e1721]
            - generic [ref=e1722]:
              - text: "["
              - link "edit" [ref=e1723] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=50
              - text: "]"
          - paragraph [ref=e1724]:
            - text: A
            - link "physical neural network" [ref=e1725] [cursor=pointer]:
              - /url: /wiki/Physical_neural_network
            - text: is a specific type of neuromorphic hardware that relies on electrically adjustable materials, such as memristors, to emulate the function of
            - link "neural synapses" [ref=e1726] [cursor=pointer]:
              - /url: /wiki/Chemical_synapse
            - text: . The term "physical neural network" highlights the use of physical hardware for computation, as opposed to software-based implementations. It broadly refers to artificial neural networks that use materials with adjustable resistance to replicate neural synapses.
            - superscript [ref=e1727]:
              - link "[190]" [ref=e1728] [cursor=pointer]:
                - /url: "#cite_note-190"
            - superscript [ref=e1729]:
              - link "[191]" [ref=e1730] [cursor=pointer]:
                - /url: "#cite_note-191"
          - generic [ref=e1731]:
            - heading "Embedded machine learning" [level=3] [ref=e1732]
            - generic [ref=e1733]:
              - text: "["
              - link "edit" [ref=e1734] [cursor=pointer]:
                - /url: /w/index.php?title=Machine_learning&action=edit&section=51
              - text: "]"
          - paragraph [ref=e1735]:
            - text: Embedded machine learning is a sub-field of machine learning where models are deployed on
            - link "embedded systems" [ref=e1736] [cursor=pointer]:
              - /url: /wiki/Embedded_systems
            - text: with limited computing resources, such as
            - link "wearable computers" [ref=e1737] [cursor=pointer]:
              - /url: /wiki/Wearable_computer
            - text: ","
            - link "edge devices" [ref=e1738] [cursor=pointer]:
              - /url: /wiki/Edge_device
            - text: and
            - link "microcontrollers" [ref=e1739] [cursor=pointer]:
              - /url: /wiki/Microcontrollers
            - text: .
            - superscript [ref=e1740]:
              - link "[192]" [ref=e1741] [cursor=pointer]:
                - /url: "#cite_note-192"
            - superscript [ref=e1742]:
              - link "[193]" [ref=e1743] [cursor=pointer]:
                - /url: "#cite_note-193"
            - superscript [ref=e1744]:
              - link "[194]" [ref=e1745] [cursor=pointer]:
                - /url: "#cite_note-194"
            - superscript [ref=e1746]:
              - link "[195]" [ref=e1747] [cursor=pointer]:
                - /url: "#cite_note-195"
            - text: Running models directly on these devices eliminates the need to transfer and store data on cloud servers for further processing, thereby reducing the risk of data breaches, privacy leaks and theft of intellectual property, personal data and business secrets. Embedded machine learning can be achieved through various techniques, such as
            - link "hardware acceleration" [ref=e1748] [cursor=pointer]:
              - /url: /wiki/Hardware_acceleration
            - text: ","
            - superscript [ref=e1749]:
              - link "[196]" [ref=e1750] [cursor=pointer]:
                - /url: "#cite_note-196"
            - superscript [ref=e1751]:
              - link "[197]" [ref=e1752] [cursor=pointer]:
                - /url: "#cite_note-197"
            - link "approximate computing" [ref=e1753] [cursor=pointer]:
              - /url: /wiki/Approximate_computing
            - text: ","
            - superscript [ref=e1754]:
              - link "[198]" [ref=e1755] [cursor=pointer]:
                - /url: "#cite_note-198"
            - text: and model optimization.
            - superscript [ref=e1756]:
              - link "[199]" [ref=e1757] [cursor=pointer]:
                - /url: "#cite_note-199"
            - superscript [ref=e1758]:
              - link "[200]" [ref=e1759] [cursor=pointer]:
                - /url: "#cite_note-200"
            - text: Common optimization techniques include
            - link "pruning" [ref=e1760] [cursor=pointer]:
              - /url: /wiki/Pruning_(artificial_neural_network)
            - text: ","
            - link "quantisation" [ref=e1761] [cursor=pointer]:
              - /url: /wiki/Model_compression#Quantization
            - text: ","
            - link "knowledge distillation" [ref=e1762] [cursor=pointer]:
              - /url: /wiki/Knowledge_distillation
            - text: ", low-rank factorisation, network architecture search, and parameter sharing."
