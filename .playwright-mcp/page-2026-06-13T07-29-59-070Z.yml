                - text: "]"
            - paragraph [ref=e317]: 기계 학습과 데이터 마이닝은 종종 같은 방법을 사용하며 상당히 중첩된다. 다만 다음에 따라 대략적으로 구분된다.
            - list [ref=e318]:
              - listitem [ref=e319]:
                - text: 기계 학습은
                - link "훈련 데이터" [ref=e320] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/훈련_데이터
                - text: 를 통해 학습된 알려진 속성을 기반으로
                - link "예측" [ref=e321] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/예측
                - text: 에 초점을 두고 있다.
              - listitem [ref=e322]:
                - link "데이터 마이닝" [ref=e323] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/데이터_마이닝
                - text: 은 데이터의 미처 몰랐던 속성을
                - link "발견" [ref=e324] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/발견
                - text: 하는 것에 집중한다. 이는
                - link "데이터베이스" [ref=e325] [cursor=pointer]:
