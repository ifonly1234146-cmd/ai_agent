              - text: 인지 아닌지를 구분할 수 있도록 훈련할 수 있다.
            - paragraph [ref=e295]:
              - text: 기계 학습의 핵심은 표현(representation)과 일반화(generalization)에 있다. 표현이란 데이터의 평가이며, 일반화란 아직 알 수 없는 데이터에 대한 처리이다. 이는
              - link "전산 학습 이론" [ref=e296] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/전산_학습_이론?action=edit&redlink=1
              - text: 분야이기도 하다. 다양한 기계 학습의 응용이 존재한다.
              - link "문자 인식" [ref=e297] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/광학_문자_인식
              - text: 은 이를 이용한 가장 잘 알려진 사례이다.
          - region "정의" [ref=e298]:
            - generic [ref=e299]:
              - heading "정의" [level=2] [ref=e300]: 정의
              - generic [ref=e301]:
                - text: "["
                - link "편집" [ref=e302] [cursor=pointer]:
                  - /url: /w/index.php?title=%EA%B8%B0%EA%B3%84_%ED%95%99%EC%8A%B5&action=edit&section=1
                - text: "]"
            - paragraph [ref=e303]:
              - text: 1959년,
              - link "아서 사무엘" [ref=e304] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/아서_사무엘?action=edit&redlink=1
              - text: 은 기계 학습을 "기계가 일일이 코드로 명시하지 않은 동작을 데이터로부터 학습하여 실행할 수 있도록 하는 알고리즘을 개발하는 연구 분야"라고 정의하였다.
          - region "일반화" [ref=e305]:
