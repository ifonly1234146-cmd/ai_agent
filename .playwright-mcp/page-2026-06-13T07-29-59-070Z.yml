                - text: 문서를 참고하십시오.
              - paragraph [ref=e391]:
                - text: 인공신경망(artificial neural network, ANN)은 기계학습과
                - link "인지과학" [ref=e392] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/인지과학
                - text: 에서 생물학의 신경망에서 영감을 얻은 통계학적 학습
                - link "알고리즘" [ref=e393] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/알고리즘
                - text: 으로
                - link "시냅스" [ref=e394] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/시냅스
                - text: 의 결합으로
                - link "네트워크" [ref=e395] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/네트워크
                - text: 를 형성한
                - link "인공 뉴런" [ref=e396] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/인공_뉴런
                - text: (노드)이 학습을 통해
                - link "시냅스" [ref=e397] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/시냅스
                - text: 의 결합 세기를 변화시켜, 문제 해결 능력을 가지는 모델 전반을 가리킨다. 인공신경망에는 교사 신호(정답)의 입력에 의해서 문제에 최적화되어 가는
                - link "교사 학습" [ref=e398] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/교사_학습
                - text: 과 교사 신호를 필요로 하지 않는
                - link "비교사 학습" [ref=e399] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/비교사_학습
                - text: 이 있다. 명확한 해답이 있는 경우에는 교사 학습이,
                - link "데이터 클러스터링" [ref=e400] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/데이터_클러스터링
                - text: 에는 비교사 학습이 이용된다. 다른 기계학습과 같이 신경망은 일반적으로 규칙기반 프로그래밍으로 풀기 어려운
                - link "컴퓨터 비전" [ref=e401] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/컴퓨터_비전
                - text: 또는
                - link "음성 인식" [ref=e402] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/음성_인식
                - text: 과 같은 다양한 범위의 문제를 푸는데 이용된다.
