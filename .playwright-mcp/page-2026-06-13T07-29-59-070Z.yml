                - text: "]"
            - paragraph [ref=e310]:
              - text: 기계 학습에서의 일반화는
              - link "훈련" [ref=e311] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/지도_학습
              - text: 이후 새롭게 들어온 데이터를 정확히 처리할 수 있는 능력을 말한다.
          - region "기계 학습과 데이터 마이닝" [ref=e312]:
