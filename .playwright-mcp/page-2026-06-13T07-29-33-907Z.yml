                - text: 와 같은 탄소 집약적인 물질이 생산에 필수적인 역할을 하기 때문에 이산화 탄소 배출을 줄이기 위해서는 대체적인 화학 연구가 필요하다.
                - superscript [ref=e1642]:
                  - link "[261]" [ref=e1643] [cursor=pointer]:
