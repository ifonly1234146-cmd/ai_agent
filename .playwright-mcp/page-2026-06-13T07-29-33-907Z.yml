                  - img [ref=e1657]
                - generic [ref=e1658]:
                  - text: 대부분의 이산화 탄소 배출은 식물의 생장, 토양, 바다 등 탄소 흡수원으로 흡수되었다.(
                  - link "2020년 세계 탄소 수지" [ref=e1659] [cursor=pointer]:
                    - /url: //ko.wikipedia.org/wiki/세계_탄소_프로젝트?action=edit&redlink=1
                  - text: 기준)
              - paragraph [ref=e1660]:
                - text: 천연 탄소 흡수원을 강화하여 자연적으로 발생하는 수준을 넘는 훨씬 많은 이산화 탄소를 격리하게 만들 수 있다.
                - superscript [ref=e1661]:
                  - link "[262]" [ref=e1662] [cursor=pointer]:
                    - /url: "#cite_note-262"
                    - generic [ref=e1663]: "[262]"
                - text: 산림 재조림과
                - link "비림 지역의 수목 심기 활동" [ref=e1664] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/조림_(활동)
                - text: 이 가장 효율 좋고 검증된 이산화 탄소 격리 기술이지만 후자의 경우 농경지를 숲으로 다시 바꾸면서 발생하는 식량 안보에 대한 우려를 재기하는 목소리도 있다.
                - superscript [ref=e1665]:
                  - link "[263]" [ref=e1666] [cursor=pointer]:
