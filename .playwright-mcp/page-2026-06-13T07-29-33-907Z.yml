              - text: 에 따르면 매우 낮은 온실 기체 배출 시나리오에서 21세기 말 지구의 온난화 정도는 1.0 °C에서 1.8 °C에 이를 것이라고 발표했다. 중간 단계 배출 시나리오에서는 2.1 °C에서 3.5 °C로, 매우 많은 배출 시나리오에서는 3.3 °C에서 5.7 °C 더 상승할 것이라고 예측하였다.
