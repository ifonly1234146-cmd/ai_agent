                - text: 기후 모델마다 주어진 온실 기체 입력값에 따라 서로 다른 규모의 온난화를 예측하는 이유도 바로 이 피드백의 불확실성 때문이다.
                - superscript [ref=e744]:
                  - link "[108]" [ref=e745] [cursor=pointer]:
                    - /url: "#cite_note-108"
                    - generic [ref=e746]: "[108]"
              - paragraph [ref=e747]:
                - text: 공기가 온실 기체 때문에 따뜻해져 기온이 상승하면
                - link "더 많은 수분을 함유할 수" [ref=e748] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/습도
                - text: 있다. 수증기는 매우 강력한 온실 기체이므로 대기를 더 많이 가열한다.
                - superscript [ref=e749]:
                  - link "[104]" [ref=e750] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEUSGCRP_Chapter_2201789–91-104"
                    - generic [ref=e751]: "[104]"
                - text: 여기서 구름으로 덮인 땅의 면적이 증가한다면 더 많은 햇빛이 우주로 반사되어 지구가 냉각될 것이다. 만약 구름이 더 높은 높이에 생기고 더 얉아진다면 구름이
                - link "단열재" [ref=e752] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/단열재
                - text: 역할을 하여 지표면에서 반사한 열을 다시 지표면으로 구름이 반사하는 역할을 하여 지구 안에 열이 같히고 지구가 더워질 것이다.
                - superscript [ref=e753]:
                  - link "[109]" [ref=e754] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEWilliamsCeppiKatavouta2020-109"
                    - generic [ref=e755]: "[109]"
                - text: 구름의 영향은 피드백의 불확실성에 있어 가장 큰 요인으로 작용한다.
                - superscript [ref=e756]:
                  - link "[110]" [ref=e757] [cursor=pointer]:
                    - /url: "#cite_note-110"
                    - generic [ref=e758]: "[110]"
              - paragraph [ref=e759]:
                - text: 또 다른 기후계의 주요 피드백으로는 북극의 눈으로 덮인 지역과 해빙의 감소 반응으로 이 둘이 일어나면 지구의 반사율이 감소한다.
                - superscript [ref=e760]:
                  - link "[111]" [ref=e761] [cursor=pointer]:
                    - /url: "#cite_note-111"
                    - generic [ref=e762]: "[111]"
                - text: 더 많은 태양 에너지가 반사율이 낮아진 지역에서 흡수되면서
