              - text: 또 다른 핵심적인 온난화 지표에는 대기 상층부의 한랭화 현상인데, 온실 기체가 지구 표면 근처에 열을 가둬버려 우주로 열이 방사되는 것을 막아 높은 고도에서의 기온이 시간이 지날수록 점차 낮아지고 있다.
