                    - /url: "#cite_note-264"
                    - generic [ref=e1674]: "[264]"
                - text: 해안 습지와 해초 서식지를 복원하거나 재생하여
                - link "유기물을 통한 탄소 흡수" [ref=e1675] [cursor=pointer]:
