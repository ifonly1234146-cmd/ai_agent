                    - generic [ref=e1939]: "[310]"
              - paragraph [ref=e1940]:
                - text: 2015년에는 모든 유엔 국가가 지구 온난화를 2.0 °C 이하로 유지하고 추가적인 온난화 폭을 1.5 °C로 이내로 유지하겠다는 내용을 담은
                - link "파리 협정" [ref=e1941] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/파리_협정_(2015년)
                - text: 에 합의했다.
                - superscript [ref=e1942]:
                  - link "[311]" [ref=e1943] [cursor=pointer]:
