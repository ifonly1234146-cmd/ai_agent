                - text: 를 확보하기 위해 지구 토지를 변화시킨다. 현재 지구 토지 영역의 34%가 농경지이며 26%는 숲, 30%는 사람이 살 수 없는 빙하나 사막 같은 지형이다.
                - superscript [ref=e625]:
                  - link "[90]" [ref=e626] [cursor=pointer]:
                    - /url: "#cite_note-90"
                    - generic [ref=e627]: "[90]"
                - text: 산림의 넓이는 계속 줄어들고 있는데 이 과정에서 일어나는 토지 이용 변화로 지구 온난화가 가속화되고 있다.
                - superscript [ref=e628]:
                  - link "[91]" [ref=e629] [cursor=pointer]:
                    - /url: "#cite_note-91"
                    - generic [ref=e630]: "[91]"
                - link "탈산림화" [ref=e631] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/탈산림화
                - text: 로 나무가 벌채될 때 나무 안에 있던 이산화탄소가 방출되고 그 나무가 미래에 더 많은 이산화탄소를 흡수할 수 있는 기회를 빼앗는다.
                - superscript [ref=e632]:
                  - link "[92]" [ref=e633] [cursor=pointer]:
                    - /url: "#cite_note-92"
                    - generic [ref=e634]: "[92]"
                - text: 산림 벌채가 일어나는 주요 원인으로는
                - link "고기" [ref=e635] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/고기
                - text: 및
                - link "팜유" [ref=e636] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/팜유
                - text: 와 같은 작물 생산을 위한 농지로의 영구 토지 이용 변화가 27%, 임업, 수산업 가공품 생산을 위한 벌목이 26%,
                - link "화전농업" [ref=e637] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/화전농업
                - text: 과 같은 단기간
                - link "이동경작" [ref=e638] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/이동경작?action=edit&redlink=1
                - text: 이 24%, 산불이 23%이다.
                - superscript [ref=e639]:
                  - link "[93]" [ref=e640] [cursor=pointer]:
                    - /url: "#cite_note-93"
                    - generic [ref=e641]: "[93]"
              - paragraph [ref=e642]:
                - text: 토지 이용 변화는 온실 기체 배출에만 영향을 주는 것이 아니다. 그 지역의 식생 유형이 지역의 평균 기온에도 영향을 준다. 즉 식생 유형은 얼마나 많은 햇빛이 다시 우주로 반사되는지(
                - link "반사율" [ref=e643] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/반사율
                - text: ), 얼마나 많은 열이
                - link "증발로 손실되는지" [ref=e644] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/증발식_냉각기
                - text: 에 영향을 미친다. 예를 들어, 어두운
                - link "숲" [ref=e645] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/숲
                - text: 이 초원으로 변하면 표면이 더 밝아져 반사율이 증가해 햇빛이 더 많이 반사된다. 또한 탈산림화는
                - link "구름" [ref=e646] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/구름
                - text: 에 영향을 미치는 화학적인 화합물 방출 조성을 변형하고 바람 패턴을 변화시켜 기온에 영향을 줄 수 있다.
                - superscript [ref=e647]:
                  - link "[94]" [ref=e648] [cursor=pointer]:
                    - /url: "#cite_note-Seymour_2019-94"
                    - generic [ref=e649]: "[94]"
                - text: 열대 지방과 온대 지방에서는 모든 요소를 합친 순효화가 온난화를 가속시키는 반면, 극지방에 가까운 고위도에서는 숲이 눈밭으로 바뀌면 반사율이 증가해 냉각 효과가 발생한다.
                - superscript [ref=e650]:
                  - link "[94]" [ref=e651] [cursor=pointer]:
                    - /url: "#cite_note-Seymour_2019-94"
                    - generic [ref=e652]: "[94]"
                - text: 전 세계적으로 총 영향은 지구 표면 반사율의 증가로 아주 미약한 냉각 효과가 발생한 것으로 추정된다.
                - superscript [ref=e653]:
                  - link "[95]" [ref=e654] [cursor=pointer]:
                    - /url: "#cite_note-IPCC_Special_Report:_Climate_change_and_Land_p2-54-95"
                    - generic [ref=e655]: "[95]"
            - region "태양과 화산 활동" [ref=e656]:
              - generic [ref=e657]:
                - heading "태양과 화산 활동" [level=3] [ref=e658]: 태양과 화산 활동
                - generic [ref=e659]:
                  - text: "["
                  - link "편집" [ref=e660] [cursor=pointer]:
                    - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=7
                  - text: "]"
              - note [ref=e661]:
                - link "태양 활동과 기후" [ref=e664] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/태양_활동과_기후
                - text: 문서를 참고하십시오.
              - paragraph [ref=e665]:
                - text: 물리적 기후 모델에서는
                - link "태양" [ref=e666] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/태양
                - text: 활동과
                - link "화산" [ref=e667] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/화산
                - text: 활동의 변화만으로는 최근 수십년 간 관측된 급격한 온난화를 재연할 수 없다.
                - superscript [ref=e668]:
                  - link "[96]" [ref=e669] [cursor=pointer]:
                    - /url: "#cite_note-96"
                    - generic [ref=e670]: "[96]"
                - text: 태양은 지구에 들어오는 에너지원이기 때문에 지구로 내리쬐는 햇빛의 변화는 기후계에 직접적인 영향을 가져온다.
                - superscript [ref=e671]:
                  - link "[86]" [ref=e672] [cursor=pointer]:
                    - /url: "#cite_note-USGCRP_2017_ch2-86"
                    - generic [ref=e673]: "[86]"
                - link "인공위성" [ref=e674] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/인공위성
                - text: 을 통해
                - link "태양의 복사조도" [ref=e675] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/태양_주기
                - text: 수치를 측정하고 있으며,
                - superscript [ref=e676]:
                  - link "[97]" [ref=e677] [cursor=pointer]:
                    - /url: "#cite_note-97"
                    - generic [ref=e678]: "[97]"
                - text: 간접 관측 기록까지 합치면 1600년도부터 현재까지 태양 활동의 변화를 추적할 수 있다.
                - superscript [ref=e679]:
                  - link "[86]" [ref=e680] [cursor=pointer]:
                    - /url: "#cite_note-USGCRP_2017_ch2-86"
                    - generic [ref=e681]: "[86]"
                - text: 지구로 들어오는 총 태양 에너지는 증가 추세가 없다.
                - superscript [ref=e682]:
                  - link "[98]" [ref=e683] [cursor=pointer]:
                    - /url: "#cite_note-98"
                    - generic [ref=e684]: "[98]"
                - text: 지구 온난화를 일으키는 것이 온실 기체라는 또 다른 강력한 증거로는 대기 하부(
                - link "대류권" [ref=e685] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/대류권
                - text: )는 기온이 점점 증가하지만 대기 상부(
                - link "성층권" [ref=e686] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/성층권
                - text: )는 기온이 점점 하강하고 있다는 관측 결과이다.
                - superscript [ref=e687]:
                  - link "[99]" [ref=e688] [cursor=pointer]:
                    - /url: "#cite_note-99"
                    - generic [ref=e689]: "[99]"
                - text: 만약 태양 활동 때문에 지구 온난화가 발생한 것이라면 대기 상부와 하부 모두 기온이 증가해야 한다.
                - superscript [ref=e690]:
                  - link "[64]" [ref=e691] [cursor=pointer]:
                    - /url: "#cite_note-:1-64"
                    - generic [ref=e692]: "[64]"
              - paragraph [ref=e693]:
                - link "거대한 화산 분화" [ref=e694] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/분화_(화산학)
                - text: 는 산업화 이전까지 가장 거대했던 자연적인 기후 변동 요인이다. 분화가 매우 강해서 대기 성층권에
                - link "이산화 황" [ref=e695] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/이산화_황
                - text: 이 흝뿌려진다면 수 년간 에어로졸이 햇빛을 차단할 수 있다. 온도는 약 두 배 정도 영향을 받는다. 산업화 이후 화산 활동은 지구 기온의 향방에 거의 무시할 수 있을 정도로 영향을 주지 못한다.
                - superscript [ref=e696]:
                  - link "[100]" [ref=e697] [cursor=pointer]:
                    - /url: "#cite_note-100"
                    - generic [ref=e698]: "[100]"
                - text: 현재의
                - link "화산성 이산화 탄소" [ref=e699] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/화산_가스
                - text: 배출량은 인간이 배출하는 이산화 탄소 배출량의 1% 미만이다.
                - superscript [ref=e700]:
                  - link "[101]" [ref=e701] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEFischerAiuppa2020-101"
                    - generic [ref=e702]: "[101]"
            - region "피드백" [ref=e703]:
              - generic [ref=e704]:
                - heading "피드백" [level=3] [ref=e705]: 피드백
                - generic [ref=e706]:
                  - text: "["
                  - link "편집" [ref=e707] [cursor=pointer]:
                    - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=8
                  - text: "]"
              - note [ref=e708]:
                - text: 이 부분의 본문은
                - link "기후 변화 피드백" [ref=e711] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/기후_변화_피드백
                - text: 및
                - link "기후 민감도" [ref=e712] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/기후_민감도
                - text: 입니다.
              - figure "해빙은 내려쬐는 일사량의 50-70%를 다시 반사하는 반면 그보다 어두운 색깔의 바다는 6%만 반사하므로 해빙이 녹는 것은 자기 강화 피드백(양성 피드백)에 속한다. 사진은 녹고 있는 북극의 해빙.[102]" [ref=e713]:
                - link [ref=e714] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/파일:NORTH_POLE_Ice_(19626661335).jpg
                  - img [ref=e715]
