                - text: 은
                - link "선진국" [ref=e1918] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/선진국
                - text: 이 대기 중 온실 기체 축적에 가장 큰 기여를 차지했으므로 선진국이 "주도적으로" 온실 기체 배출량을 줄여야 한다고 주장했다.
