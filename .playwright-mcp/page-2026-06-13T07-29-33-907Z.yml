                    - generic [ref=e1947]: "[312]"
                - text: 파리 협정은 교토 의정서를 대체했다. 교토 의정서와는 달리 파리 협정에는 구속력있는 구체적인 배출량 제한 목표치가 정해지지 않았다. 대신 일련의 제한 절차가 구속력을 가지게 되었다. 각국은 5년마다 정기적으로 더 진보적인 배출량 제한 목표를 세우고 목표 달성 정도를 평가해야 한다.
