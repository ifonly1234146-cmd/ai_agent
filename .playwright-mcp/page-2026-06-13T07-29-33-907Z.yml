                    - generic [ref=e1698]: "[270]"
          - region "기후 변화 적응" [ref=e1699]:
            - generic [ref=e1700]:
              - heading "기후 변화 적응" [level=2] [ref=e1701]: 기후 변화 적응
              - generic [ref=e1702]:
                - text: "["
                - link "편집" [ref=e1703] [cursor=pointer]:
                  - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=22
                - text: "]"
            - note [ref=e1704]:
              - text: 이 부분의 본문은
              - link "기후 변화 적응" [ref=e1707] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후_변화_적응
              - text: 입니다.
            - paragraph [ref=e1708]:
              - text: "\"기후 변화 적응\"이란 기후 변화가 현재, 미래에 줄 영향과 그 변화에 적응하는 과정을 뜻한다."
              - superscript [ref=e1709]:
                - link "[271]" [ref=e1710] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEIPCC_SR15_Ch42018396–397-271"
                  - generic [ref=e1711]: "[271]"
              - text: 하지만 추가적인 완화 없는 단순한 적응 시도는 "심각하고 광범위하며 돌이킬 수 없는" 영향의 위협을 피할 수 없다.
              - superscript [ref=e1712]:
                - link "[272]" [ref=e1713] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEIPCC_AR5_SYR201417-272"
                  - generic [ref=e1714]: "[272]"
              - text: 더욱 심각해지는 기후 변화는 더 격심한 변화와 적응을 필요로 하는데 이를 위해 필요한 비용이 매우 비쌀 수 있다.
              - superscript [ref=e1715]:
                - link "[271]" [ref=e1716] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEIPCC_SR15_Ch42018396–397-271"
                  - generic [ref=e1717]: "[271]"
              - link "인간이 가진 적응 능력과 잠재력" [ref=e1718] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/적응_능력?action=edit&redlink=1
              - text: 은 지역과 사람에 따라 매우 다르며 개발도상국의 경우 평균적인 적응 능력이 매우 낮다.
              - superscript [ref=e1719]:
                - link "[273]" [ref=e1720] [cursor=pointer]:
                  - /url: "#cite_note-273"
                  - generic [ref=e1721]: "[273]"
              - text: 21세기 첫 20년의 경우 기본적인
              - link "위생시설" [ref=e1722] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/위생시설
              - text: 과 전기 접근성이 향상되어 대부분의 저소득, 중소득 국가의 적응 능력이 급격하게 높아졌지만 발전 과정이 아직 더디다. 대부분의 국가가 적응 정책을 실시하고 있다. 하지만 이를 위해 필요한 비용과 실제 가용 비용에는 큰 차이가 있다.
              - superscript [ref=e1723]:
                - link "[274]" [ref=e1724] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEUNEP2018xii–xiii-274"
                  - generic [ref=e1725]: "[274]"
            - paragraph [ref=e1726]:
              - text: 해수면 상승에 대한 적응으로는 위험 지역을 피하고 점점 증가하는 홍수와 함께 사는 법을 익히는 방안으로 구성된다. 만약 이런 조치도 실패한다면 물에 가라앉는 지역을 포기하는
              - link "관리된 후퇴" [ref=e1727] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/관리된_후퇴?action=edit&redlink=1
              - text: 정책도 필요하다.
              - superscript [ref=e1728]:
                - link "[275]" [ref=e1729] [cursor=pointer]:
                  - /url: "#cite_note-275"
                  - generic [ref=e1730]: "[275]"
              - text: 위험한 수준의 더위를 다루기 위해서는 큰 경제적 장벽이 존재한다. 여름철에 육체 노동을 피하거나
              - link "에어컨" [ref=e1731] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/공기조화
              - text: 을 설치하는 일이 모든 사람에게 가능한 것은 아니다.
              - superscript [ref=e1732]:
                - link "[276]" [ref=e1733] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEMatthews2018402-276"
                  - generic [ref=e1734]: "[276]"
              - text: 농업에서는 지속 가능한 식단으로 전환하고 작물을 다양화하고 침식을 통제하며 변화하는 기후에 대한 내성을 높이기 위해 농작물의 유전자를 개선하는 방안 등이 존재한다.
              - superscript [ref=e1735]:
                - link "[277]" [ref=e1736] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEIPCC_SRCCL_Ch52019439-277"
                  - generic [ref=e1737]: "[277]"
              - link "보험" [ref=e1738] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/보험
              - text: 은 기후 변화가 가져올 위험을
              - link "헷징" [ref=e1739] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/헷징
              - text: 할 수 있지만 저소득층에게는 접근하기 매우 어렵다.
              - superscript [ref=e1740]:
                - link "[278]" [ref=e1741] [cursor=pointer]:
                  - /url: "#cite_note-278"
                  - generic [ref=e1742]: "[278]"
              - text: 교육, 이민,
              - link "조기경보체계" [ref=e1743] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/조기경보체계
              - text: 도입은 기후 취약성을 줄일 수 있다.
              - superscript [ref=e1744]:
                - link "[279]" [ref=e1745] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEIPCC_SR15_Ch42018336–337-279"
                  - generic [ref=e1746]: "[279]"
            - paragraph [ref=e1747]:
              - link "생태계가 기후 변화에 적응하는 과정" [ref=e1748] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후_변화가_생태계에_미치는_영향?action=edit&redlink=1
              - text: 은 인간의 개입으로 도움을 받을 수 있다. 생태계 간의 연결성을 높여 생물 종들이 더 유리한 기후 조건으로 쉽게 이주할 수 있다. 특정 종들을
              - link "기후가 서식에 좋은 지역으로 이주" [ref=e1749] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/보조_이주?action=edit&redlink=1
              - text: 시킬 수 있다. 자연과 반자연 지대를 보호하고 복원하면 회복력을 기르는데 도움을 줘 생태계의 적응을 더 쉽게 만들어준다. 생태계의 적응을 촉진하는 개입은
              - link "생태계 기반 적응" [ref=e1750] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/생태계_기반_적응?action=edit&redlink=1
              - text: 을 통해 인간의 기후 변화 적응에도 큰 도움을 준다. 예를 들어 자연적인
              - link "화재 복구" [ref=e1751] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/화재_복구?action=edit&redlink=1
              - text: 는 재앙적인 화재의 가능성도 줄이고 인간의 노출도도 감소시킬 수 있다.하천에 더 많은 여유 공간이 생기면 자연계에 더 많은 물을 저장할 수 있어 홍수 위험을 줄일 수 있다. 복원된 숲은 탄소 흡수원의 역할을 할 수 있지만 부적합한 곳에 나무를 심으면 기후 변화의 영향을 더 악화시킬 수 있다.
              - superscript [ref=e1752]:
                - link "[280]" [ref=e1753] [cursor=pointer]:
                  - /url: "#cite_note-280"
                  - generic [ref=e1754]: "[280]"
            - paragraph [ref=e1755]:
              - text: 기후 변화의 적응과 완화 사이에는
              - link "시너지" [ref=e1756] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/협력작용
              - text: 와
              - link "트레이드오프" [ref=e1757] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/트레이드오프
              - text: 가 존재한다. 적응은 단기적인 이익을 주로 제공하는 반면 완화는 장기적인 이익을 가져다준다.
              - superscript [ref=e1758]:
                - link "[281]" [ref=e1759] [cursor=pointer]:
                  - /url: "#cite_note-281"
                  - generic [ref=e1760]: "[281]"
