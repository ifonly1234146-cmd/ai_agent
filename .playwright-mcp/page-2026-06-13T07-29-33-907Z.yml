                  - /url: "#cite_note-124"
                  - generic [ref=e827]: "[124]"
              - text: 기후 모델은 미래의 기온을 추정하는 것 외에도 바다의 대순환, 계절의 연간 주기, 육지 표면과 대기 사이 탄소의 흐름을 재연하고 예측한다.
              - superscript [ref=e828]:
                - link "[125]" [ref=e829] [cursor=pointer]:
                  - /url: "#cite_note-125"
                  - generic [ref=e830]: "[125]"
            - paragraph [ref=e831]:
              - text: 기후 모델의 물리적인 현실성은 현 시기와 과거의 기후를 시뮬레이션 하여 실제와 비교하는 과정으로 확인할 수 있다.
              - superscript [ref=e832]:
