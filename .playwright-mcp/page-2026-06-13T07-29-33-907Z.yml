              - text: 같은 역사적인 온난화 및 한랭화는 전 세계 다른 지역에서 동시다발적으로 발생하진 않았다. 특정한 한정된 지역에서는 기온이 잠깐 20세기 후반 수준으로 상승했을 수도 있었다.
              - superscript [ref=e347]:
                - link "[42]" [ref=e348] [cursor=pointer]:
