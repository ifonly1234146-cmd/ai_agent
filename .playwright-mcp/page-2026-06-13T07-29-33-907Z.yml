                  - link "[305]" [ref=e1920] [cursor=pointer]:
                    - /url: "#cite_note-305"
                    - generic [ref=e1921]: "[305]"
                - text: 당시 1인당 온실 기체 배출량은 개발도상국에서 상대적으로 매우 낮았고 개발도상국이 자국 내 개발 요구를 맞추기 위해서는 더 많은 온실 기체를 배출해야 했다.
