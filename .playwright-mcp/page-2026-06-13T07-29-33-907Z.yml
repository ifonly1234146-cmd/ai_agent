              - text: 는 단순한 물리적 기후 모델에 인문사회적 요소를 더하기도 한다. 이런 모델에서는 인구 변화,
              - link "경제성장" [ref=e851] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/경제성장
              - text: ", 인간의 에너지 사용이 물리적인 기후계에 미치는 영향과 서로 상호작용하는 방식도 시뮬레이션한다. 이 정보를 통해 미래의 온실 기체 배출에 관한 시나리오를 만들 수 있다. 이런 인문사회적 기후 모델 시나리오는 미래에 대기 중 온실 기체 농도가 어떻게 변할지 예측하는 데 물리적 기후 모델과 탄소 순환 모델의 입력값으로 사용된다."
