                  - link "[304]" [ref=e1914] [cursor=pointer]:
                    - /url: "#cite_note-304"
                    - generic [ref=e1915]: "[304]"
                - text: 협상 기간
                - link "개발도상국" [ref=e1916] [cursor=pointer]:
