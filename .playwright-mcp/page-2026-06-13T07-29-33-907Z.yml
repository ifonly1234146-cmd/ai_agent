                  - /url: "#cite_note-123"
                  - generic [ref=e824]: "[123]"
              - text: 또한 기후 모델에서는 지구 공전, 자전 궤도의 변화, 역사적인 태양 활동의 변화, 화산 활동과 같은 여러 자연 현상을 고려해 계산한다.
