                  - row "흰색으로 표백된 가지들이 널린 산호초의 수중 사진. 생태학적 붕괴. 그레이트배리어리프의 산호가 백화 현상으로 손상되었고 전 세계적으로 산호에 위협을 주고 있다.[173] 계곡 거주자가 촬영한 저녁의 산 사진. 멀리 너머 언덕이 산불로 인해 전부 붉게 보인다. 기상이변. 가뭄과 고온이 2019~2020년 오스트레일리아 밀림 산불을 심각하게 악화시켰다.[174] 초록색 벌판 중간에 땅이 꺼지고 거대한 흙탕물 구덩이가 드러난 모습. 북극의 기후 변화. 영구동토의 해빙은 기반시설을 파괴하고 온실 기체인 메테인을 방출한다.[113] 수척해진 북극곰이 녹아내린 빙상의 잔해 위에 서 있다. 서식지 파괴. 수많은 북극 동물들은 점점 따듯해지면서 사라지고 있는 해빙에 의존하고 있다.[175] 숲을 촬영한 사진. 녹색의 나무들 사이에 손상되거나 죽은 나무들이 보라색, 빨강, 밝은 빨강 등으로 구멍이 뚫려 있다. 해충의 전파. 겨울이 온화해지면서 더 많은 소나무좀벌레들이 살아남아 숲을 말려죽인다.[176]" [ref=e1077]:
