                    - generic [ref=e781]: "[116]"
                - text: 육지에서는 이산화 탄소 농도의 증가와 생장기의 확대가 식물의 성장을 자극했다. 하지만 기후 변화는 식물의 성장을 방해하는
                - link "가뭄" [ref=e782] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/가뭄
                - text: 과
                - link "폭염" [ref=e783] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/폭염
                - text: 을 강화하기 때문에 식물의 탄소 흡수구가 계속 증폭될지는 미지수이다.
                - superscript [ref=e784]:
                  - link "[117]" [ref=e785] [cursor=pointer]:
                    - /url: "#cite_note-117"
                    - generic [ref=e786]: "[117]"
                - text: 토양도 많은 양의 탄소를 함유하고 있으며 가열되면
                - link "일부 탄소가 방출" [ref=e787] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/토양_탄소_피드백?action=edit&redlink=1
                - text: 될 수 있다.
                - superscript [ref=e788]:
                  - link "[118]" [ref=e789] [cursor=pointer]:
                    - /url: "#cite_note-118"
                    - generic [ref=e790]: "[118]"
                - text: 더 많은 이산화탄소와 열이 바다에 흡수되면 바다가 산성화되어 해양 순환이 변하고
                - link "식물성 플랑크톤" [ref=e791] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/식물성_플랑크톤
                - text: 이 더 적은 탄소를 흡수해 바다가 대기 중의 탄소를 흡수하는 속도가 느려진다.
