                    - generic [ref=e1929]: "[307]"
                - text: 코펜하겐 협정의 당사국들은 지구의 추가 온도 상승을 2 °C 이내로 제한하기로 합의했다.
                - superscript [ref=e1930]:
                  - link "[308]" [ref=e1931] [cursor=pointer]:
                    - /url: "#cite_note-308"
                    - generic [ref=e1932]: "[308]"
                - text: 또한 협정에서는 2020년까지 기후 변화의 완화와 적응을 위해 개발도상국에게 매년 1천억 달러를 원조를 목표로 하는
                - link "녹색기후기금" [ref=e1933] [cursor=pointer]:
