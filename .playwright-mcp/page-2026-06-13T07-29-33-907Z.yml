              - text: 같은 전지구적 온난화 현상이 있었긴 했다.
              - superscript [ref=e351]:
                - link "[43]" [ref=e352] [cursor=pointer]:
                  - /url: "#cite_note-AR5_WG1_Ch_5-43"
                  - generic [ref=e353]: "[43]"
              - text: 하지만 현대에 관측되고 있는 기온 상승과 이산화탄소 농도의 상승은 매우 빠르며 지구 역사상 일어났었던 그 어떤 지구물리학적
              - link "기후 급변" [ref=e354] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후_급변?action=edit&redlink=1
              - text: 사건보다도 그 속도가 빠르다.
