                    - /url: "#cite_note-115"
                    - generic [ref=e777]: "[115]"
              - paragraph [ref=e778]:
                - text: 인간이 배출한 총 이산화 탄소의 약 절반은 육지의 식물과 바다가 흡수했다.
                - superscript [ref=e779]:
