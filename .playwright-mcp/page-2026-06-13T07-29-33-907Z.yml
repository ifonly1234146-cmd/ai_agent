              - link "해양 산성화" [ref=e192] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/해양_산성화
              - text: 및 온난화 등이 있다.
              - superscript [ref=e193]:
                - link "[12]" [ref=e194] [cursor=pointer]:
                  - /url: "#cite_note-12"
                  - generic [ref=e195]: "[12]"
            - paragraph [ref=e196]:
              - text: 기후 변화가 주는 다양한 영향은 현재 수준의 기온 상승인 약 1.5 °C 상승 시점에서도 이미 나타나고 있다.
              - link "기후 변화에 관한 정부간 협의체" [ref=e197] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후_변화에_관한_정부간_협의체
              - text: (IPCC)는 온난화로 1.5 °C 이상 상승할 경우 지구에 돌이킬 수 없는 더 큰 영향을 미칠 것이라 경고하고 있다.
              - superscript [ref=e198]:
                - link "[13]" [ref=e199] [cursor=pointer]:
                  - /url: "#cite_note-SR15-13"
                  - generic [ref=e200]: "[13]"
              - text: 온난화가 계속될 경우
              - link "그린란드 빙상" [ref=e201] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/그린란드_빙상
              - text: 의 융해처럼
              - link "티핑 포인트" [ref=e202] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후계의_티핑_포인트?action=edit&redlink=1
              - text: (tipping points)에 닿을 상황에 처할 위기로 몰아넣는다.
              - superscript [ref=e203]:
                - link "[14]" [ref=e204] [cursor=pointer]:
                  - /url: "#cite_note-14"
                  - generic [ref=e205]: "[14]"
              - text: 이런 변화에 대응하는 방법으로는
              - link "온난화 수준을 제한시키는 행동" [ref=e206] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후_변화_완화
              - text: 을 취하거나,
              - link "이런 변화에 적응하는 방법" [ref=e207] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후_변화_적응
              - text: 이 있다.
              - superscript [ref=e208]:
                - link "[15]" [ref=e209] [cursor=pointer]:
                  - /url: "#cite_note-auto-15"
                  - generic [ref=e210]: "[15]"
              - text: 앞으로 지속될 온난화는 온실 기체 배출량을 줄이고 대기의 온실 기체를 제거해서 증가 수준을 줄일 수 있다.
              - superscript [ref=e211]:
                - link "[15]" [ref=e212] [cursor=pointer]:
                  - /url: "#cite_note-auto-15"
                  - generic [ref=e213]: "[15]"
              - text: 온실 기체 배출량을 줄이는 데에는 풍력이나 태양 에너지 등
              - link "지속 가능 에너지" [ref=e214] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/지속_가능_에너지
              - text: 의 사용을 늘리고
              - link "석탄" [ref=e215] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/석탄
              - text: 사용량을 점차 줄이며, 사용하는 에너지의
              - link "효율성을 높여 절약" [ref=e216] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/에너지_절약
              - text: 하는 방법이 있다.
              - superscript [ref=e217]:
                - link "[16]" [ref=e218] [cursor=pointer]:
                  - /url: "#cite_note-16"
                  - generic [ref=e219]: "[16]"
              - text: 기존의 화석 연료로 작동하는 탈것을
              - link "전기 차량" [ref=e220] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/전기차량
              - text: 으로 대체하고 가정과 건물에
              - link "열펌프" [ref=e221] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/열펌프
              - text: 를 사용하면 배출량이 더욱 감소할 것이다.
              - superscript [ref=e222]:
                - link "[17]" [ref=e223] [cursor=pointer]:
                  - /url: "#cite_note-17"
                  - generic [ref=e224]: "[17]"
              - link "산림 벌채를 막고" [ref=e225] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/산림_보호
              - text: 숲을 늘리면 대기 중의 이산화탄소를 흡수하는 데 도움을 줄 수 있다.
              - superscript [ref=e226]:
                - link "[18]" [ref=e227] [cursor=pointer]:
                  - /url: "#cite_note-18"
                  - generic [ref=e228]: "[18]"
              - text: 지역 사회는
              - link "해안선 관리" [ref=e229] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/해안선_관리
              - text: 와
              - link "재난 상황 관리" [ref=e230] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/비상_관리
              - text: 책을 강화하고 기후 변화에 저항력이 더 높은 작물을 개발하는 등의 방법으로 기후 변화에 적응할 수 있다. 하지만 이런 적응책만으로는 심각하고 광범위하며 영구적인 기후 변화의 위협으로 나타날 피해를 피할 수 없다.
              - superscript [ref=e231]:
                - link "[19]" [ref=e232] [cursor=pointer]:
                  - /url: "#cite_note-19"
                  - generic [ref=e233]: "[19]"
            - paragraph [ref=e234]:
              - text: 2015년 채택된
              - link "파리 협정" [ref=e235] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/파리_협정_(2015년)
              - text: 으로 전세계 각국은 기후 변화 완화를 노력하여 "최대 2 °C 상승" 이하를 유지하기로 합의하였다. 하지만 협정을 완전히 준수하더라도 21세기 말까지 지구 평균 기온은 약 2.7 °C 상승할 것이다.
              - superscript [ref=e236]:
                - link "[20]" [ref=e237] [cursor=pointer]:
                  - /url: "#cite_note-UNEP2021-20"
                  - generic [ref=e238]: "[20]"
              - text: 온난화 수준을 1.5 °C 이하로 제한하기 위해서는 2030년까지 온실 기체 배출량을 절반으로 줄여야 하고, 2050년까지 온실 기체 순배출량을 0(net-zero)으로 만들어야 한다.
              - superscript [ref=e239]:
                - link "[21]" [ref=e240] [cursor=pointer]:
                  - /url: "#cite_note-21"
                  - generic [ref=e241]: "[21]"
              - text: 관측 사상 가장 더운 해로 기록된 2024년의 경우 1850년 대비 1.55 °C가 상승했다.
              - superscript [ref=e242]:
                - link "[22]" [ref=e243] [cursor=pointer]:
                  - /url: "#cite_note-22"
                  - generic [ref=e244]: "[22]"
          - region "용어" [ref=e245]:
            - generic [ref=e246]:
              - heading "용어" [level=2] [ref=e247]: 용어
              - generic [ref=e248]:
                - text: "["
                - link "편집" [ref=e249] [cursor=pointer]:
                  - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=1
                - text: "]"
            - figure "기후 변화는 대기 중에 있는 온실 기체 농도가 상승하며 가속된다. 온실 기체는 지구의 기후계에 열을 가둬버리는 온실 효과를 강화시킨다.[23]" [ref=e250]:
              - link [ref=e251] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/파일:Greenhouse_Effect_ko.png
                - img [ref=e252]
              - generic [ref=e253]:
                - text: 기후 변화는 대기 중에 있는 온실 기체 농도가 상승하며 가속된다. 온실 기체는 지구의 기후계에
                - link "열을 가둬버리는 온실 효과" [ref=e254] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/온실_효과
                - text: 를 강화시킨다.
                - superscript [ref=e255]:
                  - link "[23]" [ref=e256] [cursor=pointer]:
                    - /url: "#cite_note-23"
                    - generic [ref=e257]: "[23]"
            - paragraph [ref=e258]:
              - text: 1980년대 이전까지는 온실 기체의 증가로 인한 온난화가
              - link "에어로졸" [ref=e259] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/에어로졸
              - text: 로 인한 냉각 효과를 뛰어넘을지 불분명했다. 이후 과학자들은 인간이 기후에 주는 영향을 종종 "의도치 않은 기후 조절"(inadvertent climate modification)이라고 말했다. 1980년대부터는 "지구 온난화"(global warming)와 "기후 변화"(climate change)라는 단어가 대중화되기 시작했다. 전자인 "지구 온난화"는 지상의 온도 증가만 언급하는 단어이고 후자인 "기후 변화"는 온실 기체가 기후에 미치는 전반적인 영향을 뜻하는 단어였다.
              - superscript [ref=e260]:
                - link "[24]" [ref=e261] [cursor=pointer]:
                  - /url: "#cite_note-Conway_2008-24"
                  - generic [ref=e262]: "[24]"
              - text: "\"지구 온난화\"라는 단어는 1988년"
              - link "NASA" [ref=e263] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/NASA
              - text: 의 기후과학자인
              - link "제임스 핸슨" [ref=e264] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/제임스_핸슨?action=edit&redlink=1
              - text: 이
              - link "미국 상원" [ref=e265] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/미국_상원
              - text: 증언석에서 처음 사용하면서 전반적으로 널리 쓰이기 시작했다.
              - superscript [ref=e266]:
                - link "[25]" [ref=e267] [cursor=pointer]:
                  - /url: "#cite_note-history.aip.org-25"
                  - generic [ref=e268]: "[25]"
              - text: 2000년대에는 "기후 변화"라는 단어가 대중적으로 쓰이기 시작했다.
              - superscript [ref=e269]:
                - link "[26]" [ref=e270] [cursor=pointer]:
                  - /url: "#cite_note-26"
                  - generic [ref=e271]: "[26]"
              - text: "\"지구 온난화\"는 보통 인간이 일으킨 지구의 온난화 현상을, \"기후 변화\"는 자연적인 혹은 인위적인 경우를 모두 통틀어 말했다."
              - superscript [ref=e272]:
                - link "[27]" [ref=e273] [cursor=pointer]:
                  - /url: "#cite_note-27"
                  - generic [ref=e274]: "[27]"
              - text: 또한 두 용어가 서로 혼동되거나 뜻이 뒤바뀌어 사용되기도 하였다.
              - superscript [ref=e275]:
                - link "[28]" [ref=e276] [cursor=pointer]:
                  - /url: "#cite_note-28"
                  - generic [ref=e277]: "[28]"
            - paragraph [ref=e278]:
              - text: 다양한 과학자, 정치인, 언론계 인사들은 기후 변화에 대해 이야기할 때
              - link "기후위기" [ref=e279] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후위기
              - text: (Climate crisis)나
              - link "기후 비상사태" [ref=e280] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/기후_비상사태_선언
              - text: (Climate emergency)라는 용어를, "지구 온난화" 대신 "지구 가열"(global heating)이라는 용어를 사용하기 시작했다.
              - superscript [ref=e281]:
                - link "[29]" [ref=e282] [cursor=pointer]:
                  - /url: "#cite_note-29"
                  - generic [ref=e283]: "[29]"
              - text: 영국의
              - link "가디언" [ref=e284] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/가디언
              - text: 지 편집장은 이런 용어 사용 정책을 "과학적으로 엄밀하게 이야기함을 밝힘과 동시에, 매우 중요한 이 문제를 독자와 명확하게 소통할 수 있도록 하기 위해" 편집 지침에 추가했다고 밝히기도 했다.
              - superscript [ref=e285]:
                - link "[30]" [ref=e286] [cursor=pointer]:
                  - /url: "#cite_note-30"
                  - generic [ref=e287]: "[30]"
              - text: 2019년에는
              - link "옥스퍼드 대학교 출판부" [ref=e288] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/옥스퍼드_대학교_출판부
              - text: 의 "옥스퍼드 랭기지"(Oxford Languages)가
              - link "올해의 단어" [ref=e289] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/올해의_단어
              - text: 로 "기후 비상사태"(climate emergency)를 선정하면서 이를 "기후 변화를 줄이거나 멈추고 그로 인한 잠재적으로 돌이킬 수 없는 생태학적 피해를 막기 위해 긴급한 대책이 필요한 상황"이라고 정의하였다.
              - superscript [ref=e290]:
                - link "[31]" [ref=e291] [cursor=pointer]:
                  - /url: "#cite_note-31"
                  - generic [ref=e292]: "[31]"
              - superscript [ref=e293]:
                - link "[32]" [ref=e294] [cursor=pointer]:
                  - /url: "#cite_note-32"
                  - generic [ref=e295]: "[32]"
          - region "관측된 기온 상승" [ref=e296]:
            - generic [ref=e297]:
              - heading "관측된 기온 상승" [level=2] [ref=e298]: 관측된 기온 상승
              - generic [ref=e299]:
                - text: "["
                - link "편집" [ref=e300] [cursor=pointer]:
                  - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=2
                - text: "]"
            - note [ref=e301]:
              - text: 이 부분의 본문은
              - link "측정 온도 기록" [ref=e304] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/측정_온도_기록?action=edit&redlink=1
              - text: 및
              - link "과거 2,000년간의 온도 기록" [ref=e305] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/과거_2,000년간의_온도_기록?action=edit&redlink=1
              - text: 입니다.
            - figure "과거 2,000년간의 온도 기록을 재구성한 그래프. 파랑 선은 나이테, 산호초, 북극 아이스 코어 등 간접적인 데이터를 이용해서 추정한 온도 기록이다.[33] 빨강 선은 온도계를 통해 직접적으로 관측한 온도 기록이다.[34]" [ref=e306]:
              - link [ref=e307] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/파일:Common_Era_Temperature.svg
                - img [ref=e308]
              - generic [ref=e309]:
                - text: 과거 2,000년간의 온도 기록을 재구성한 그래프. 파랑 선은 나이테, 산호초, 북극 아이스 코어 등 간접적인 데이터를 이용해서 추정한 온도 기록이다.
                - superscript [ref=e310]:
                  - link "[33]" [ref=e311] [cursor=pointer]:
                    - /url: "#cite_note-33"
                    - generic [ref=e312]: "[33]"
                - text: 빨강 선은
                - link "온도계" [ref=e313] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/온도계
                - text: 를 통해 직접적으로 관측한 온도 기록이다.
                - superscript [ref=e314]:
                  - link "[34]" [ref=e315] [cursor=pointer]:
                    - /url: "#cite_note-nasa_temperatures-34"
                    - generic [ref=e316]: "[34]"
            - paragraph [ref=e317]:
              - text: 여러 독립적인 측정 데이터세트에서는 현 지구의 기후가 온난화되고 있음을 보여주고 있다.
              - superscript [ref=e318]:
                - link "[35]" [ref=e319] [cursor=pointer]:
                  - /url: "#cite_note-35"
                  - generic [ref=e320]: "[35]"
              - text: 2011년에서 2020년 사이 10년간은 산업화 이전 기준선인 1850년-1900년 사이 평균 기온보다 평균 1.09 °C (오차 감안 0.95–1.20 °C) 상승하였다.
              - superscript [ref=e321]:
                - link "[36]" [ref=e322] [cursor=pointer]:
                  - /url: "#cite_note-36"
                  - generic [ref=e323]: "[36]"
              - text: 지상 기온은 10년마다 평균 0.2 °C 상승하고 있으며,
              - superscript [ref=e324]:
                - link "[37]" [ref=e325] [cursor=pointer]:
                  - /url: "#cite_note-37"
                  - generic [ref=e326]: "[37]"
              - text: 2020년 기준 산업화 이전보다 1.2 °C 더 상승한 상태이다.
              - superscript [ref=e327]:
                - link "[38]" [ref=e328] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEWMO20216-38"
                  - generic [ref=e329]: "[38]"
              - text: 1950년대 이후부터 전세계적으로 추운 날의 수가 더 줄어들고 있으며, 따뜻한 날의 수가 더 늘어나고 있다.
              - superscript [ref=e330]:
                - link "[39]" [ref=e331] [cursor=pointer]:
                  - /url: "#cite_note-39"
                  - generic [ref=e332]: "[39]"
            - paragraph [ref=e333]:
              - text: 18세기에서 19세기 중반 사이에는 순 온난화 현상이 거의 없었다. 이 시기의 기후 정보는 나무의
              - link "나이테" [ref=e334] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/나이테_(식물)
              - text: 나
              - link "아이스 코어" [ref=e335] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/아이스_코어
              - text: 같은
              - link "간접 관측 기록" [ref=e336] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/프록시_(기후)?action=edit&redlink=1
              - text: 을 이용해 추정한다. 이런 자료를 통해 자연적인 변화 수치가
              - link "산업 혁명" [ref=e337] [cursor=pointer]:
                - /url: //ko.wikipedia.org/wiki/산업_혁명
              - text: 초기의 영향을 상쇄시켰다는 것을 알아냈다.
