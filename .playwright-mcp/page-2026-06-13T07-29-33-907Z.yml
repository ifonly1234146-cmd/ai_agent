            - paragraph [ref=e376]:
              - text: 전 세계의 여러 지역마다 온난화의 진행 속도는 서로 다르다. 온난화 진행 속도 차이는 온실 기체가 방출되는 정도의 차이와 관계가 있는 것은 아니다. 온실 기체의 효과가 지구 전체에 골고루 퍼질 정도로 충분히 오래 유지되기 때문이다. 산업화 이전부터 육지의 평균 기온은 지구 전체의 평균 기온보다 거의 2배 빠르게 상승하였다.
