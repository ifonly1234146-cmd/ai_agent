                  - text: "["
                  - link "편집" [ref=e1649] [cursor=pointer]:
                    - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=21
                  - text: "]"
              - note [ref=e1650]:
                - text: 이 부분의 본문은
                - link "이산화 탄소 제거" [ref=e1653] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/이산화_탄소_제거
                - text: 및
                - link "탄소 격리" [ref=e1654] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/탄소_격리
                - text: 입니다.
              - figure "대부분의 이산화 탄소 배출은 식물의 생장, 토양, 바다 등 탄소 흡수원으로 흡수되었다.(2020년 세계 탄소 수지 기준)" [ref=e1655]:
                - link [ref=e1656] [cursor=pointer]:
