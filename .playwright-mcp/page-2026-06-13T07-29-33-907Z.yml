                - heading "초기 발견" [level=3] [ref=e2202]: 초기 발견
                - generic [ref=e2203]:
                  - text: "["
                  - link "편집" [ref=e2204] [cursor=pointer]:
                    - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=32
                  - text: "]"
              - figure "1912년 다음 신문 기사는 석탄을 태워서 발생한 이산화 탄소가 어떻게 지구 온난화와 기후 변화를 유발하는지 온실 효과를 짤막하게 설명하고 있다.[353]" [ref=e2205]:
                - link [ref=e2206] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/파일:19120814_Coal_Consumption_Affecting_Climate_-_Rodney_and_Otamatea_Times.jpg
                  - img [ref=e2207]
                - generic [ref=e2208]:
                  - text: 1912년 다음 신문 기사는 석탄을 태워서 발생한 이산화 탄소가 어떻게 지구 온난화와 기후 변화를 유발하는지 온실 효과를 짤막하게 설명하고 있다.
                  - superscript [ref=e2209]:
                    - link "[353]" [ref=e2210] [cursor=pointer]:
                      - /url: "#cite_note-Otamatea_Times-353"
                      - generic [ref=e2211]: "[353]"
              - paragraph [ref=e2212]:
                - text: 1820년대
                - link "조제프 푸리에" [ref=e2213] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/조제프_푸리에
                - text: 는 어떻게 지구의 기온이 태양의 에너지만으로 설명할 수 있는 온도보다 더 높았는지를 해명하기 위해
                - link "온실 효과" [ref=e2214] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/온실_효과
                - text: 라는 설명을 도입했다. 햇빛은 지구의 대기를 투명하게 지나가므로 지구 표면에 햇빛이 도달하고 이 빛은 열로 전환된다. 하지만 열은
                - link "적외선" [ref=e2215] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/적외선
                - text: 형태로 대기를 투명하게 지나갈 수 없어 지구에서 반사된 열의 일부분이 대기에 흡수되어 지구를 따듯하게 만든다.
                - superscript [ref=e2216]:
                  - link "[354]" [ref=e2217] [cursor=pointer]:
                    - /url: "#cite_note-354"
                    - generic [ref=e2218]: "[354]"
              - paragraph [ref=e2219]:
                - text: 1856년
                - link "유니스 뉴턴 푸트" [ref=e2220] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/유니스_뉴턴_푸트?action=edit&redlink=1
                - text: (Eunice Newton Foote)는 태양의 온난화 효과는 건조한 공기보다는
                - link "수증기" [ref=e2221] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/수증기
                - text: 가 함유된 공기에서 더 크며 이산화 탄소가 있으면 온난화 효과가 훨씬 커짐을 증명했다. 푸트는 "대기 중의 기체가 지구의 기온을 높게 만들 것이다"라고 말하기도 했다.
                - superscript [ref=e2222]:
                  - link "[355]" [ref=e2223] [cursor=pointer]:
                    - /url: "#cite_note-355"
                    - generic [ref=e2224]: "[355]"
                - superscript [ref=e2225]:
                  - link "[356]" [ref=e2226] [cursor=pointer]:
                    - /url: "#cite_note-356"
                    - generic [ref=e2227]: "[356]"
              - paragraph [ref=e2228]:
                - text: 1859년부터
                - link "존 틴들" [ref=e2229] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/존_틴들
                - text: 은 건조한 공기의 99%를 차지하는
                - link "질소" [ref=e2230] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/질소
                - text: 와
                - link "산소" [ref=e2231] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/산소
                - text: 가 복사열을 흡수하지 않고 투명하게 그냥 지나간다는 사실을 밝혀냈다.
                - superscript [ref=e2232]:
                  - link "[357]" [ref=e2233] [cursor=pointer]:
                    - /url: "#cite_note-357"
                    - generic [ref=e2234]: "[357]"
                - text: 하지만 수증기,
                - link "메테인" [ref=e2235] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/메테인
                - text: ", 이산화 탄소와 같은 다른 기체가 복사열을 흡수하고 그 열을 대기로 재방사한다. 틴들은 이렇게 온실 효과를 만드는 기체의 농도 변화가 과거의"
                - link "빙하기" [ref=e2236] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/빙하기
                - text: 와 같은 기후 변화를 일으켰다고 주장했다.
                - superscript [ref=e2237]:
                  - link "[358]" [ref=e2238] [cursor=pointer]:
                    - /url: "#cite_note-358"
                    - generic [ref=e2239]: "[358]"
              - paragraph [ref=e2240]:
                - link "스반테 아레니우스" [ref=e2241] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/스반테_아레니우스
                - text: 는 대기 중의 수증기량은 지속적으로 변화하지만 대기 중 이산화 탄소의 농도는 장기간의 지질학적 과정에 큰 영향을 받는다고 주장했다. 이산화 탄소 증가로 인한 온난화는 수증기양을 증가시켜 양성 피드백 루프를 통해 온난화를 더욱 증폭시킨다. 1896년 아레니우스는 이산화 탄소의 양이 그 절반으로 줄어들면
                - link "빙하기" [ref=e2242] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/빙하기
                - text: 시작 수준으로 기온이 감소할 수 있다고 예측한 최초의 기후모델을 발표했다. 아레니우스는 이산화 탄소의 농도가 두배로 증가할 경우 기온 상승 정도가 5–6 °C에 달할 것이라고 예측했다.
                - superscript [ref=e2243]:
                  - link "[359]" [ref=e2244] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELapenis1998-359"
                    - generic [ref=e2245]: "[359]"
                - text: 다른 과학자들은 처음에 이 주장을 회의적으로 받아들였고 온실 효과의 포화 때문에 이산화 탄소 농도의 증가가 기온에 아무 영향이 없을 것이며 기후는 스스로 원 상태로 조절될 수 있다고 생각했다.
                - superscript [ref=e2246]:
                  - link "[360]" [ref=e2247] [cursor=pointer]:
                    - /url: "#cite_note-Weart_The_Carbon_Dioxide_Greenhouse_Effect-360"
                    - generic [ref=e2248]: "[360]"
                - text: 1938년
                - link "가이 스튜어트 켈런더" [ref=e2249] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/가이_스튜어트_켈런더?action=edit&redlink=1
                - text: 는 기후가 온난화되고 있으며 이산화 탄소 농도가 증가중이라는 증거를 발표했으나,
                - superscript [ref=e2250]:
                  - link "[361]" [ref=e2251] [cursor=pointer]:
                    - /url: "#cite_note-361"
                    - generic [ref=e2252]: "[361]"
                - text: 켈런더의 계산은 반대자의 의견에도 맞는 논리였다.
                - superscript [ref=e2253]:
                  - link "[360]" [ref=e2254] [cursor=pointer]:
                    - /url: "#cite_note-Weart_The_Carbon_Dioxide_Greenhouse_Effect-360"
                    - generic [ref=e2255]: "[360]"
            - region "학계의 합의 형성 과정" [ref=e2256]:
              - generic [ref=e2257]:
                - heading "학계의 합의 형성 과정" [level=3] [ref=e2258]: 학계의 합의 형성 과정
                - generic [ref=e2259]:
                  - text: "["
                  - link "편집" [ref=e2260] [cursor=pointer]:
                    - /url: /w/index.php?title=%EA%B8%B0%ED%9B%84%EB%B3%80%ED%99%94&action=edit&section=33
                  - text: "]"
              - note [ref=e2261]:
                - text: 이 부분의 본문은
                - link "기후 변화의 과학적 합의" [ref=e2264] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/기후_변화의_과학적_합의
                - text: 입니다.
              - paragraph [ref=e2265]:
                - text: 1950년대
                - link "길버트 플러스" [ref=e2266] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/길버트_플러스?action=edit&redlink=1
                - text: 는 다양한 대기층과 적외선 대역을 포함한 상세한 컴퓨터 기후 모델을 만들었다. 이 모델에서는 이산화 탄소 농도가 증가하면 온난화 현상이 발생한다고 예측했다. 비슷한 시기
                - link "한스 쉬스" [ref=e2267] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/한스_쉬스?action=edit&redlink=1
                - text: 는 이산화 탄소 농도가 증가하는 중이라는 증거를 발견했으며,
                - link "로저 레빌" [ref=e2268] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/로저_레빌?action=edit&redlink=1
                - text: 은 해양이 증가한 이산화 탄소를 전부 흡수하지 못한다는 수치를 보여주었다. 이후 두 과학자는
                - link "찰스 데이비드 킬링" [ref=e2269] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/찰스_데이비드_킬링
                - text: 과 함께 지속적으로 대기 중의 증가하는 이산화 탄소 농도를 그린 그래프인 "
                - link "킬링 곡선" [ref=e2270] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/킬링_곡선
                - text: "\"을 그리는 일을 도와주었다."
                - superscript [ref=e2271]:
                  - link "[360]" [ref=e2272] [cursor=pointer]:
                    - /url: "#cite_note-Weart_The_Carbon_Dioxide_Greenhouse_Effect-360"
                    - generic [ref=e2273]: "[360]"
                - text: 이후 과학자들은 대중에게 경고하기 시작했고
                - superscript [ref=e2274]:
                  - link "[362]" [ref=e2275] [cursor=pointer]:
                    - /url: "#cite_note-362"
                    - generic [ref=e2276]: "[362]"
                - text: 그 위험성은 1988년 제임스 한센이 미국 의회에서 증언하면서 강조되었다.
                - superscript [ref=e2277]:
                  - link "[363]" [ref=e2278] [cursor=pointer]:
                    - /url: "#cite_note-history.aip.org2-363"
                    - generic [ref=e2279]: "[363]"
                - text: 1988년에는 세계 각국 정부에게 공식적인 조언을 제공하고
                - link "학제간 연구" [ref=e2280] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/학제간_연구
                - text: 에 박차를 가하기 위해 유엔의 전문 기관인
                - link "기후 변화에 관한 정부간 협의체" [ref=e2281] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/기후_변화에_관한_정부간_협의체
                - text: (IPCC)가 세워졌다.
                - superscript [ref=e2282]:
                  - link "[364]" [ref=e2283] [cursor=pointer]:
                    - /url: "#cite_note-364"
                    - generic [ref=e2284]: "[364]"
                - text: IPCC 보고서 내에서 과학자들은
                - link "동료평가" [ref=e2285] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/동료평가
                - text: 된
                - link "과학 학술지" [ref=e2286] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/과학_학술지
                - text: 에 실린 여러 과학적 토의를 평가한다.
                - superscript [ref=e2287]:
                  - link "[365]" [ref=e2288] [cursor=pointer]:
                    - /url: "#cite_note-365"
                    - generic [ref=e2289]: "[365]"
              - paragraph [ref=e2290]:
                - text: 기후가 점점 온난화되고 있으며 이 온난화가 인간의 활동으로 발생한다는 결론은 거의 완전히 과학적 합의를 이루었다. 2019년 기준 문헌과 논문에 따른 과학적 합의 정도는 99% 이상이다.
                - superscript [ref=e2291]:
                  - link "[366]" [ref=e2292] [cursor=pointer]:
                    - /url: "#cite_note-Powell2019-366"
                    - generic [ref=e2293]: "[366]"
                - superscript [ref=e2294]:
                  - link "[367]" [ref=e2295] [cursor=pointer]:
                    - /url: "#cite_note-:5-367"
                    - generic [ref=e2296]: "[367]"
                - text: 국내, 혹은 국제적으로 권위를 가진 과학 단체 중 이 견해에 부정하는 곳은 존재하지 않는다.
                - superscript [ref=e2297]:
                  - link "[368]" [ref=e2298] [cursor=pointer]:
                    - /url: "#cite_note-368"
                    - generic [ref=e2299]: "[368]"
                - text: 또한 기후 변화의 영향으로부터 사람들을 보호하기 위해 어떤 형태로든 조치가 필요하다는 합의는 더욱 발전하였다. 각국의 국립 과학 아카데미는 세계 지도자들에게 온실 기체 배출량을 줄이라고 요구했다.
                - superscript [ref=e2300]:
                  - link "[369]" [ref=e2301] [cursor=pointer]:
                    - /url: "#cite_note-369"
                    - generic [ref=e2302]: "[369]"
                - text: 2021년 IPCC 평가 보고서에서는 기후 변화가 인간이 야기했다는 점이 "매우 명백하다"(unequivocal)고 말했다.
                - superscript [ref=e2303]:
                  - link "[367]" [ref=e2304] [cursor=pointer]:
                    - /url: "#cite_note-:5-367"
                    - generic [ref=e2305]: "[367]"
