                - text: 도 빠르게 녹아 메테인과 이산화 탄소를 대기중으로 방출한다.
                - superscript [ref=e768]:
                  - link "[113]" [ref=e769] [cursor=pointer]:
                    - /url: "#cite_note-Turetsky_2019-113"
                    - generic [ref=e770]: "[113]"
                - text: 기후 변화는
