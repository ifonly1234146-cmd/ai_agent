                  - text: 은 내려쬐는 일사량의 50-70%를 다시 반사하는 반면 그보다 어두운 색깔의
                  - link "바다" [ref=e718] [cursor=pointer]:
                    - /url: //ko.wikipedia.org/wiki/바다
                  - text: 는 6%만 반사하므로 해빙이 녹는 것은 자기 강화 피드백(양성 피드백)에 속한다. 사진은 녹고 있는 북극의 해빙.
                  - superscript [ref=e719]:
                    - link "[102]" [ref=e720] [cursor=pointer]:
                      - /url: "#cite_note-102"
                      - generic [ref=e721]: "[102]"
              - paragraph [ref=e722]:
                - text: 초기 위에서 나열한 여러 강제력으로 입력을 준 기후계의 반응은
                - link "피드백" [ref=e723] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/피드백
                - text: 을 통해 조정된다. 피드백으로는 자기 강화 피드백, 즉
                - link "양성 피드백" [ref=e724] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/양성_피드백
                - text: 으로 반응이 더 커지고 반대로
                - link "음성 피드백" [ref=e725] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/음성_피드백
                - text: 으로는 반응이 약해진다.
                - superscript [ref=e726]:
                  - link "[103]" [ref=e727] [cursor=pointer]:
                    - /url: "#cite_note-103"
                    - generic [ref=e728]: "[103]"
                - text: 기후계의 주요 양성 피드백에는 수증기 피드백,
                - link "얼음-반사율 피드백" [ref=e729] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/얼음-반사율_피드백?action=edit&redlink=1
                - text: ", 구름의 순효과 반응이 속한다."
                - superscript [ref=e730]:
                  - link "[104]" [ref=e731] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEUSGCRP_Chapter_2201789–91-104"
                    - generic [ref=e732]: "[104]"
                - superscript [ref=e733]:
                  - link "[105]" [ref=e734] [cursor=pointer]:
                    - /url: "#cite_note-105"
                    - generic [ref=e735]: "[105]"
                - text: 지구의 일차적인 음성 피드백으로는
                - link "복사냉각" [ref=e736] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/복사냉각
                - text: 반응으로 지구의 표면 온도가 상승하면 그에 따라 더 많은 복사열을 우주로 방출한다.
                - superscript [ref=e737]:
                  - link "[106]" [ref=e738] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEUSGCRP_Chapter_2201789–90-106"
                    - generic [ref=e739]: "[106]"
                - text: 온도 피드백 외에도 식물 생장에 대한
                - link "이산화 탄소의 비료 효과" [ref=e740] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/이산화_탄소_비료_효과?action=edit&redlink=1
                - text: 와 같이 탄소 순환과 같은 피드백도 있다.
