              - text: 를 통한 직접적인 기온 관측 기록은 1850년대 경부터 전 세계에 나오기 시작했다.
              - superscript [ref=e342]:
                - link "[41]" [ref=e343] [cursor=pointer]:
                  - /url: "#cite_note-AR5_WG1_SPM_p4-5-41"
                  - generic [ref=e344]: "[41]"
              - text: 그 이전
