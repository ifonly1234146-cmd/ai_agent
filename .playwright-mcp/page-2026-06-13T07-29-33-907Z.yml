                  - text: 하여 나열한 모습. 장기적인 온난화 추세선이 빨강 선으로 표시되어 있는데, 이 중 짧은 기간의 정체 추세선인 파랑 선이 보인다. 중간의 파란 점은 흔히 말하는 '
