                - text: 와 같은 유기물을 통해 격리될 경우 토지 이용의 변화,
                - link "산불" [ref=e1680] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/산불
                - text: 혹은 생태계의 기타 여러 변화를 통해 격리되었던 탄소가 대기중으로 다시 방출될 위험성도 존재한다.
                - superscript [ref=e1681]:
                  - link "[266]" [ref=e1682] [cursor=pointer]:
                    - /url: "#cite_note-266"
                    - generic [ref=e1683]: "[266]"
              - paragraph [ref=e1684]:
                - text: 에너지 생산이나 이산화 탄소 집약적인
                - link "중공업" [ref=e1685] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/중공업
                - text: 의 경우 산업 생산 과정에서 발생한 불필요한 이산화 탄소를 모아다가 포집하여 대기중으로 방출하지 않고 따로 저장할 수 있다. 이런 이산화 탄소 포집 기술은 규모 면에서도 매우 제한적이고 비용도 매우 비싸지만
                - superscript [ref=e1686]:
                  - link "[267]" [ref=e1687] [cursor=pointer]:
                    - /url: "#cite_note-267"
                    - generic [ref=e1688]: "[267]"
                - link "탄소 포집 및 저장" [ref=e1689] [cursor=pointer]:
                  - /url: //ko.wikipedia.org/wiki/탄소_포집_및_저장
                - text: (CCS) 기술은 21세기 중반까지 이산화 탄소 배출을 제한하는 데 중요한 역할을 할 것이다.
                - superscript [ref=e1690]:
                  - link "[268]" [ref=e1691] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBuiAdjimanBardowAnthony20181068-268"
                    - generic [ref=e1692]: "[268]"
                - text: 탄소 포집과 저장 기술은 바이오 기술과 융합하여(BECCS) 이산화 탄소 순배출량을 음의 값으로 만들어 역으로 대기 중의 이산화 탄소를 뽑아다가 저장할 수도 있다.
                - superscript [ref=e1693]:
                  - link "[269]" [ref=e1694] [cursor=pointer]:
                    - /url: "#cite_note-269"
                    - generic [ref=e1695]: "[269]"
                - text: 하지만 BECCS와 같은 기술이 온난화 수준을 1.5 °C 이내로 제한하는데 큰 역할을 할 수 있을진 불분명하다. 이산화 탄소 제거에 의존하는 정책 결정은 의사결정을 방만하게 만들어 국제적인 목표치를 넘어선 전지구적 온난화 위험성을 높인다.
                - superscript [ref=e1696]:
