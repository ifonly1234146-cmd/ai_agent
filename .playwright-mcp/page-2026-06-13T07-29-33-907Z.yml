                  - text: "'Climate change' and 'global warming' are often used interchangeably but have distinct meanings. ... Global warming refers to the upward temperature trend across the entire Earth since the early 20th century ... Climate change refers to a broad range of global phenomena ...[which] include the increased temperature trends described by global warming.\";"
