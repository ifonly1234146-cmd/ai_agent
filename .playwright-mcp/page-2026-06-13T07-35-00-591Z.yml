              - paragraph [ref=e380]: 위 불법 임금삭감이 논란이 되자 SK하이닉스는 취업규칙 변경을 위한 설명회를 개최하고 직원들의 동의를 받기로 하였으나 이 과정에서 여러 가지 논란을 빚었다.
              - list [ref=e381]:
                - listitem [ref=e382]: 취업규칙 변경을 위한 찬반 투표라는 점을 밝히지 않음 회사 측에서는 취업규칙 개정을 위한 찬반 투표를 시행한다는 점을 명확히 밝힐 필요가 있으나 이런 설명을 하지 않았으며, 'Commitment를 구하는 절차' 등의 모호한 문구로 포장하여 근로자들이 투표의 본질을 알 수 없도록 하였다. 일부 조직 리더들은 서명하는 것이 동의한다는 뜻이 아니며 설명회 영상을 시청하였다는 의미라고 설명하여 적극적인 은폐 시도를 하였다.
                - listitem [ref=e383]: 취업규칙의 개정안을 제시하지 않은 상태에서 서명을 받음. 통상적으로 각종 조약, 규정 등을 변경할 때에는 변경 전과 후의 규칙을 대조하여 제시함으로써 어느 부분이 변경되었는지 파악하기 쉽게 제시하는 것이 관례이다. 하지만 이 서명 절차에서는 변경 전과 후의 내용이 빠진 채 서명을 받았다. 변경 전의 조항은 사내 시스템에서 조회할 수 있지만 대다수 직원들은 해당 조항을 어디서 찾아볼 수 있는지조차 알지 못했다. 변경 후의 조항을 제시하지 않은 상태에서 서명을 받았으므로 이러한 서명과 이에 따른 규정 변경은 당연히 효력이 없다. 심지어 추후 공개된 변경 후 조항에는 '본 내용의 변경은 Self-Design 시작 시점부터 유효'라는 문구가 삽입되었는데 이는 설명회에서 전혀 언급하지 않았던 내용이다. 그러므로 이러한 소급 적용도 당연히 효력이 없다.
                - listitem [ref=e384]: 동의 절차에서 찬성/반대 중 선택이 불가능하고 '동의'를 의미하는 서명만 가능하도록 되어 있었다.
                - listitem [ref=e385]: 비밀투표 원칙이 지켜지지 않아 근로자들이 자유롭게 자신의 의견을 표현할 기회를 박탈당했다. 인사권자가 근로자 개개인의 동의 여부를 실시간으로 파악하며 수시로 동의를 강요하였다.
                - listitem [ref=e386]: 온라인으로 진행된 설명회 동영상을 시청하기 위해 캡처 방지 등의 각종 보안 프로그램을 설치하도록 하고, 설명회 자료를 배포하지 않는 등, 변경된 임금 규정에 대한 내용이 퍼지지 않도록 은폐하려는 정황이 있었다.
                - listitem [ref=e387]: 설명회를 진행하고, 직원들이 내용을 충분히 이해하고 서로 논의할 시간을 가질 수 있도록 하는 것이 상식적이나, 회사 측은 설명회 진행 당일 서명을 완료할 것을 강요하였다.
                - listitem [ref=e388]: 회사 측에서 설명회와 동의 절차의 본질을 은폐하기 위해 여러 가지 시도를 하였기 때문에 실제로 많은 직원들이 자신의 의사에 반하여 동의 서명을 하였다. 취업규칙 변경 투표라는 사실을 모른 채 단순히 '열심히 일하겠다'는 일종의 윤리서약인 줄 알고 서명한 직원도 있고 서명하고 싶지 않지만 인사권자의 강요에 의해 어쩔 수 없이 서명을 한 직원도 있다. 추후에 속은 것을 알게 된 많은 직원들이 진짜 의사를 표현하기 위해 서명에 대해 번복하고 싶다는 의사를 표현하였으나, HR 담당부서에서는 정당한 사유 없이 로 거부하였다.
              - paragraph [ref=e389]: 정당한 절차를 거치지 않고 도입된 절차를 사후에 정당화 하기 위하여 위와 같이 설명회와 동의 절차를 진행하였으나, 위에 언급한 여러 가지 절차상의 하자로 인하여, 이러한 동의 절차는 법적인 효력이 없다.
              - paragraph [ref=e390]:
                - text: 회사 측의 불법적인 취업규칙 변경으로 임금 삭감 등의 불이익을 받은 근로자는 차후 그 손실 임금액을 회사 측에 청구할 수 있다. 물론, 재직 중에 회사를 상대로 소송을 하는 것은 매우 어려운 일이므로 퇴사 후에 단체로 소송을 제기할 수 있다. 현재 회사 측에서 진행한 동의 절차는 법적 효력을 갖기 위한 요건을 갖추지 못하였기 때문에, 차후에 적법한 절차를 갖추어 다시 동의 절차를 진행할 것으로 예상된다. 하지만 차후에 적법한 절차를 거쳐 취업규칙이 변경되더라도, 해당 취업규칙 변경에 동의하지 않은 근로자에게는 개정된 취업규칙과, 취업규칙 변경 이전에 맺은 근로계약서의 내용 중 더 유리한 내용이 우선 적용된다.
