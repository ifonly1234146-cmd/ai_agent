              - paragraph [ref=e366]: SK하이닉스의 사무직 취업규칙인 '연봉제 급여규칙'에 따르면 직원의 인사평가 결과에 따라 급여를 5단계로 차등하여 계약 연봉의 90%에서 110%까지 지급받도록 되어 있다. 그러나 2018년 'Self-Design' 제도를 도입하여, 인사권자가 직원 개인의 급여를 임의로 조정하여 지급할 수 있도록 하였다. 이 제도 하에서는 동일한 고과를 받더라도 부서 간, 개인 간 임금의 차등이 발생한다. 조직장이 한정된 예산을 자기 휘하 직원들에게 분배하는 제로섬이다. 이 임금 조정은 객관적인 근거나 기준 없이 100% 조직장의 주관적인 판단으로 이루어진다. 새로 도입된 임금제도 하에서 보장된 임금은 계약연봉의 60%에 불과하다. 실제로 평균 수준의 인사고과를 받았음에도 불구하고 계약연봉보다 10% 이상 삭감된 급여를 받는 사례가 보고되었다.
              - paragraph [ref=e367]: 회사 측의 이 같은 제도 도입은 취업규칙을 근로자에게 불리하게 변경하는 경우에는 근로자 과반수의 동의를 받도록 한 근로기준법 제94조 1항에 위배되는 명백한 위법 행위이다. 제도 시행 후 3년이 지난 2020년 하반기, SK하이닉스 기술사무직 노동조합은 경기지방노동위원회에 진정서를 제출하고 회사 측에 공문을 발송하여 입장 표명을 요구하였다. 이에 회사 측은 직원들의 동의를 거쳐 취업규칙을 변경하기 위한 목적으로 'Self-Design' 제도에 대한 설명회를 개최하고 직원들의 동의 절차를 진행하려 하였으나, 이 과정에서 불투명한 진행 방식과 강압적인 동의 강요 등으로 더 큰 논란이 빚었다.
              - paragraph [ref=e368]:
                - text: SK하이닉스의 사무직 취업규칙인 '연봉제 급여규칙'에 따르면 직원의 인사평가 결과에 따라 급여를 5단계로 차등하여 계약 연봉의 90%에서 110%까지 지급받도록 되어 있다. 그러나 2018년 'Self-Design' 제도를 도입하여, 인사권자가 직원 개인의 급여를 인사평가 결과에 따른 금액보다 임의로 삭감하여 지급할 수 있도록 하였다. 이는 취업규칙을 근로자에게 불리하게 변경하는 경우에는 근로자 과반수의 동의를 받도록 한 근로기준법 제94조 1항[6]에 위배되는 조치이다. 제도 시행 후 3년이 지난 2020년 하반기, SK하이닉스 기술사무직 노동조합은 경기지방노동위원회에 진정서를 제출하고 회사 측에 공문을 발송하여 입장 표명을 요구하였다. 이에 SK하이닉스는 'Self-Design' 제도에 대한 설명회를 개최하고 직원들의 동의 절차를 진행하려 하였으나, 이 과정에서 불투명한 진행 방식과 강압적인 동의 강요 등으로 논란이 되었다.
